topology:
  networks:
    - {name: app, cidr: 10.20.0.0/24}
  hosts:
    - name: node2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: app, name: app0}]
    - name: app1
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: app, name: app0}]
    - name: app2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: app, name: app0}]
checks:
  - check_id: every-request-answered
    kind: command
    target: node2
    description: HAProxy runs, starts at boot, and answers every request on port 8080.
    parameters:
      timeout_seconds: 60
      script: |
        systemctl is-active --quiet haproxy.service || fail "haproxy is not running"
        systemctl is-enabled --quiet haproxy.service || fail "haproxy does not start at boot"
        failures=
        all_answered() {
          local count=0 body status
          for _ in {1..10}; do
            body=$(curl --silent --max-time 3 --write-out '\n%{http_code}' http://127.0.0.1:8080/)
            status=${body##*$'\n'}
            if [[ $status != 200 ]]; then
              count=$((count + 1))
              body=$(sed 's/<[^>]*>//g; /^$/d' <<<"${body%$'\n'*}" | head -n 1)
              failures="$count of 10 requests failed; the last got $status: $body"
            fi
          done
          (( count == 0 ))
        }
        retry 15 all_answered || fail "$failures"
  - check_id: pool-health-checked
    kind: command
    target: node2
    description: The pool keeps app1 and app2 and takes app2 out of rotation by health check.
    parameters:
      sudo: true
      timeout_seconds: 60
      script: |
        server_state() {   # server_state SERVER: print "status check_status" for one pool member
          echo 'show stat' | socat stdio /var/lib/haproxy/stats 2>/dev/null | awk -F, -v server="$1" '
            NR == 1 { for (i = 1; i <= NF; i++) column[$i] = i; next }
            $1 == "app_servers" && $2 == server { print $column["status"] "|" $column["check_status"] }'
        }
        [[ -S /var/lib/haproxy/stats ]] || fail "HAProxy's stats socket /var/lib/haproxy/stats is missing"
        [[ -n $(server_state app1) ]] || fail "app1 is not in the app_servers pool"
        [[ -n $(server_state app2) ]] || fail "app2 is not in the app_servers pool, so it will never get traffic again"
        app2_down() { [[ $(server_state app2) == "DOWN|L7STS" ]]; }
        if ! retry 15 app2_down; then
          IFS='|' read -r status check <<<"$(server_state app2)"
          case $status in
            MAINT*) fail "app2 is disabled by hand, so it will not come back when it is healthy" ;;
            "no check") fail "app2 is in rotation with no health check at all" ;;
            DOWN*) [[ $check == L4* ]] && fail "HAProxy cannot connect to app2 at all (check result $check)" ;;&
            UP*) fail "app2 is in rotation although its /health answers 503 (its check result: $check)" ;;
            *) fail "app2 is $status, check result ${check:-none}; expected DOWN by a failed HTTP check" ;;
          esac
        fi
        IFS='|' read -r status check <<<"$(server_state app1)"
        [[ $status == UP* ]] || fail "app1 is $status (check result ${check:-none}); expected UP"
  - check_id: selinux-still-enforcing
    kind: command
    target: node2
    description: SELinux is enforcing and haproxy_t is not permissive.
    parameters:
      sudo: true
      script: |
        expect_eq "$(getenforce)" Enforcing "the SELinux mode"
        ! semanage permissive -l 2>/dev/null | grep -qw haproxy_t || fail "the haproxy_t domain is permissive"
persistence:
  reboot: true
  hosts: [node2]
setup: actions/reverse-proxy-pool-recovery.setup.yaml
reference_solution: actions/reverse-proxy-pool-recovery.solution.yaml
alternate_solutions: [actions/reverse-proxy-pool-recovery.alternate.yaml]
rejected_solutions:
  - actions/reverse-proxy-pool-recovery.rejected-boolean-until-reboot.yaml
  - actions/reverse-proxy-pool-recovery.rejected-drop-app2.yaml
