schema_version: 1
scenario_id: reverse-proxy-pool-recovery
version: 2
status: verified
title: Every request through the proxy fails
summary: A load balancer broke when its backends moved ports, and it keeps sending traffic to a server in maintenance.
estimated_minutes: 40
task_type: troubleshoot
difficulty: advanced
task: |
  **node2** runs HAProxy on port 8080 in front of two application servers, **app1**
  (10.20.0.11) and **app2** (10.20.0.12). Last night the application moved from port 80
  to 8081, and the proxy configuration was updated to match. Since then every request to
  `http://node2:8080/` fails:

  ```text
  <html><body><h1>503 Service Unavailable</h1>
  No server is available to handle this request.
  </body></html>
  ```

  Both application servers answer on port 8081 when you ask them directly. The
  application team adds one more thing: when they put a server into maintenance, its
  `/health` endpoint answers 503, and the proxy should stop sending it traffic until
  `/health` answers 200 again. app2 is in maintenance right now.

  Fix the proxy on node2, with SELinux left enforcing.
requirements:
  - "HAProxy on node2 runs, starts at boot, and answers every request on port 8080 successfully."
  - "The pool still contains app1 and app2, and HAProxy itself takes a server out of rotation while its `/health` does not answer 200 (app2, right now)."
  - "SELinux stays enforcing, and HAProxy's domain is not made permissive."
  - "All of this still holds after node2 reboots."
hints:
  - "Check what the proxy sees, not only what it serves: `journalctl -u haproxy` and `sudo ausearch -m AVC -ts recent`. A proxy is a network client of its backends, and SELinux decides which ports it may connect to."
  - "`semanage port -l | grep -w 8081` shows how the new port is labeled; `getsebool -a | grep haproxy` lists HAProxy's booleans. A boolean set without `-P` lasts until the next reboot."
  - "A `server` line without `check` is always assumed healthy. `option httpchk` makes the checks HTTP requests instead of bare TCP connections; see the HAProxy configuration manual under `/usr/share/doc/haproxy`. `echo 'show servers state' | sudo socat stdio /var/lib/haproxy/stats` shows what HAProxy thinks of each server."
debrief: |
  ## What was wrong

  **SELinux.** HAProxy runs as `haproxy_t`, which may connect to web ports such as
  `http_port_t` and `http_cache_port_t`. Port 8081 is labeled `transproxy_port_t`, so
  every connection to the backends was denied:

  ```text
  avc:  denied  { name_connect } for  pid=1663 comm="haproxy" dest=8081
    scontext=system_u:system_r:haproxy_t:s0 tcontext=system_u:object_r:transproxy_port_t:s0
    tclass=tcp_socket permissive=0
  ```

  `sealert` puts it as "SELinux is preventing /usr/sbin/haproxy from name_connect access on
  the tcp_socket port 8081." HAProxy's own log was no help: it logs to `/dev/log`, which does
  not exist inside its chroot.

  **The pool had no health checks.** With SELinux fixed, HAProxy sent every other request
  to app2, which answers 503 in maintenance.

  ## A clean fix

  ```bash
  sudo semanage port -m -t http_port_t -p tcp 8081
  ```

  ```text
  backend app_servers
      balance roundrobin
      option httpchk GET /health
      server app1 10.20.0.11:8081 check
      server app2 10.20.0.12:8081 check
  ```

  ```bash
  sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
  ```

  `-m` modifies the label of a port the policy already defines; `-a` refuses because 8081
  is taken. `setsebool -P haproxy_connect_any 1` is the documented alternative; it lets
  HAProxy connect to any port, which is broader than one relabeled port. With `check` and
  `option httpchk`, HAProxy requests `/health` every two seconds; after three failures a
  server is `DOWN` and gets no traffic, and after two successes it is back.

  ## Check it yourself

  ```bash
  for i in $(seq 6); do curl -s http://127.0.0.1:8080/; done
  echo 'show stat' | sudo socat stdio /var/lib/haproxy/stats | cut -d, -f1,2,18,37
  getsebool haproxy_connect_any; sudo semanage port -l -C
  ```

  ## Tempting but wrong

  - **`setsebool haproxy_connect_any 1` without `-P`.** Everything works until the next
    reboot.
  - **Deleting app2 from the pool.** Every request succeeds today, and app2 never gets
    traffic again, even when the application team finishes maintenance.
  - **`check` without `option httpchk`.** HAProxy then only checks that port 8081 accepts
    connections, and a server in maintenance does.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: networking.proxies-load-balancers
    title: Configure reverse proxies and load balancers
sources:
  - kind: scope
    title: Linux Foundation LFCS competencies
    url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  - kind: upstream
    title: HAProxy configuration manual, option httpchk and check
    url: https://docs.haproxy.org/3.0/configuration.html
