    man_page: podman-systemd.unit(5)
  - kind: man-page
    title: OnCalendar and Persistent
    man_page: systemd.timer(5)
topology:
  hosts:
    - {name: node2, image: rocky-10.2-lab-v2, memory_mib: 1536, vcpus: 2}
checks:
  - check_id: assets-from-the-repository
    kind: command
    target: node2
    description: lal-worker-assets is installed from lal-worker, which stays enabled with signature checking.
    parameters:
      sudo: true
      timeout_seconds: 60
      script: |
        rpm -q lal-worker-assets >/dev/null || fail "lal-worker-assets is not installed"
        settings=$(dnf config-manager --dump lal-worker 2>/dev/null) || fail "dnf does not know a repository called lal-worker"
        expect_eq "$(sed -n 's/^enabled = //p' <<<"$settings")" 1 "enabled for lal-worker"
        expect_eq "$(sed -n 's/^gpgcheck = //p' <<<"$settings")" 1 "gpgcheck for lal-worker"
        expect_eq "$(dnf -q repoquery --installed --qf '%{from_repo}' lal-worker-assets 2>/dev/null)" lal-worker "the repository the assets came from"
  - check_id: approved-configuration
    kind: command
    target: node2
    description: The settings match approved-worker through a new commit on main, with history kept and a clean worktree.
    parameters:
      sudo: true
      script: |
        cd /etc/lal-automation 2>/dev/null || fail "/etc/lal-automation is missing"
        expect_eq "$(git symbolic-ref --short HEAD 2>/dev/null || echo 'a detached HEAD')" main "the checked-out branch"
        git merge-base --is-ancestor "$(cat /usr/share/lal-automation/unapproved-commit)" HEAD 2>/dev/null ||
          fail "the unapproved commit is no longer in main's history"
        git diff --quiet approved-worker HEAD -- worker.conf || fail "worker.conf in HEAD differs from approved-worker"
        dirty=$(git status --porcelain | head -n 1)
        [[ -z $dirty ]] || fail "the worktree is not clean: $dirty"
  - check_id: worker-producing
    kind: command
    target: node2
    description: lal-automation.service runs the container, which reports site=amman assets=2.1.
    parameters:
      sudo: true
      timeout_seconds: 30
      script: |
        running() { [[ $(podman inspect --format '{{.State.Running}}' lal-automation 2>/dev/null) == true ]]; }
        systemctl is-active --quiet lal-automation.service && retry 10 running ||
          fail "lal-automation is not running: $(journalctl -u lal-automation.service -o cat --no-pager | grep -E '^(Error|lal-worker):' | tail -n 1)"
        expect_eq "$(cat /var/lib/lal-automation/ready 2>/dev/null)" "site=amman assets=2.1" "what the worker reports"
  - check_id: refresh-schedule
    kind: command
    target: node2
    description: The refresh timer is enabled, fires every 15 minutes, and catches up on missed runs.
    parameters:
      script: |
        systemctl is-enabled --quiet lal-automation-refresh.timer || fail "lal-automation-refresh.timer is not enabled"
        systemctl is-active --quiet lal-automation-refresh.timer || fail "lal-automation-refresh.timer is not active"
        expect_eq "$(unit_value lal-automation-refresh.timer Persistent)" yes "Persistent for the refresh timer"
        mapfile -t upcoming < <(unit_value lal-automation-refresh.timer TimersCalendar |
          grep -o 'OnCalendar=[^;]*' | sed 's/^OnCalendar=//; s/ *$//' |
          while IFS= read -r expression; do
            systemd-analyze calendar --iterations=8 "$expression" 2>/dev/null |
              sed -n 's/^ *\(Next elapse\|Iteration #[0-9]*\): *//p'
          done | while IFS= read -r moment; do date -u -d "$moment" +%s; done | sort -n -u | head -n 8)
        (( ${#upcoming[@]} == 8 )) || fail "the refresh timer has no recurring calendar schedule"
        for ((i = 1; i < 8; i++)); do
          expect_eq "$((upcoming[i] - upcoming[i - 1]))" 900 "the interval between refreshes in seconds"
        done
  - check_id: refresh-ran
    kind: file
    target: node2
    description: The refresh has run at least once.
    parameters: {path: /var/lib/lal-automation/refreshed, kind: file}
persistence:
  reboot: true
  hosts: [node2]
setup: actions/automated-container-worker.setup.yaml
reference_solution: actions/automated-container-worker.solution.yaml
alternate_solutions: [actions/automated-container-worker.alternate.yaml]
rejected_solutions:
  - actions/automated-container-worker.rejected-reset-history.yaml
  - actions/automated-container-worker.rejected-repository-enabled-once.yaml
