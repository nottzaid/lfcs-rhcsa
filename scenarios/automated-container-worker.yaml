schema_version: 1
scenario_id: automated-container-worker
version: 2
status: verified
title: The report worker has produced nothing for a week
summary: A containerized worker fails on a package that cannot be installed, runs unapproved settings, and is never refreshed.
estimated_minutes: 50
task_type: troubleshoot
difficulty: exam
task: |
  The nightly report worker on **node2** runs as a Podman container, `lal-automation`,
  defined as a Quadlet unit, `lal-automation.service`. It has produced nothing since last
  week's migration. How it is supposed to work:

  - it reads its reference data from the package `lal-worker-assets`, which comes from
    node2's internal repository `lal-worker` (node2 is air-gapped; packages are verified
    against the automation team's signing key);
  - its settings live in the Git repository `/etc/lal-automation`; only the configuration
    tagged `approved-worker` may run, and changes are made as new commits, never by
    rewriting history;
  - when it is up, it records what it serves in `/var/lib/lal-automation/ready`;
  - `lal-automation-refresh.timer` refreshes its reference data every 15 minutes, and
    catches up on refreshes missed while node2 was down.

  Get the worker producing again, the way the runbook says.
requirements:
  - "`lal-worker-assets` is installed from `lal-worker`, which stays enabled, with signature checking on, for future updates."
  - "The worker runs the approved configuration: `/etc/lal-automation` matches `approved-worker`, through a new commit on `main`; the unapproved commit stays in the history, and the worktree is clean."
  - "`lal-automation.service` runs the `lal-automation` container, and `/var/lib/lal-automation/ready` reports `site=amman assets=2.1`."
  - "`lal-automation-refresh.timer` is enabled, fires every 15 minutes, and catches up on missed runs; the refresh has run at least once."
  - "All of this still holds after node2 reboots."
hints:
  - "Start with the worker itself: `systemctl status lal-automation` and `journalctl -u lal-automation` say why its container does not start. `dnf repolist --all` shows every repository, enabled or not."
  - "`git log --oneline --decorate` and `git diff approved-worker` show what changed since the approved configuration. `git restore --source=` and `git revert` both create the change you then commit."
  - "`systemctl cat lal-automation-refresh.timer` shows the schedule; `systemd-analyze calendar` tests an `OnCalendar=` expression, and `Persistent=` is described in `systemd.timer(5)`."
debrief: |
  ## What was wrong

  1. **The repository was disabled** during the migration (`enabled=0`), so
     `lal-worker-assets` could not be installed, and the container could not start:
     `Error: statfs /usr/share/lal-worker-assets: no such file or directory`.
  2. **An unapproved commit** on top of `approved-worker` set `SITE=test-lab`; once the
     worker ran, it would have served the wrong site.
  3. **The refresh timer** fired hourly, did not catch up on missed runs, and was not even
     enabled.

  ## A clean fix

  ```bash
  sudo dnf config-manager --set-enabled lal-worker
  sudo dnf install lal-worker-assets          # verified against the key in gpgkey=
  cd /etc/lal-automation
  sudo git restore --source=approved-worker worker.conf
  sudo git commit -am 'Restore the approved worker configuration'
  sudo systemctl restart lal-automation
  #   [Timer] OnCalendar=*:0/15  and  Persistent=true   in lal-automation-refresh.timer
  sudo systemctl daemon-reload
  sudo systemctl enable --now lal-automation-refresh.timer
  sudo systemctl start lal-automation-refresh.service
  ```

  `git revert HEAD` is just as good here, because the unapproved commit changed nothing
  else. A drop-in that resets `OnCalendar=` before setting the new value works for the
  timer too.

  ## Check it yourself

  ```bash
  dnf repolist; rpm -q lal-worker-assets
  git -C /etc/lal-automation log --oneline --decorate; git -C /etc/lal-automation status
  cat /var/lib/lal-automation/ready
  systemctl list-timers lal-automation-refresh.timer
  ```

  ## Tempting but wrong

  - **`git reset --hard approved-worker`.** The settings are right, and the record of what
    ran last week is gone.
  - **`dnf install --enablerepo=lal-worker`.** The package installs, and the repository stays
    disabled, so the worker never gets an update.
  - **`OnCalendar=*:0/15` without `Persistent=true`.** Refreshes missed while node2 was down
    are skipped, not caught up.
