schema_version: 1
scenario_id: selinux-confined-web-service
version: 1
status: draft
title: SELinux blocks the web service's custom content and port
summary: Define persistent file and port labels while keeping SELinux enforcing.
estimated_minutes: 35
task_type: fix
difficulty: advanced
task: >-
  Nginx on node2 must serve /srv/lal-web at TCP port 8088, but SELinux denies the custom
  content path and port. Keep SELinux enforcing. Define a persistent file-context rule for
  /srv/lal-web and its descendants using the appropriate read-only web content type, restore
  the labels, label TCP port 8088 for HTTP, and start and enable nginx. Do not use chcon or
  setenforce 0 as the solution.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: operations.selinux
    title: Create and enforce MAC using SELinux
sources:
  - kind: scope
    title: Linux Foundation LFCS competencies
    url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  - kind: distribution
    title: Red Hat SELinux changing file contexts
    url: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/10/html/using_selinux/changing-selinux-states-and-modes
  - kind: man-page
    title: semanage-fcontext manual
    man_page: semanage-fcontext(8)
  - kind: man-page
    title: semanage-port manual
    man_page: semanage-port(8)
topology:
  hosts:
    - name: node2
      image: rocky-10.2-lab-v1
      memory_mib: 1024
      vcpus: 1
checks:
  - check_id: selinux-enforcing
    kind: command
    target: node2
    description: SELinux remains enforcing.
    parameters: {arguments: [getenforce], stdout_equals: Enforcing}
  - check_id: web-content-label
    kind: command
    target: node2
    description: The custom tree currently has the persistent web content label.
    parameters:
      sudo: true
      arguments:
        - bash
        - -c
        - >-
          matchpathcon -V /srv/lal-web /srv/lal-web/index.html >/dev/null &&
          test "$(stat -c %C /srv/lal-web/index.html | cut -d: -f3)" = httpd_sys_content_t
  - check_id: web-port-label
    kind: command
    target: node2
    description: TCP 8088 is assigned to the HTTP port type.
    parameters:
      sudo: true
      arguments: [bash, -c, 'semanage port -l | awk ''$1=="http_port_t" && $2=="tcp" && $0 ~ /(^|,| )8088(,| |$)/ {ok=1} END {exit !ok}''']
  - check_id: confined-web-running
    kind: service
    target: node2
    description: Nginx is running and enabled.
    parameters: {name: nginx.service, active: true, enabled: true}
  - check_id: confined-content-served
    kind: command
    target: node2
    description: Nginx serves the required content through the labeled port.
    parameters: {arguments: [curl, --fail, --silent, http://127.0.0.1:8088/], stdout_equals: selinux-ready}
persistence:
  reboot: false
setup: actions/selinux-confined-web-service.setup.yaml
reference_solution: actions/selinux-confined-web-service.solution.yaml
alternate_solutions: [actions/selinux-confined-web-service.alternate.yaml]
