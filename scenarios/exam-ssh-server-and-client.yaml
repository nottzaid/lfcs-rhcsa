topology:
  networks:
    - {name: lan, cidr: 10.62.0.0/24}
  hosts:
    - {name: node1, image: rocky-10.2-lab-v2, memory_mib: 1024, vcpus: 1, nics: [{network: lan, name: lan0}]}
    - {name: node2, image: rocky-10.2-lab-v2, memory_mib: 1024, vcpus: 1, nics: [{network: lan, name: lan0}]}
checks:
  - check_id: login-policy
    kind: command
    target: node1
    description: sshd refuses root and password logins, except passwords for members of rescue.
    parameters:
      sudo: true
      script: |
        effective() { sshd -T -C "user=$1,host=node2,addr=10.62.0.20" 2>/dev/null | awk -v key="$2" '$1 == key {print $2}'; }
        expect_eq "$(effective root permitrootlogin)" no "PermitRootLogin"
        expect_eq "$(effective ops passwordauthentication)" no "password authentication for ops"
        expect_eq "$(effective rescue1 passwordauthentication)" yes "password authentication for rescue1, a member of rescue"
  - check_id: both-ports
    kind: command
    target: node1
    description: sshd listens on ports 22 and 2022.
    parameters:
      sudo: true
      timeout_seconds: 30
      script: |
        listening() { ss -Hltn "sport = :$1" | grep -q .; }
        listening 22 || fail "sshd does not listen on port 22"
        retry 10 listening 2022 || fail "nothing listens on port 2022"
  - check_id: key-login-alias
    kind: command
    target: node2
    description: On node2, ssh n1 as ops logs in to node1 as ops on port 2022 with a key.
    parameters:
      sudo: true
      timeout_seconds: 60
      script: |
        target=$(runuser -u ops -- ssh -G n1 2>/dev/null | awk '$1 == "hostname" {print $2}')
        [[ -n "$target" && "$target" != n1 ]] || fail "ops on node2 has no ssh alias n1"
        errors=$(mktemp); trap 'rm -f "$errors"' EXIT
        login() {
          answer=$(runuser -u ops -- ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=5 n1 'printf "%s %s" "$(id -un)" "$SSH_CONNECTION"' 2>"$errors")
        }
        retry 3 login || fail "ssh n1 as ops fails: $(tail -n 1 "$errors")"
        read -r user _ _ _ port <<<"$answer"
        expect_eq "$user" ops "the user ssh n1 logs in as"
        expect_eq "$port" 2022 "the port ssh n1 connects to"
persistence:
  reboot: true
  hosts: [node1]
setup: actions/exam-ssh-server-and-client.setup.yaml
reference_solution: actions/exam-ssh-server-and-client.solution.yaml
rejected_solutions:
  - actions/exam-ssh-server-and-client.rejected-late-drop-in.yaml
  - actions/exam-ssh-server-and-client.rejected-unlabeled-port.yaml
