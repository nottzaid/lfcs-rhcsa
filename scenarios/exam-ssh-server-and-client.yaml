schema_version: 1
scenario_id: exam-ssh-server-and-client
version: 1
status: verified
collection: exam
title: Harden an SSH server and set up key login to it
summary: Restrict root and password logins, add a port, and give a user a key-based alias.
estimated_minutes: 8
task_type: configure
difficulty: advanced
task: |
  `node1` (10.62.0.10) still runs a legacy SSH policy that lets root and every user log in
  with a password. On node1, configure the SSH server so that:

  - `root` cannot log in over SSH at all;
  - password authentication is refused for everyone except members of the group `rescue`;
  - it listens on port 2022 as well as port 22, reachable from node2.

  On `node2` (10.62.0.20), set up the user `ops` so that `ssh n1`, run as `ops`, logs in to
  node1 as `ops` on port 2022 with a key and without a password. `ops` exists on both hosts
  and already has a key pair on node2.
requirements:
  - "sshd on node1 refuses root logins and password logins, except passwords for members of `rescue`."
  - "sshd on node1 listens on ports 22 and 2022, after a reboot too."
  - "On node2, `ssh n1` as `ops` logs in to node1 as `ops` on port 2022 with a key."
debrief: |
  ## One way to do it

  On node2, as `ops`, while node1 still accepts passwords:

  ```bash
  ssh-copy-id -i ~/.ssh/id_ed25519.pub ops@10.62.0.10
  printf 'Host n1\n    HostName 10.62.0.10\n    User ops\n    Port 2022\n' >> ~/.ssh/config
  ```

  On node1:

  ```bash
  sudo grep -r . /etc/ssh/sshd_config.d/        # 05-legacy.conf allows root and passwords
  sudo tee /etc/ssh/sshd_config.d/05-legacy.conf <<'CONF'
  Port 22
  Port 2022
  PermitRootLogin no
  PasswordAuthentication no
  Match Group rescue
      PasswordAuthentication yes
  CONF
  sudo semanage port -a -t ssh_port_t -p tcp 2022
  sudo firewall-cmd --permanent --add-port=2022/tcp && sudo firewall-cmd --reload
  sudo sshd -t && sudo systemctl restart sshd
  ```

  sshd keeps the **first** value it reads for most keywords, and the drop-ins in
  `/etc/ssh/sshd_config.d/` are read in name order before the rest of `sshd_config`. So the
  file that sorts first decides: here `05-legacy.conf`, which is why replacing its content
  works and adding a new file does not. `sshd -T` prints the configuration sshd will really
  use. A `Match` block in a drop-in ends where that file ends. SELinux only lets sshd bind
  ports labeled `ssh_port_t`, and firewalld must let 2022 in.

  ## Check it yourself

  ```bash
  sudo sshd -T -C user=root,host=x,addr=10.62.0.20 | grep -E '^(port|permitrootlogin)'
  sudo sshd -T -C user=ops,host=x,addr=10.62.0.20 | grep passwordauthentication
  sudo sshd -T -C user=rescue1,host=x,addr=10.62.0.20 | grep passwordauthentication
  ssh n1 hostname      # as ops on node2
  ```

  ## Tempting but wrong

  - **The new policy in `/etc/ssh/sshd_config.d/60-policy.conf`.** `05-legacy.conf` is read
    first, so root and passwords stay allowed.
  - **Port 2022 without `semanage port`.** sshd cannot bind it, and SELinux logs the denial.
  - **`PermitRootLogin prohibit-password`.** root can still log in, with a key.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: networking.openssh
    title: Configure the OpenSSH server and client
sources:
