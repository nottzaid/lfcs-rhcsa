topology:
  networks:
    - {name: lan, cidr: 10.66.0.0/24}
  hosts:
    - {name: node1, image: rocky-10.2-lab-v2, memory_mib: 1024, vcpus: 1, nics: [{network: lan, name: lan0}]}
    - {name: node2, image: rocky-10.2-lab-v2, memory_mib: 1024, vcpus: 1, nics: [{network: lan, name: lan0}]}
checks:
  - check_id: automounter-running
    kind: command
    target: node2
    description: autofs runs at boot and manages /remote/home.
    parameters:
      timeout_seconds: 20
      script: |
        expect_eq "$(systemctl is-enabled autofs.service)" enabled "autofs at boot"
        expect_eq "$(systemctl is-active autofs.service)" active "autofs"
        retry 10 findmnt -n -t autofs --mountpoint /remote/home >/dev/null || fail "autofs does not manage /remote/home"
  - check_id: homes-on-demand
    kind: command
    target: node2
    description: Each user's directory mounts on use, read-write, over NFSv4.
    parameters:
      sudo: true
      timeout_seconds: 60
      script: |
        for user in alice bob; do
          content=$(runuser -u "$user" -- cat "/remote/home/$user/welcome.txt" 2>&1) \
            || fail "$user cannot read /remote/home/$user/welcome.txt: ${content##*: }"
          expect_eq "$content" "welcome, $user" "/remote/home/$user/welcome.txt"
          mount=$(findmnt -n -o FSTYPE,SOURCE,OPTIONS --mountpoint "/remote/home/$user") \
            || fail "/remote/home/$user is not a mount"
          read -r fstype source options <<<"$mount"
          expect_eq "$fstype" nfs4 "the filesystem type of /remote/home/$user"
          expect_eq "$source" "10.66.0.10:/exports/home/$user" "the source of /remote/home/$user"
          has_option "$options" rw || fail "/remote/home/$user is mounted read-only"
          runuser -u "$user" -- touch "/remote/home/$user/.check" || fail "$user cannot write to /remote/home/$user"
          rm -f "/remote/home/$user/.check" 2>/dev/null || runuser -u "$user" -- rm -f "/remote/home/$user/.check"
        done
persistence:
  reboot: true
  hosts: [node2]
setup: actions/exam-autofs-homes.setup.yaml
reference_solution: actions/exam-autofs-homes.solution.yaml
rejected_solutions:
  - actions/exam-autofs-homes.rejected-one-user.yaml
  - actions/exam-autofs-homes.rejected-fstab.yaml
