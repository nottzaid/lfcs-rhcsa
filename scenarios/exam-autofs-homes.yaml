schema_version: 1
scenario_id: exam-autofs-homes
version: 1
status: verified
collection: exam
title: Mount home directories on demand with autofs
summary: Mount any user's NFS home directory under /remote/home the moment it is used.
estimated_minutes: 7
task_type: configure
difficulty: intermediate
task: |
  `node1` (10.66.0.10) exports one directory per user under `/exports/home` over NFS.

  On `node2`, configure autofs so that `/remote/home/NAME` mounts
  `10.66.0.10:/exports/home/NAME` on demand, read-write, with NFS version 4, for any `NAME`,
  using a single wildcard map entry. It must keep working after node2 reboots.

  The users `alice` and `bob` exist on both hosts.
requirements:
  - "autofs runs at boot and manages `/remote/home`."
  - "Using `/remote/home/alice` or `/remote/home/bob` mounts that user's NFS directory, read-write, over NFSv4."
  - "Each user can work in their own directory."
debrief: |
  ## One way to do it

  ```bash
  echo '/remote/home /etc/auto.home' | sudo tee /etc/auto.master.d/home.autofs
  echo '* -fstype=nfs4,rw 10.66.0.10:/exports/home/&' | sudo tee /etc/auto.home
  sudo systemctl enable --now autofs
  ls /remote/home/alice
  ```

  `auto.master` (and the `.autofs` files in `auto.master.d`) maps a directory to a map
  file. In the map, `*` matches any name looked up under that directory, and `&` stands for
  the matched name, so one line serves every user. Nothing is mounted until a path is used,
  and autofs unmounts it again after a while idle.

  ## Check it yourself

  ```bash
  findmnt -t autofs /remote/home
  ls /remote/home/bob && findmnt /remote/home/bob
  ```

  ## Tempting but wrong

  - **A map entry per user.** It works for `alice` and `bob` today, and for nobody else.
  - **Mounting `/exports/home` at `/remote/home` from fstab.** Every home is visible, all
    the time, without the automounter.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: storage.automounters
    title: Configure filesystem automounters
sources:
