schema_version: 1
scenario_id: branch-office-routing-incident
version: 2
status: verified
title: The branch office lost the order service
summary: A replacement router passes nothing between a branch and the datacenter; restore exactly the one service the branch needs.
estimated_minutes: 60
task_type: troubleshoot
difficulty: exam
task: |
  The branch office reaches the datacenter through a router, **node2**, which was replaced
  last night. Since then the branch cannot use the order service at
  `http://orders.dc.internal:8080/` (172.21.0.10).

  The network plan:

  | Network | Hosts |
  | --- | --- |
  | branch, 10.70.0.0/24 | router `branch0` 10.70.0.1; desktop **branch** 10.70.0.10 |
  | datacenter, 172.20.0.0/24 | router `dc0` 172.20.0.1; service gateway **dc** 172.20.0.2 |
  | service addresses, 172.21.0.0/24 | reached through **dc** (172.20.0.2) |

  Security policy for this router: branch hosts may open connections to the order
  service, TCP port 8080 on 172.21.0.10, and to nothing else in the datacenter; the
  datacenter may not open connections into the branch. The order service shares its
  address with the order database (port 5432), which the branch must never reach.

  Fix the router. The branch desktop and the datacenter hosts are configured correctly;
  leave them as they are.
requirements:
  - "From **branch**, `http://orders.dc.internal:8080/` answers `branch-ready`."
  - "From branch, the order database (172.21.0.10, TCP 5432) cannot be reached."
  - "From **dc**, nothing in the branch can be reached, such as the desktop's share at `http://10.70.0.10:8000/`."
  - "branch and dc are unchanged: they still route through the router addresses in the plan."
  - "All of this still holds after node2 reboots."
hints:
  - "Compare node2 with the plan before touching a firewall: `ip -br address`, `ip route`, and `sysctl net.ipv4.ip_forward`. Then ask how a reply from 172.21.0.10 would find its way back to the branch."
  - "A router needs a route for every network it forwards to; networks behind another router need a static route through it. In NetworkManager that is the profile's `ipv4.routes`."
  - "firewalld decides what passes between zones with policies (`firewalld.policies(5)`); a rich rule in a policy can allow one destination and port. nftables can do the same in a forward chain with policy drop."
debrief: |
  ## What was wrong

  The replacement router was set up from a template, with three faults:

  1. **An address typo.** `dc0` had 172.20.0.11 instead of 172.20.0.1. dc sends everything
     for the branch to 172.20.0.1, so even with forwarding on, no reply would come back.
  2. **A missing static route.** The service addresses, 172.21.0.0/24, sit behind dc. Without
     a route through 172.20.0.2, node2 sent that traffic to its default gateway.
  3. **No forwarding**: `net.ipv4.ip_forward` was 0, and firewalld had no policy for
     traffic between the two sides.

  ## A clean fix

  ```bash
  sudo nmcli connection modify dc ipv4.addresses 172.20.0.1/24 ipv4.routes '172.21.0.0/24 172.20.0.2'
  sudo nmcli connection up dc
  echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/90-router.conf
  sudo sysctl --load /etc/sysctl.d/90-router.conf
  sudo firewall-cmd --permanent --new-zone=branch
  sudo firewall-cmd --permanent --new-zone=datacenter
  sudo firewall-cmd --permanent --zone=branch --change-interface=branch0
  sudo firewall-cmd --permanent --zone=datacenter --change-interface=dc0
  sudo firewall-cmd --permanent --new-policy branch-to-orders
  sudo firewall-cmd --permanent --policy branch-to-orders --add-ingress-zone branch --add-egress-zone datacenter
  sudo firewall-cmd --permanent --policy branch-to-orders \
    --add-rich-rule='rule family="ipv4" destination address="172.21.0.10" port port="8080" protocol="tcp" accept'
  sudo firewall-cmd --reload
  ```

  firewalld accepts replies of connections it allowed, and rejects anything between zones
  that no policy allows, so the datacenter cannot open connections into the branch. The
  equivalent nftables forward chain: policy drop, accept established traffic, and accept
  `iifname "branch0" oifname "dc0" ip daddr 172.21.0.10 tcp dport 8080`.

  ## Check it yourself

  ```bash
  ip route get 172.21.0.10                       # node2: via 172.20.0.2 dev dc0
  curl http://orders.dc.internal:8080/           # branch
  timeout 3 bash -c '</dev/tcp/172.21.0.10/5432' # branch: must fail
  ```

  ## Tempting but wrong

  - **Putting both interfaces in the `trusted` zone.** The order service works, and so do
    the database and every other port, in both directions.
  - **Changing dc's route to match the typo.** It works, until any other datacenter host
    needs the branch, and the router no longer matches the plan everyone else uses.
