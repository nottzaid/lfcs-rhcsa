sources:
  - kind: scope
    title: Linux Foundation LFCS competencies
    url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  - kind: man-page
    title: Routes and route lookups
    man_page: ip-route(8)
  - kind: man-page
    title: ipv4.addresses and ipv4.routes
    man_page: nm-settings-nmcli(5)
  - kind: man-page
    title: Policies between zones
    man_page: firewalld.policies(5)
  - kind: man-page
    title: Rich rules
    man_page: firewalld.richlanguage(5)
topology:
  networks:
    - {name: branch, cidr: 10.70.0.0/24}
    - {name: datacenter, cidr: 172.20.0.0/24}
  hosts:
    - name: node2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: branch, name: branch0}, {network: datacenter, name: dc0}]
    - name: branch
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: branch, name: branch0}]
    - name: dc
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: datacenter, name: dc0}]
checks:
  - check_id: orders-reachable
    kind: command
    target: branch
    description: branch gets branch-ready from the order service.
    parameters:
      script: |
        answer=$(curl --silent --show-error --max-time 5 http://orders.dc.internal:8080/ 2>&1) ||
          fail "branch cannot reach the order service: ${answer#curl: }"
        expect_eq "$answer" branch-ready "the order service's answer"
  - check_id: database-closed-to-branch
    kind: command
    target: branch
    description: branch cannot reach the order database.
    parameters:
      script: |
        if timeout 4 bash -c 'exec 3<>/dev/tcp/172.21.0.10/5432' 2>/dev/null; then
          fail "branch can open a connection to the order database at 172.21.0.10:5432"
        fi
  - check_id: branch-closed-to-datacenter
    kind: command
    target: dc
    description: dc cannot open connections into the branch.
    parameters:
      script: |
        if answer=$(curl --silent --max-time 4 http://10.70.0.10:8000/ 2>/dev/null); then
          fail "dc opened http://10.70.0.10:8000/ in the branch and got: $answer"
        fi
  - check_id: neighbors-unchanged
    kind: command
    target: dc
    description: dc still routes the branch through 172.20.0.1.
    parameters:
      script: |
        route=$(ip -4 route show 10.70.0.0/24)
        [[ $route == *"via 172.20.0.1 "* ]] || fail "dc's route to the branch changed: ${route:-none}"
persistence:
  reboot: true
  hosts: [node2]
setup: actions/branch-office-routing-incident.setup.yaml
reference_solution: actions/branch-office-routing-incident.solution.yaml
alternate_solutions: [actions/branch-office-routing-incident.alternate.yaml]
rejected_solutions:
  - actions/branch-office-routing-incident.rejected-forward-everything.yaml
  - actions/branch-office-routing-incident.rejected-route-around-the-typo.yaml
