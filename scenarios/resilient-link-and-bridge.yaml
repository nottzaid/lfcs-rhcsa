schema_version: 1
scenario_id: resilient-link-and-bridge
version: 1
status: draft
title: The host needs a resilient uplink and a software bridge
summary: Build persistent NetworkManager bond and bridge topologies from dummy lab links.
estimated_minutes: 40
task_type: build
difficulty: advanced
task: >-
  On node2, use NetworkManager to create bond0 in active-backup mode with miimon=100 and
  slave interfaces bond-a and bond-b. Assign 192.0.2.20/24 to bond0 with no default route.
  Also create bridge br0 with bridge-port as its port and assign 198.51.100.20/24 with no
  default route. The three port interfaces are lab dummy devices and must be created by
  persistent NetworkManager profiles. Bring everything up and enable autoconnect without
  touching the VM's existing management interface.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: networking.bridges-bonds
    title: Configure bridge and bonding devices
sources:
  - kind: scope
    title: Linux Foundation LFCS competencies
    url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  - kind: upstream
    title: NetworkManager settings reference
    url: https://networkmanager.dev/docs/api/latest/settings-connection.html
  - kind: upstream
    title: Linux bonding documentation
    url: https://docs.kernel.org/networking/bonding.html
  - kind: man-page
    title: nmcli manual
    man_page: nmcli(1)
topology:
  hosts:
    - name: node2
      image: rocky-10.2-lab-v1
      memory_mib: 1024
      vcpus: 1
checks:
  - check_id: bond-live
    kind: command
    target: node2
    description: bond0 is active-backup with both lab ports and the required address.
    parameters:
      arguments:
        - bash
        - -c
        - >-
          grep -q 'Bonding Mode: fault-tolerance (active-backup)' /proc/net/bonding/bond0 &&
          grep -q 'MII Polling Interval (ms): 100' /proc/net/bonding/bond0 &&
          test "$(grep -c '^Slave Interface: bond-[ab]$' /proc/net/bonding/bond0)" -eq 2 &&
          ip -4 address show bond0 | grep -Fq '192.0.2.20/24'
  - check_id: bridge-live
    kind: command
    target: node2
    description: br0 has the designated port and address.
    parameters:
      arguments:
        - bash
        - -c
        - >-
          ip -4 address show br0 | grep -Fq '198.51.100.20/24' &&
          test "$(basename "$(readlink /sys/class/net/bridge-port/master)")" = br0
  - check_id: network-topology-persistent
    kind: command
    target: node2
    description: NetworkManager owns autoconnecting profiles for every controller and port.
    parameters:
      arguments:
        - bash
        - -c
        - >-
          for connection in lal-bond lal-bond-a lal-bond-b lal-bridge lal-bridge-port; do
            test "$(nmcli -g connection.autoconnect con show "$connection")" = yes || exit 1;
          done
persistence:
  reboot: true
  hosts: [node2]
setup: actions/resilient-link-and-bridge.setup.yaml
reference_solution: actions/resilient-link-and-bridge.solution.yaml
alternate_solutions: [actions/resilient-link-and-bridge.alternate.yaml]
