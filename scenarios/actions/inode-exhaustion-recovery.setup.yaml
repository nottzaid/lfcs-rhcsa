schema_version: 1
actions:
  - action_id: create-inode-limited-cache
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        disk=/dev/disk/by-id/virtio-lal-cache
        umount /var/lib/lal-cache >/dev/null 2>&1 || true
        wipefs -a "$disk"
        mkfs.ext4 -q -F -N 1024 -L LAL_CACHE "$disk"
        rm -rf /var/lib/lal-cache
        install -d /var/lib/lal-cache
        mount "$disk" /var/lib/lal-cache
        install -d /var/lib/lal-cache/stale /var/lib/lal-cache/keep
        printf 'retain me\n' > /var/lib/lal-cache/keep/important.record
        for number in $(seq 1 900); do : > "/var/lib/lal-cache/stale/item-$number"; done
