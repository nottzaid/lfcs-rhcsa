schema_version: 1
actions:
  - action_id: relabel-by-hand
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        chcon -t cert_t /etc/lal-pki/private/service.key
        chcon -R -t httpd_sys_content_t /srv/lal-secure
  - action_id: serve-the-certificate-with-its-issuer
    target: node2
    arguments: [sudo, --, bash, -c, "cat /etc/lal-pki/issuing-ca.crt >> /etc/lal-pki/service.crt"]
  - action_id: open-the-port-and-restart
    target: node2
    arguments: [sudo, --, bash, -c, "firewall-cmd --quiet --permanent --add-port=8443/tcp && firewall-cmd --quiet --reload && systemctl restart nginx.service"]
