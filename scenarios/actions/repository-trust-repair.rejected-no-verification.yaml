schema_version: 1
actions:
  - action_id: fix-the-path-only
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i 's#/srv/lal-repository#/srv/lal-repo#' /etc/yum.repos.d/lal-training.repo
        dnf -y install lal-release-notes
