schema_version: 1
actions:
  - action_id: build-it-with-default-stp
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection delete storage
        nmcli connection add type bridge ifname br0 con-name storage-bridge \
          ipv4.method manual ipv4.addresses 10.90.0.20/24 ipv6.method disabled
        nmcli connection add type bond ifname bond0 con-name storage-bond \
          bond.options mode=active-backup,miimon=250,primary=stor0 controller br0 port-type bridge
        for nic in stor0 stor1; do
          nmcli connection add type ethernet ifname "$nic" con-name "storage-$nic" controller bond0 port-type bond
        done
        nmcli connection up storage-bridge
        nmcli connection up storage-bond
        nmcli connection up storage-stor0
        nmcli connection up storage-stor1
