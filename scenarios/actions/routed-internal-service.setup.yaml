schema_version: 1
actions:
  - action_id: build-the-gateway
    target: gw
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname transit0 con-name transit ipv4.method manual \
          ipv4.addresses 10.50.0.1/24 ipv6.method disabled connection.zone trusted >/dev/null
        nmcli connection add type ethernet ifname services0 con-name services ipv4.method manual \
          ipv4.addresses 172.20.30.1/24 ipv6.method disabled connection.zone trusted >/dev/null
        nmcli connection up transit >/dev/null
        nmcli connection up services >/dev/null
        printf 'net.ipv4.ip_forward = 1\n' > /etc/sysctl.d/90-gateway.conf
        sysctl --quiet --load /etc/sysctl.d/90-gateway.conf
  - action_id: start-the-records-service
    target: records
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname services0 con-name services ipv4.method manual \
          ipv4.addresses 172.20.30.40/24 ipv4.routes '10.50.0.0/24 172.20.30.1' ipv6.method disabled >/dev/null
        nmcli connection up services >/dev/null
        install -d /srv/records
        printf 'records-service\n' > /srv/records/index.html
        cat > /etc/systemd/system/records-web.service <<'UNIT'
        [Unit]
        Description=Records service
        After=network-online.target

        [Service]
        DynamicUser=yes
        AmbientCapabilities=CAP_NET_BIND_SERVICE
        ExecStart=/usr/bin/python3 -m http.server 80 --directory /srv/records
        Restart=always

        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl daemon-reload
        systemctl enable --now records-web.service
        firewall-cmd --quiet --permanent --add-service=http
        firewall-cmd --quiet --reload
  - action_id: leave-node2-with-the-old-gateway
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname transit0 con-name transit ipv4.method manual \
          ipv4.addresses 10.50.0.10/24 ipv4.routes '172.20.30.0/24 10.50.0.254' ipv6.method disabled >/dev/null
        nmcli connection up transit >/dev/null
