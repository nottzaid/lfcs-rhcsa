schema_version: 1
actions:
  - action_id: build-routed-namespace-topology
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli con delete lal-uplink >/dev/null 2>&1 || true
        ip netns delete lal-gateway >/dev/null 2>&1 || true
        ip netns delete lal-service >/dev/null 2>&1 || true
        ip link delete uplink0 >/dev/null 2>&1 || true
        ip netns add lal-gateway
        ip netns add lal-service
        ip link add uplink0 type veth peer name gw0
        ip link set gw0 netns lal-gateway
        ip link add gw1 type veth peer name service0
        ip link set gw1 netns lal-gateway
        ip link set service0 netns lal-service
        ip netns exec lal-gateway ip address add 192.0.2.2/24 dev gw0
        ip netns exec lal-gateway ip address add 198.51.100.1/24 dev gw1
        ip netns exec lal-gateway ip link set lo up
        ip netns exec lal-gateway ip link set gw0 up
        ip netns exec lal-gateway ip link set gw1 up
        ip netns exec lal-gateway sysctl -w net.ipv4.ip_forward=1 >/dev/null
        ip netns exec lal-service ip address add 198.51.100.2/24 dev service0
        ip netns exec lal-service ip link set lo up
        ip netns exec lal-service ip link set service0 up
        ip netns exec lal-service ip route add default via 198.51.100.1
        nmcli con add type ethernet ifname uplink0 con-name lal-uplink \
          ipv4.method manual ipv4.addresses 192.0.2.1/24 ipv4.never-default yes ipv6.method disabled
        nmcli con up lal-uplink
        nmcli con modify lal-uplink ipv4.routes ''
        ip route del 198.51.100.0/24 >/dev/null 2>&1 || true
