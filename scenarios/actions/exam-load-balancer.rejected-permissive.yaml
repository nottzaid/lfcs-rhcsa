schema_version: 1
actions:
  - action_id: pool-with-selinux-off
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cat > /etc/nginx/conf.d/pool.conf <<'CONF'
        upstream pool {
            server 10.69.0.10:8081;
            server 10.69.0.10:8082;
        }
        server {
            listen 80 default_server;
            listen [::]:80 default_server;
            location / { proxy_pass http://pool; }
            location /status { proxy_pass http://10.69.0.10:8081; }
        }
        CONF
        setenforce 0
        systemctl enable nginx.service
        systemctl restart nginx.service
