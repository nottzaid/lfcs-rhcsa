schema_version: 1
actions:
  - action_id: raise-the-account-limits
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        printf '%s\n' 'batchsvc soft nofile 4096' 'batchsvc hard nofile 8192' \
          'batchsvc soft nproc 512' 'batchsvc hard nproc 1024' \
          > /etc/security/limits.d/90-lal-batch.conf
  - action_id: raise-the-service-limit-in-a-drop-in
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /etc/systemd/system/lal-batch.service.d
        printf '[Service]\nLimitNOFILE=4096:8192\n' > /etc/systemd/system/lal-batch.service.d/override.conf
        systemctl daemon-reload
        systemctl start lal-batch.service
