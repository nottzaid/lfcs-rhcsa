schema_version: 1
actions:
  - action_id: bridge-and-port
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type bridge ifname br0 con-name br0 bridge.stp no ipv4.method disabled ipv6.method disabled >/dev/null
        nmcli connection up br0 >/dev/null
