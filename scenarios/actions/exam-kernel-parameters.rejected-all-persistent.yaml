schema_version: 1
actions:
  - action_id: persist-all-three
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '%s\n' 'vm.swappiness = 15' 'net.ipv4.ip_local_port_range = 20000 40000' \
          'kernel.sysrq = 1' > /etc/sysctl.d/90-tuning.conf
        sysctl --system >/dev/null
