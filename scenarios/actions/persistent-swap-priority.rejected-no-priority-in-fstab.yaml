schema_version: 1
actions:
  - action_id: set-the-priority-only-for-today
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        mkswap -L LAL_SWAP /dev/disk/by-id/virtio-lal-swap
        printf 'LABEL=LAL_SWAP none swap defaults 0 0\n' >> /etc/fstab
        swapon -p 50 /dev/disk/by-id/virtio-lal-swap
