schema_version: 1
actions:
  - action_id: install-the-report-tool
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        useradd --home-dir /var/lib/lal-reports --create-home --shell /bin/bash reportbot
        install -d -m 0755 /opt/lal/bin /usr/share/lal-reports
        cat > /opt/lal/bin/generate-usage-report <<'EOF'
        #!/bin/sh
        set -eu
        if [ "${1:-}" != --format ] || [ "${2:-}" != compact ]; then
          echo "generate-usage-report: only --format compact is supported" >&2
          exit 2
        fi
        tmp=$(mktemp /var/lib/lal-reports/.latest.XXXXXX)
        printf 'format=%s\nuser=%s\ngenerated=%s\n' "$2" "$(id -un)" "$(date -u +%FT%TZ)" > "$tmp"
        chmod 0640 "$tmp"
        mv -f "$tmp" /var/lib/lal-reports/latest
        EOF
        chmod 0755 /opt/lal/bin/generate-usage-report
        sha256sum /opt/lal/bin/generate-usage-report > /usr/share/lal-reports/script.sha256
        printf 'pathmunge /opt/lal/bin after\n' > /etc/profile.d/lal-tools.sh
  - action_id: install-the-broken-crontab
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '%s\n' 'CRON_TZ=Asia/Amman' 'PATH=/usr/bin:/bin' 'MAILTO=""' \
          '15 3 * * * generate-usage-report --format verbose' | crontab -u reportbot -
        systemctl enable --now crond.service
