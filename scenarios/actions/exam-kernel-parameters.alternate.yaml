schema_version: 1
actions:
  - action_id: append-to-sysctl-conf-and-load-it
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '%s\n' 'vm.swappiness=15' 'net.ipv4.ip_local_port_range=20000	40000' >> /etc/sysctl.conf
        sysctl -p >/dev/null
        echo 1 > /proc/sys/kernel/sysrq
