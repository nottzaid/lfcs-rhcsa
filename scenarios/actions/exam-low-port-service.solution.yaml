schema_version: 1
actions:
  - action_id: grant-the-capability-in-a-drop-in
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /etc/systemd/system/lal-api.service.d
        printf '[Service]\nAmbientCapabilities=CAP_NET_BIND_SERVICE\n' > /etc/systemd/system/lal-api.service.d/bind.conf
        systemctl daemon-reload
        systemctl enable lal-api.service
        systemctl restart lal-api.service
