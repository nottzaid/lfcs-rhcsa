schema_version: 1
actions:
  - action_id: define-worker-quadlet
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        cat > /etc/containers/systemd/lal-worker.container <<'EOF'
        [Unit]
        Description=Persistent Linux Admin Lab worker

        [Container]
        Image=localhost/lal-worker:1
        ContainerName=lal-worker
        Environment=WORKER_SITE=amman
        Volume=/srv/worker-data:/data:Z
        Exec=/bin/bash -c "printf '%%s\n' \"$WORKER_SITE\" > /data/ready; exec /bin/bash -c 'while :; do read -r -t 60 || true; done'"

        [Service]
        Restart=always

        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl start lal-worker.service
