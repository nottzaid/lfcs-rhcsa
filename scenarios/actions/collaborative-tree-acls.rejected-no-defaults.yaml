schema_version: 1
actions:
  - action_id: fix-only-what-exists-today
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        setfacl -R -b /srv/project
        chgrp -R project /srv/project
        find /srv/project -type d -exec chmod 2770 {} +
        find /srv/project -type f -exec chmod 0660 {} +
        setfacl -R -m g:project:rwX,u:auditor:rX /srv/project
