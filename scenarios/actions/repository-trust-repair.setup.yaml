schema_version: 1
actions:
  - action_id: build-local-training-repository
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        rm -rf /tmp/lal-rpmbuild /srv/lal-repo
        install -d /tmp/lal-rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} /srv/lal-repo
        cat > /tmp/lal-rpmbuild/SPECS/lal-release-notes.spec <<'EOF'
        Name: lal-release-notes
        Version: 1.0
        Release: 1
        Summary: Linux Admin Lab repository exercise
        License: MIT
        BuildArch: noarch

        %description
        Local package used by the Linux Admin Lab repository exercise.

        %install
        mkdir -p %{buildroot}/usr/share/doc/lal-release-notes
        printf 'approved repository package\n' > %{buildroot}/usr/share/doc/lal-release-notes/README

        %files
        /usr/share/doc/lal-release-notes/README
        EOF
        rpmbuild -bb --define '_topdir /tmp/lal-rpmbuild' /tmp/lal-rpmbuild/SPECS/lal-release-notes.spec
        cp /tmp/lal-rpmbuild/RPMS/noarch/lal-release-notes-1.0-1.noarch.rpm /srv/lal-repo/
        createrepo_c /srv/lal-repo
        rpm --erase lal-release-notes >/dev/null 2>&1 || true
  - action_id: install-broken-repository-definition
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        rm -f /etc/yum.repos.d/lal-*.repo;
        printf '%s\n' '[lal-training]' 'name=Linux Admin Lab training repository'
        'baseurl=file:///srv/missing-repo' 'enabled=0' 'gpgcheck=1'
        > /etc/yum.repos.d/lal-training.repo;
        dnf clean all >/dev/null
