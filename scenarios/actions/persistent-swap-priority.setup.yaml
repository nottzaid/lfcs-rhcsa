schema_version: 1
actions:
  - action_id: prepare-unused-swap-disk
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        swapoff /dev/disk/by-id/virtio-lal-swap >/dev/null 2>&1 || true;
        sed -i '\#LAL_SWAP#d;\#virtio-lal-swap#d' /etc/fstab;
        wipefs -a /dev/disk/by-id/virtio-lal-swap
