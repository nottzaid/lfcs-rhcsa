schema_version: 1
actions:
  - action_id: make-monitor-remotely-listen
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        install -d /etc/systemd/system/lal-monitor.service.d;
        printf '%s\n' '[Service]' 'Environment=MONITOR_BIND=0.0.0.0'
        > /etc/systemd/system/lal-monitor.service.d/listen.conf;
        systemctl daemon-reload;
        systemctl restart lal-monitor.service
  - action_id: repair-monitor-resolution
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        sed -i '/[[:space:]]monitor\.internal\([[:space:]]\|$\)/d' /etc/hosts;
        printf '{{host.node1.address}} monitor.internal\n' >> /etc/hosts
