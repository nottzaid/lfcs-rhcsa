schema_version: 1
actions:
  - action_id: fix-the-repository-and-trust-its-key
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '%s\n' '[lal-training]' 'name=Internal release packages' \
          'baseurl=file:///srv/lal-repo' 'enabled=1' 'gpgcheck=1' \
          'gpgkey=file:///srv/lal-repo/RPM-GPG-KEY-lal-release' > /etc/yum.repos.d/lal-training.repo
        dnf -y install lal-release-notes
