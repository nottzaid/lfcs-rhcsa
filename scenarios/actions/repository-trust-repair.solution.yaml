schema_version: 1
actions:
  - action_id: repair-local-repository
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf '%s\n' '[lal-training]' 'name=Linux Admin Lab training repository'
        'baseurl=file:///srv/lal-repo' 'enabled=1' 'gpgcheck=0'
        > /etc/yum.repos.d/lal-training.repo
  - action_id: install-approved-package
    target: node2
    arguments: [sudo, --, dnf, --disablerepo=*, --enablerepo=lal-training, install, -y, lal-release-notes]
