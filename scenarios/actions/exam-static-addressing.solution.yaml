schema_version: 1
actions:
  - action_id: connection-hostname-and-hosts-entry
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname lan0 con-name lan ipv4.method manual \
          ipv4.addresses 10.61.0.20/24 ipv6.method manual ipv6.addresses fd61::20/64 >/dev/null
        nmcli connection up lan >/dev/null
        hostnamectl set-hostname app02.lab.internal
        printf '10.61.0.30 db.lab.internal db\n' >> /etc/hosts
