schema_version: 1
actions:
  - action_id: crontab-entry-and-at-job
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '30 2 * * 1-5 /usr/local/bin/lal-report\n' | crontab -u reports -
        printf 'touch /var/tmp/cutover-done\n' | at 23:45 2027-01-15 2>/dev/null
