schema_version: 1
actions:
  - action_id: install-collector-program
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        id collector >/dev/null 2>&1 || useradd --system --home-dir /var/lib/lal-collector --shell /sbin/nologin collector
        install -d -o collector -g collector -m 0750 /var/lib/lal-collector
        install -d -o root -g root -m 0755 /opt/lal/bin
        cat > /opt/lal/bin/collector <<'EOF'
        #!/bin/bash
        set -eu
        printf '%s\n' "${COLLECTOR_SITE:?COLLECTOR_SITE is required}" > ready
        while :; do sleep 60; done
        EOF
        chmod 0755 /opt/lal/bin/collector
        printf 'COLLECTOR_SITE=warehouse-7\n' > /etc/lal-collector.conf
        chmod 0644 /etc/lal-collector.conf
        rm -f /var/lib/lal-collector/ready
  - action_id: remove-undeployed-unit
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        systemctl disable --now lal-collector.service >/dev/null 2>&1 || true;
        rm -f /etc/systemd/system/lal-collector.service;
        rm -rf /etc/systemd/system/lal-collector.service.d;
        systemctl daemon-reload
