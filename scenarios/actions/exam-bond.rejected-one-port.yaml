schema_version: 1
actions:
  - action_id: bond-with-a-single-port
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type bond ifname bond0 con-name bond0 \
          bond.options mode=active-backup,miimon=100 \
          ipv4.method manual ipv4.addresses 10.68.0.20/24 ipv6.method disabled >/dev/null
        nmcli connection add type ethernet ifname bond1a con-name bond0-port1 controller bond0 port-type bond >/dev/null
        nmcli connection up bond0 >/dev/null
        nmcli connection up bond0-port1 >/dev/null
