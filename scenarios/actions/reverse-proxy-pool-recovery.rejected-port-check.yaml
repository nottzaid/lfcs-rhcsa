schema_version: 1
actions:
  - action_id: label-the-new-port-for-web-traffic
    target: node2
    arguments: [sudo, --, semanage, port, -m, -t, http_port_t, -p, tcp, "8081"]
  - action_id: check-only-that-the-port-answers
    target: node2
    arguments: [sudo, --, sed, -i, 's/^\(    server app[12] [0-9.]*:8081\)$/\1 check/', /etc/haproxy/haproxy.cfg]
  - action_id: validate-and-reload
    target: node2
    arguments: [sudo, --, bash, -c, "haproxy -c -q -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy.service"]
