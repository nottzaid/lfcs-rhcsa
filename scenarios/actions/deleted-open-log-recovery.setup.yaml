schema_version: 1
actions:
  - action_id: create-the-log-filesystem
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        disk=/dev/disk/by-id/virtio-lal-logs
        mkfs.xfs -q -f -L LAL_LOGS "$disk"
        install -d /var/log/lal
        printf 'LABEL=LAL_LOGS /var/log/lal xfs defaults 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        mount /var/log/lal
        useradd --system --no-create-home --shell /sbin/nologin lalingest
        useradd --system --no-create-home --shell /sbin/nologin lalmetrics
        install -d -o lalingest -g lalingest -m 0755 /var/log/lal/ingest
        install -d -o lalmetrics -g lalmetrics -m 0755 /var/log/lal/metrics
        install -d -m 0755 /usr/share/lal-logs
        findmnt -n -o UUID /var/log/lal > /usr/share/lal-logs/filesystem-uuid
        cat /proc/sys/kernel/random/boot_id > /usr/share/lal-logs/boot-id
  - action_id: start-the-log-writers
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cat > /usr/local/bin/lal-ingest <<'EOF'
        #!/bin/bash
        # Appends one line per batch and reopens its log on SIGHUP, like most daemons.
        log=/var/log/lal/ingest/ingest.log
        exec 3>>"$log"
        trap 'exec 3>>"$log"' HUP
        batch=0
        while :; do
          batch=$((batch + 1))
          printf '%s ingested batch %d\n' "$(date --iso-8601=seconds)" "$batch" >&3 2>/dev/null
          sleep 1 & wait $!
        done
        EOF
        cat > /usr/local/bin/lal-metrics <<'EOF'
        #!/bin/bash
        log=/var/log/lal/metrics/metrics.log
        while :; do
          if ! head -c 65536 /dev/zero | tr '\0' 'm' >> "$log" 2>/dev/null; then
            echo "lal-metrics: cannot append to $log: No space left on device" >&2
          fi
          sleep 2
        done
        EOF
        chmod 0755 /usr/local/bin/lal-ingest /usr/local/bin/lal-metrics
        cat > /etc/systemd/system/lal-ingest.service <<'EOF'
        [Unit]
        Description=Ingest pipeline
        RequiresMountsFor=/var/log/lal

        [Service]
        User=lalingest
        ExecStart=/usr/local/bin/lal-ingest
        ExecReload=/bin/kill -HUP $MAINPID
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
        EOF
        cat > /etc/systemd/system/lal-metrics.service <<'EOF'
        [Unit]
        Description=Metrics collector
        RequiresMountsFor=/var/log/lal

        [Service]
        User=lalmetrics
        ExecStart=/usr/local/bin/lal-metrics
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl enable --now lal-ingest.service lal-metrics.service
        sleep 2
  - action_id: grow-the-log-then-delete-it-while-open
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        log=/var/log/lal/ingest/ingest.log
        free=$(df --output=avail -B1 /var/log/lal | tail -n 1)
        fallocate -l $((free - 65536)) "$log"
        rm "$log"
        sleep 3
