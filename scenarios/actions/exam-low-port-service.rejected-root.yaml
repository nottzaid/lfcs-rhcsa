schema_version: 1
actions:
  - action_id: run-it-as-root
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /etc/systemd/system/lal-api.service.d
        printf '[Service]\nUser=root\n' > /etc/systemd/system/lal-api.service.d/root.conf
        systemctl daemon-reload
        systemctl enable lal-api.service
        systemctl restart lal-api.service
