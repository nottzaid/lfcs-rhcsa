schema_version: 1
actions:
  - action_id: write-and-enable-the-unit
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '%s\n' '[Unit]' 'Description=Sync agent' '' '[Service]' \
          'Environment=SYNC_TARGET=/srv/sync' 'ExecStart=/usr/local/bin/lal-sync' \
          'User=syncer' \
          'Restart=on-failure' \
          'RestartSec=5' \
          '' '[Install]' 'WantedBy=multi-user.target' > /etc/systemd/system/lal-sync.service
        systemctl daemon-reload
        systemctl enable --now lal-sync.service
