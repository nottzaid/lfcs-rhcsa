schema_version: 1
actions:
  - action_id: move-home-by-hand-then-renumber
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        usermod --shell /bin/bash deploysvc
        mv /home/deploysvc /srv/deploysvc
        usermod --home /srv/deploysvc deploysvc
        groupmod --gid 4200 releaseops
        usermod --uid 4201 --gid 4200 deploysvc
        chown -R --from=4301:4300 deploysvc:releaseops /srv /home
        chown --from=:4300 :releaseops -R /srv
        chmod u=rwx,g=rx,o= /srv/deploysvc
