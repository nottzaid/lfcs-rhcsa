schema_version: 1
actions:
  - action_id: apply-persistent-security-policy
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        semanage fcontext -a -t httpd_sys_content_t '/srv/lal-secure(/.*)?'
        restorecon -RF /srv/lal-secure
        semanage port -a -t http_port_t -p tcp 8443
        firewall-cmd --permanent --add-port=8443/tcp
        firewall-cmd --reload
  - action_id: replace-server-block-and-reload
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        sed -i 's/listen 8088;/listen 8443 ssl;/' /etc/nginx/conf.d/lal-secure.conf
        sed -i '/server_name/a\    ssl_certificate /etc/lal-pki/service.crt;\n    ssl_certificate_key /etc/lal-pki/private/service.key;' /etc/nginx/conf.d/lal-secure.conf
        nginx -t
        systemctl enable nginx.service
        systemctl restart nginx.service
