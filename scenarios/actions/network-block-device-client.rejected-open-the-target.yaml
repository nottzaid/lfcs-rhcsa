schema_version: 1
actions:
  - action_id: let-the-target-admit-anyone
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        targetcli /iscsi/iqn.2026-08.internal.lab:storage/tpg1 set attribute generate_node_acls=1 demo_mode_write_protect=0
        targetcli saveconfig
  - action_id: log-in-under-the-generic-name
    target: node2
    timeout_seconds: 180
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        portal={{host.node1.address}}
        iscsiadm -m discovery -t sendtargets -p "$portal"
        iscsiadm -m node -T iqn.2026-08.internal.lab:storage -p "$portal" --login
        udevadm settle
        mkfs.xfs -q -f -L LAL_DATABASE "/dev/disk/by-path/ip-$portal:3260-iscsi-iqn.2026-08.internal.lab:storage-lun-0"
        printf 'LABEL=LAL_DATABASE /srv/database xfs defaults,_netdev 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        mount /srv/database
