schema_version: 1
actions:
  - action_id: fstab-entries
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /srv/scratch /srv/export/shared
        printf 'tmpfs /srv/scratch tmpfs size=64M,mode=1777 0 0\n/srv/data/shared /srv/export/shared none bind 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        mount -a
