schema_version: 1
actions:
  - action_id: mount-it-permanently-instead
    target: node2
    timeout_seconds: 90
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /shares/projects
        printf '{{host.node1.address}}:/srv/projects /shares/projects nfs4 ro,_netdev 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        mount /shares/projects
