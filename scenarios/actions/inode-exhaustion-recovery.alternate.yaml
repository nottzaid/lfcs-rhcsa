schema_version: 1
actions:
  - action_id: remove-the-job-entirely-and-its-output
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        systemctl stop lal-thumbnailer.timer
        systemctl disable lal-thumbnailer.timer
        rm /etc/systemd/system/lal-thumbnailer.timer /etc/systemd/system/lal-thumbnailer.service
        systemctl daemon-reload
        rm -rf /var/lib/lal-cache/tmp/thumbs
