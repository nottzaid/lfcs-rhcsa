schema_version: 1
actions:
  - action_id: run-app1
    target: app1
    arguments: &run-app
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        name=$(hostname -s)
        case $name in app1) address=10.20.0.11 state=serving ;; app2) address=10.20.0.12 state=maintenance ;; esac
        nmcli connection add type ethernet ifname app0 con-name app ipv4.method manual \
          ipv4.addresses "$address/24" ipv6.method disabled >/dev/null
        nmcli connection up app >/dev/null
        install -d /opt/lal-app
        cat > /opt/lal-app/server.py <<'PY'
        """Application server: answers with its name, or 503 for everything while in maintenance."""
        import os
        import socket
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        NAME = socket.gethostname().split(".")[0]


        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                with open("/etc/lal-app/state") as state_file:
                    maintenance = state_file.read().strip() == "maintenance"
                if maintenance:
                    status, body = 503, f"{NAME}: in maintenance\n"
                elif self.path == "/health":
                    status, body = 200, "ok\n"
                else:
                    status, body = 200, f"{NAME}\n"
                data = body.encode()
                self.send_response(status)
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def log_message(self, *args):
                pass


        ThreadingHTTPServer(("0.0.0.0", 8081), Handler).serve_forever()
        PY
        install -d /etc/lal-app
        echo "$state" > /etc/lal-app/state
        cat > /etc/systemd/system/lal-app.service <<'UNIT'
        [Unit]
        Description=Application server
        After=network-online.target

        [Service]
        DynamicUser=yes
        ExecStart=/usr/bin/python3 /opt/lal-app/server.py
        Restart=always

        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl daemon-reload
        systemctl enable --now lal-app.service
        firewall-cmd --quiet --permanent --add-port=8081/tcp
        firewall-cmd --quiet --reload
  - action_id: run-app2-in-maintenance
    target: app2
    arguments: *run-app
  - action_id: point-the-proxy-at-the-new-port
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname app0 con-name app ipv4.method manual \
          ipv4.addresses 10.20.0.2/24 ipv6.method disabled >/dev/null
        nmcli connection up app >/dev/null
        cat > /etc/haproxy/haproxy.cfg <<'CFG'
        global
            log         /dev/log local0
            chroot      /var/lib/haproxy
            pidfile     /var/run/haproxy.pid
            user        haproxy
            group       haproxy
            daemon
            stats socket /var/lib/haproxy/stats

        defaults
            mode                    http
            log                     global
            option                  httplog
            timeout connect         3s
            timeout client          10s
            timeout server          10s

        frontend web
            bind *:8080
            default_backend app_servers

        # The application moved from port 80 to 8081 last night.
        backend app_servers
            balance roundrobin
            server app1 10.20.0.11:8081
            server app2 10.20.0.12:8081
        CFG
        systemctl enable haproxy.service
        systemctl restart haproxy.service
        firewall-cmd --quiet --permanent --add-port=8080/tcp
        firewall-cmd --quiet --reload
