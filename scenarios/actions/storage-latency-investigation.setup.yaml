schema_version: 1
actions:
  - action_id: mount-the-data-disk
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        mkfs.ext4 -q -F -L LAL_DATA /dev/disk/by-id/virtio-lal-data
        install -d /srv/data
        printf 'LABEL=LAL_DATA /srv/data ext4 defaults 0 2\n' >> /etc/fstab
        systemctl daemon-reload
        mount /srv/data
        useradd --system --no-create-home --shell /sbin/nologin laldata
        install -d -o laldata -g laldata -m 0750 /srv/data/db /srv/data/archive /srv/data/reports
  - action_id: start-the-data-services
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cat > /usr/local/bin/lal-db <<'EOF'
        #!/usr/bin/python3
        """Commit a small durable record every second."""
        import os
        import time

        path = "/srv/data/db/journal"
        while True:
            with open(path, "ab") as journal:
                journal.write(b"commit\n" * 512)
                journal.flush()
                os.fsync(journal.fileno())
            if os.path.getsize(path) > 4 * 1024 * 1024:
                os.truncate(path, 0)
            time.sleep(1)
        EOF
        cat > /usr/local/bin/lal-archiver <<'EOF'
        #!/bin/bash
        # Stage the next archive by rewriting the staging file, bypassing the page cache.
        while :; do
          dd if=/dev/zero of=/srv/data/archive/.staging bs=1M count=4 oflag=direct conv=notrunc status=none
          sleep 0.5
        done
        EOF
        cat > /usr/local/bin/lal-reports <<'EOF'
        #!/bin/bash
        while :; do
          date > /srv/data/reports/last-run
          sleep 60
        done
        EOF
        chmod 0755 /usr/local/bin/lal-db /usr/local/bin/lal-archiver /usr/local/bin/lal-reports
        for unit in db archiver reports; do
          cat > "/etc/systemd/system/lal-$unit.service" <<EOF
        [Unit]
        Description=Data platform $unit
        RequiresMountsFor=/srv/data

        [Service]
        User=laldata
        ExecStart=/usr/local/bin/lal-$unit
        Restart=always

        [Install]
        WantedBy=multi-user.target
        EOF
        done
        systemctl daemon-reload
        systemctl enable --now lal-db.service lal-archiver.service lal-reports.service
