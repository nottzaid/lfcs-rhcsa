schema_version: 1
actions:
  - action_id: replace-uplink-route-property
    target: node2
    arguments:
      - sudo
      - --
      - nmcli
      - connection
      - modify
      - lal-uplink
      - ipv4.routes
      - 198.51.100.0/24 192.0.2.2
  - action_id: reapply-uplink-profile
    target: node2
    arguments: [sudo, --, nmcli, device, reapply, uplink0]
