schema_version: 1
actions:
  - action_id: swap-the-stale-route
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection modify transit -ipv4.routes '172.20.30.0/24 10.50.0.254'
        nmcli connection modify transit +ipv4.routes '172.20.30.0/24 10.50.0.1'
        nmcli device reapply transit0
