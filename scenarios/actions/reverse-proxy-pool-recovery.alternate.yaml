schema_version: 1
actions:
  - action_id: let-haproxy-connect-to-any-port
    target: node2
    arguments: [sudo, --, setsebool, -P, haproxy_connect_any, "1"]
  - action_id: health-check-the-pool
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i '/^backend app_servers$/,$d' /etc/haproxy/haproxy.cfg
        cat >> /etc/haproxy/haproxy.cfg <<'CFG'
        backend app_servers
            balance roundrobin
            option httpchk
            http-check send meth GET uri /health
            http-check expect status 200
            default-server check inter 2s fall 2 rise 2
            server app1 10.20.0.11:8081
            server app2 10.20.0.12:8081
        CFG
        haproxy -c -q -f /etc/haproxy/haproxy.cfg
        systemctl restart haproxy.service
