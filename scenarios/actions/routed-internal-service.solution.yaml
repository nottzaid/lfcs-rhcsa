schema_version: 1
actions:
  - action_id: route-through-the-current-gateway
    target: node2
    arguments: [sudo, --, nmcli, connection, modify, transit, ipv4.routes, 172.20.30.0/24 10.50.0.1]
  - action_id: activate-the-profile
    target: node2
    arguments: [sudo, --, nmcli, connection, up, transit]
