schema_version: 1
actions:
  - action_id: deploy-without-an-account
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '%s\n' '[Service]' 'EnvironmentFile=/etc/lal-collector.conf' \
          'WorkingDirectory=/var/lib/lal-collector' 'ExecStart=/opt/lal/bin/collector' \
          'Restart=on-failure' '' '[Install]' 'WantedBy=multi-user.target' \
          > /etc/systemd/system/lal-collector.service
        systemctl daemon-reload
        systemctl enable --now lal-collector.service
