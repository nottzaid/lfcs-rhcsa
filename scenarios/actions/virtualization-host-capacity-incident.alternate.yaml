schema_version: 1
actions:
  - action_id: set-persistent-host-controls
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        echo 'vm.swappiness=10' > /etc/sysctl.d/80-lal-capacity.conf
        sysctl --system >/dev/null
        systemctl set-property lal-capacity-cpu.service CPUQuota=30%
        systemctl set-property lal-capacity-io.service IOWeight=10
        install -d /etc/systemd/system/lal-capacity-cpu.service.d
        printf '%s\n' '[Service]' 'Nice=5' > /etc/systemd/system/lal-capacity-cpu.service.d/priority.conf
        systemctl daemon-reload
        systemctl restart lal-capacity-cpu.service lal-capacity-io.service
  - action_id: define-alternate-bridge-profiles
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        nmcli connection add type bridge ifname br-lab con-name lal-capacity-bridge
        nmcli connection modify lal-capacity-bridge ipv4.method manual ipv4.addresses 192.0.2.50/24 ipv4.never-default yes ipv6.method disabled connection.autoconnect yes
        nmcli connection add type dummy ifname lab-port con-name lal-capacity-port master br-lab slave-type bridge
        nmcli connection modify lal-capacity-port connection.autoconnect yes
        nmcli connection up lal-capacity-bridge
  - action_id: import-alternate-capacity-guest
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        qemu-img create -f qcow2 /var/lib/libvirt/images/capacity-guest.qcow2 768M
        virt-install --connect qemu:///system --virt-type qemu --name capacity-guest --memory 384 --vcpus 1 --disk path=/var/lib/libvirt/images/capacity-guest.qcow2,format=qcow2,bus=virtio --network bridge=br-lab --import --osinfo generic --boot uefi --graphics none --noautoconsole
        virsh -c qemu:///system autostart capacity-guest
