schema_version: 1
actions:
  - action_id: automatically-repair-ext4
    target: node2
    expected_exit_codes: [0, 1]
    arguments: [sudo, --, fsck.ext4, -f, -p, /dev/disk/by-id/virtio-lal-records]
  - action_id: configure-label-based-records-mount
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf 'LABEL=LAL_RECORDS /srv/records ext4 defaults 0 2\n' >> /etc/fstab;
        mount -a
