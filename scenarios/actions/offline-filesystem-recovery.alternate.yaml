schema_version: 1
actions:
  - action_id: preview-then-repair
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        disk=/dev/disk/by-id/virtio-lal-records
        e2fsck -f -n "$disk" || true
        e2fsck -f -p "$disk" || e2fsck -f -y "$disk"
        exit 0
  - action_id: identify-the-orphan-and-mount-by-uuid
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        uuid=$(blkid -s UUID -o value /dev/disk/by-id/virtio-lal-records)
        mkdir -p /srv/records
        printf 'UUID=%s /srv/records ext4 defaults,noatime 0 2\n' "$uuid" >> /etc/fstab
        mount -a
        for orphan in /srv/records/lost+found/*; do
          if grep -q '^customer ' "$orphan"; then mv "$orphan" /srv/records/2026/important.record; fi
        done
