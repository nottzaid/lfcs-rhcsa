schema_version: 1
actions:
  - action_id: publish-iscsi-target
    target: node1
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        systemctl enable --now target.service
        targetcli clearconfig confirm=True >/dev/null 2>&1 || true
        targetcli /backstores/block create name=lalblock dev=/dev/disk/by-id/virtio-lal-target
        targetcli /iscsi create iqn.2026-08.internal.lab:storage
        targetcli /iscsi/iqn.2026-08.internal.lab:storage/tpg1/luns create /backstores/block/lalblock
        targetcli /iscsi/iqn.2026-08.internal.lab:storage/tpg1 set attribute authentication=0 generate_node_acls=1 demo_mode_write_protect=0
        targetcli /iscsi/iqn.2026-08.internal.lab:storage/tpg1/portals create 0.0.0.0 3260
        targetcli saveconfig
        firewall-cmd --quiet --permanent --add-port=3260/tcp
        firewall-cmd --quiet --reload
  - action_id: clear-iscsi-client
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        umount /srv/database >/dev/null 2>&1 || true;
        iscsiadm -m node --logoutall=all >/dev/null 2>&1 || true;
        iscsiadm -m node -o delete >/dev/null 2>&1 || true;
        sed -i '\#/srv/database#d' /etc/fstab;
        rm -rf /srv/database;
        install -d /srv/database;
        systemctl enable --now iscsid.service
