schema_version: 1
actions:
  - action_id: publish-the-target-for-a-registered-initiator
    target: node1
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        target=iqn.2026-08.internal.lab:storage
        systemctl enable --now target.service
        targetcli /backstores/block create name=database dev=/dev/disk/by-id/virtio-lal-target
        targetcli /iscsi create "$target"
        targetcli "/iscsi/$target/tpg1/luns" create /backstores/block/database
        targetcli "/iscsi/$target/tpg1/acls" create iqn.2026-09.internal.lab:node2-database
        targetcli "/iscsi/$target/tpg1" set attribute authentication=0 generate_node_acls=0
        targetcli saveconfig
        firewall-cmd --quiet --permanent --add-port=3260/tcp
        firewall-cmd --quiet --reload
  - action_id: give-node2-a-generic-initiator-name
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf 'InitiatorName=%s\n' "$(iscsi-iname)" > /etc/iscsi/initiatorname.iscsi
        install -d /srv/database
        systemctl enable --now iscsid.service
