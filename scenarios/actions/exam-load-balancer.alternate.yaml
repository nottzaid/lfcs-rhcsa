schema_version: 1
actions:
  - action_id: haproxy-with-port-labels
    target: node2
    timeout_seconds: 180
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cat > /etc/haproxy/conf.d/pool.cfg <<'CONF'
        frontend web
            bind *:80
            mode http
            acl status path /status
            use_backend first if status
            default_backend pool

        backend pool
            mode http
            balance roundrobin
            server b1 10.69.0.10:8081
            server b2 10.69.0.10:8082

        backend first
            mode http
            server b1 10.69.0.10:8081
        CONF
        setsebool -P haproxy_connect_any on
        haproxy -c -q -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d
        systemctl enable haproxy.service
        systemctl restart haproxy.service
