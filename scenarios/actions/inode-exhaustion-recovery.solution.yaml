schema_version: 1
actions:
  - action_id: stop-the-source-then-clear-scratch
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        systemctl disable --now lal-thumbnailer.timer
        find /var/lib/lal-cache/tmp -mindepth 1 -delete
