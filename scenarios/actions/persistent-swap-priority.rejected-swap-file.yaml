schema_version: 1
actions:
  - action_id: add-a-swap-file-instead
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        dd if=/dev/zero of=/swapfile bs=1M count=512 status=none
        chmod 0600 /swapfile
        mkswap -L LAL_SWAP /swapfile
        printf '/swapfile none swap defaults,pri=50 0 0\n' >> /etc/fstab
        swapon -a
