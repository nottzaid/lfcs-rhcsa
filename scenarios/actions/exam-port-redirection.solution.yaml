schema_version: 1
actions:
  - action_id: allow-http-and-redirect-8080-permanently
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        firewall-cmd --quiet --permanent --add-service=http
        firewall-cmd --quiet --permanent --add-forward-port=port=8080:proto=tcp:toport=80
        firewall-cmd --quiet --reload
