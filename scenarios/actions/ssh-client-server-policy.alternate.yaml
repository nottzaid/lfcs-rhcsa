schema_version: 1
actions:
  - action_id: set-the-port-in-the-system-client-config
    target: runner
    arguments: [sudo, --, bash, -c, "printf 'Host app-node\\n    Port 2222\\n' > /etc/ssh/ssh_config.d/50-app-node.conf"]
  - action_id: fix-the-server-side
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        semanage port -a -t ssh_port_t -p tcp 2222
        firewall-cmd --quiet --permanent --service=ssh --add-port=2222/tcp
        firewall-cmd --quiet --reload
        chmod 0750 /home/deploy
        systemctl restart sshd.service
