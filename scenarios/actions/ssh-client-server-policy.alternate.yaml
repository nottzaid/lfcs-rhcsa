schema_version: 1
actions:
  - action_id: install-server-policy-alternate-layout
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        usermod -aG opsssh deploy;
        echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP3+T5Lj8x3z+DAkXwy2Nn4B1OXBjx9ukv/49f0YmnDW lal-deploy-fixture'
        > /home/deploy/.ssh/authorized_keys;
        chown deploy:deploy /home/deploy/.ssh/authorized_keys;
        chmod 0600 /home/deploy/.ssh/authorized_keys;
        printf '%s\n' 'Port 2222' 'Port 22' 'PermitRootLogin no' 'PasswordAuthentication no'
        'PubkeyAuthentication yes' 'AllowGroups opsssh wheel' > /etc/ssh/sshd_config.d/99-deployment.conf;
        semanage port -a -p tcp -t ssh_port_t 2222;
        firewall-cmd --quiet --permanent --add-port=2222/tcp;
        firewall-cmd --quiet --reload;
        sshd -t && systemctl restart sshd
  - action_id: install-client-policy-alternate-layout
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf '%s\n' 'Host app-node' '  HostName {{host.node2.address}}' '  Port 2222'
        '  User deploy' '  IdentityFile /home/deploy/.ssh/lal_deploy' '  IdentitiesOnly yes'
        > /home/deploy/.ssh/config;
        chown deploy:deploy /home/deploy/.ssh/config;
        chmod 0600 /home/deploy/.ssh/config
