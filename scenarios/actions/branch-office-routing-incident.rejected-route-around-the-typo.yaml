schema_version: 1
actions:
  - action_id: point-the-datacenter-at-the-typo
    target: dc
    arguments: [sudo, --, bash, -c, "nmcli connection modify dc ipv4.routes '10.70.0.0/24 172.20.0.11' && nmcli connection up dc"]
  - action_id: route-forward-and-filter-on-the-router
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection modify dc ipv4.routes '172.21.0.0/24 172.20.0.2'
        nmcli connection up dc
        echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/90-router.conf
        sysctl --quiet --load /etc/sysctl.d/90-router.conf
        firewall-cmd --quiet --permanent --new-zone=branch
        firewall-cmd --quiet --permanent --new-zone=datacenter
        firewall-cmd --quiet --permanent --zone=branch --change-interface=branch0
        firewall-cmd --quiet --permanent --zone=datacenter --change-interface=dc0
        firewall-cmd --quiet --permanent --new-policy branch-to-orders
        firewall-cmd --quiet --permanent --policy branch-to-orders --add-ingress-zone branch
        firewall-cmd --quiet --permanent --policy branch-to-orders --add-egress-zone datacenter
        firewall-cmd --quiet --permanent --policy branch-to-orders \
          --add-rich-rule='rule family="ipv4" destination address="172.21.0.10" port port="8080" protocol="tcp" accept'
        firewall-cmd --quiet --reload
