schema_version: 1
actions:
  - action_id: serve-a-page-and-an-internal-service-on-node2
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname lan0 con-name lan ipv4.method manual \
          ipv4.addresses 10.63.0.20/24 ipv6.method disabled >/dev/null
        nmcli connection up lan >/dev/null
        printf '<h1>node2 serves this page</h1>\n' > /usr/share/nginx/html/index.html
        systemctl enable --now nginx.service
        cat > /etc/systemd/system/lal-metrics.service <<'UNIT'
        [Unit]
        Description=Internal metrics endpoint

        [Service]
        DynamicUser=yes
        ExecStart=/usr/bin/python3 -m http.server 8443 --directory /usr/share/nginx/html

        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl daemon-reload
        systemctl enable --now lal-metrics.service
  - action_id: address-node1
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname lan0 con-name lan ipv4.method manual \
          ipv4.addresses 10.63.0.10/24 ipv6.method disabled >/dev/null
        nmcli connection up lan >/dev/null
