schema_version: 1
actions:
  - action_id: create-the-directory-only
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d -o collector -g collector /var/lib/lal-collector
        systemctl restart --no-block lal-collector.service
