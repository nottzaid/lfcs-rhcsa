schema_version: 1
actions:
  - action_id: prepare-the-team-and-a-blank-disk
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        groupadd archivists
        useradd --create-home --groups archivists archive1
        useradd --create-home visitor
        wipefs --all --quiet /dev/disk/by-id/virtio-lal-archive
        install -d -m 0755 /srv/archive
