schema_version: 1
actions:
  - action_id: zone-the-router-interfaces
    target: router
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        firewall-cmd --quiet --permanent --zone=internal --change-interface=lan0
        firewall-cmd --quiet --permanent --zone=external --change-interface=wan0
  - action_id: redirect-public-http-to-the-service
    target: router
    arguments: [sudo, --, firewall-cmd, --permanent, --zone=external, "--add-forward-port=port=80:proto=tcp:toport=8080"]
  - action_id: let-the-office-out
    target: router
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        firewall-cmd --quiet --permanent --new-policy office-out
        firewall-cmd --quiet --permanent --policy office-out --add-ingress-zone internal
        firewall-cmd --quiet --permanent --policy office-out --add-egress-zone external
        firewall-cmd --quiet --permanent --policy office-out --set-target ACCEPT
  - action_id: load-the-permanent-configuration
    target: router
    arguments: [sudo, --, firewall-cmd, --reload]
