schema_version: 1
actions:
  - action_id: disable-but-leave-the-boot-hook
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        systemctl disable --now lal-collector-v1.service
        sed -i 's/^BATCH_SIZE=.*/BATCH_SIZE=50/' /etc/sysconfig/lal-metrics
        systemctl reset-failed lal-metrics.service
        systemctl restart lal-metrics.service
