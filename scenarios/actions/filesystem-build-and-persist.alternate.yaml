schema_version: 1
actions:
  - action_id: format-and-label-archive
    target: node2
    arguments: [sudo, --, mkfs, -t, xfs, -L, LAL_ARCHIVE, /dev/disk/by-id/virtio-lal-archive]
  - action_id: configure-label-mount
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf 'LABEL=LAL_ARCHIVE /srv/archive xfs defaults 0 0\n' >> /etc/fstab;
        mount -a;
        chgrp archivists /srv/archive;
        chmod 2770 /srv/archive
