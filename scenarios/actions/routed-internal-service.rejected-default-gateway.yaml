schema_version: 1
actions:
  - action_id: make-the-gateway-a-default-route
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection modify transit ipv4.routes '' ipv4.gateway 10.50.0.1 ipv4.route-metric 50
        nmcli connection up transit
