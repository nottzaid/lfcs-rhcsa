schema_version: 1
actions:
  - action_id: install-reportbot-schedule
    target: node2
    arguments:
      - sudo
      - --
      - sh
      - -c
      - >-
        printf '%s\n' 'CRON_TZ=UTC' 'MAILTO=""'
        '40 6 * * 1-5 /opt/lal/bin/generate-usage-report --format compact'
        | crontab -u reportbot -
  - action_id: prove-report-job
    target: node2
    arguments:
      - sudo
      - --user=reportbot
      - --set-home
      - --
      - /opt/lal/bin/generate-usage-report
      - --format
      - compact
