schema_version: 1
actions:
  - action_id: queue-from-a-directory-handoff-cannot-enter
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i '/^handoff$/d' /etc/at.deny
        systemctl enable --now atd.service
        cd /root
        echo 'echo approved > /var/lib/handoff/ready' | runuser -u handoff -- at 06:00
