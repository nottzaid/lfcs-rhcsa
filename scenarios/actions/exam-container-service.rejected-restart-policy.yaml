schema_version: 1
actions:
  - action_id: run-with-a-restart-policy
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - podman
      - run
      - --detach
      - --name
      - web
      - --restart=always
      - --publish
      - "8088:8080"
      - --volume
      - /srv/web/content:/content:ro,Z
      - localhost/lal-web:1
