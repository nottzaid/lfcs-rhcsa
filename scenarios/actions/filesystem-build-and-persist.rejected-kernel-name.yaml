schema_version: 1
actions:
  - action_id: mount-by-kernel-device-name
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        mkfs.xfs -q -L LAL_ARCHIVE /dev/disk/by-id/virtio-lal-archive
        printf '%s /srv/archive xfs defaults 0 0\n' "$(readlink -f /dev/disk/by-id/virtio-lal-archive)" >> /etc/fstab
        systemctl daemon-reload
        mount /srv/archive
        chown root:archivists /srv/archive
        chmod 2770 /srv/archive
