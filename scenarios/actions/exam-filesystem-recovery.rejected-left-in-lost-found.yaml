schema_version: 1
actions:
  - action_id: repair-and-mount-only
    target: node2
    timeout_seconds: 180
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -uo pipefail
        e2fsck -fy /dev/disk/by-id/virtio-lal-vault >/dev/null 2>&1
        (( $? < 4 )) || exit 1
        mount /srv/vault
