schema_version: 1
actions:
  - action_id: cap-the-archiver-in-a-drop-in
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /etc/systemd/system/lal-archiver.service.d
        printf '[Service]\nIOWriteBandwidthMax=/srv/data 1M\n' > /etc/systemd/system/lal-archiver.service.d/io.conf
        systemctl daemon-reload
        systemctl restart lal-archiver.service
