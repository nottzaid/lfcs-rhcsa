schema_version: 1
actions:
  - action_id: generate-a-unit-from-the-container
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        podman generate systemd --new --name lal-worker > /etc/systemd/system/lal-worker.service
        systemctl daemon-reload
  - action_id: enable-and-start-the-worker-service
    target: node2
    arguments: [sudo, --, systemctl, enable, --now, lal-worker.service]
