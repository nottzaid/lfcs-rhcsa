schema_version: 1
actions:
  - action_id: create-worker-container
    target: node2
    arguments:
      - sudo
      - --
      - podman
      - create
      - --name
      - lal-worker
      - --env
      - WORKER_SITE=amman
      - --volume
      - /srv/worker-data:/data:Z
      - localhost/lal-worker:1
      - /bin/bash
      - -c
      - printf '%s\n' "$WORKER_SITE" > /data/ready; exec /bin/bash -c 'while :; do read -r -t 60 || true; done'
  - action_id: generate-systemd-worker-unit
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        cd /etc/systemd/system;
        podman generate systemd --new --name --files lal-worker;
        mv container-lal-worker.service lal-worker.service;
        systemctl daemon-reload;
        systemctl enable --now lal-worker.service
