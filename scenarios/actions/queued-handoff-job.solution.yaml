schema_version: 1
actions:
  - action_id: enable-atd
    target: node2
    arguments: [sudo, --, systemctl, enable, --now, atd.service]
  - action_id: queue-handoff
    target: node2
    arguments:
      - sudo
      - --
      - runuser
      - --user
      - handoff
      - --
      - bash
      - -c
      - >-
        printf "%s\n" "/usr/bin/printf 'approved\\n' > /var/lib/handoff/ready" | at now + 1 hour
