schema_version: 1
actions:
  - action_id: allow-and-start-the-scheduler
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i '/^handoff$/d' /etc/at.deny
        systemctl enable --now atd.service
  - action_id: queue-the-handoff-as-handoff
    target: node2
    arguments:
      - sudo
      - --
      - runuser
      - --login
      - handoff
      - --command
      - echo 'echo approved > /var/lib/handoff/ready' | at 06:00
