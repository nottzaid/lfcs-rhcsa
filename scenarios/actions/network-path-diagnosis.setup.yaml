schema_version: 1
actions:
  - action_id: install-loopback-monitor-service
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        install -d /srv/lal-monitor
        printf 'monitor-ready\n' > /srv/lal-monitor/index.html
        cat > /etc/systemd/system/lal-monitor.service <<'EOF'
        [Unit]
        Description=Linux Admin Lab monitor endpoint

        [Service]
        WorkingDirectory=/srv/lal-monitor
        Environment=MONITOR_BIND=127.0.0.1
        ExecStart=/bin/bash -c 'exec python3 -m http.server 9090 --bind "$MONITOR_BIND"'
        Restart=always

        [Install]
        WantedBy=multi-user.target
        EOF
        rm -rf /etc/systemd/system/lal-monitor.service.d
        systemctl daemon-reload
        systemctl enable --now lal-monitor.service
        firewall-cmd --quiet --permanent --add-port=9090/tcp
        firewall-cmd --quiet --reload
  - action_id: install-stale-monitor-resolution
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        sed -i '/[[:space:]]monitor\.internal\([[:space:]]\|$\)/d' /etc/hosts;
        printf '192.0.2.99 monitor.internal\n' >> /etc/hosts
