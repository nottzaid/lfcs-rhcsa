schema_version: 1
actions:
  - action_id: declare-the-state-directory
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '[Service]\nStateDirectory=lal-api\n' > /etc/systemd/system/lal-api.service.d/20-state.conf
        systemctl daemon-reload
        systemctl restart lal-api.service
