schema_version: 1
actions:
  - action_id: grant-api-state-write-path
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        install -d /etc/systemd/system/lal-api.service.d
        cat > /etc/systemd/system/lal-api.service.d/state.conf <<'EOF'
        [Service]
        ReadWritePaths=/var/lib/lal-api
        EOF
        systemctl daemon-reload
        systemctl restart lal-api.service
