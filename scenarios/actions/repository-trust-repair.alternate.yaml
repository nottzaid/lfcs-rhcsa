schema_version: 1
actions:
  - action_id: import-the-key-then-enable-checking
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        rpm --import /srv/lal-repo/RPM-GPG-KEY-lal-release
        dnf config-manager --save --setopt=lal-training.baseurl=file:///srv/lal-repo \
          --setopt=lal-training.gpgcheck=1
        dnf -y --repo lal-training install lal-release-notes
