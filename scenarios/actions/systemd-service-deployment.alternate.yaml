schema_version: 1
actions:
  - action_id: install-a-local-unit-with-different-choices
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /usr/local/lib/systemd/system
        cat > /usr/local/lib/systemd/system/lal-collector.service <<'EOF'
        [Unit]
        Description=Warehouse metrics collector
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=exec
        ExecStart=/opt/lal/bin/collector
        User=collector
        Group=collector
        WorkingDirectory=/var/lib/lal-collector
        EnvironmentFile=-/etc/lal-collector.conf
        Restart=always
        RestartSec=1

        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl enable lal-collector.service
        systemctl start lal-collector.service
