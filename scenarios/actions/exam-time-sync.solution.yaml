schema_version: 1
actions:
  - action_id: one-server-and-the-time-zone
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i 's/^pool .*/server 10.65.0.1 iburst/' /etc/chrony.conf
        systemctl restart chronyd.service
        timedatectl set-timezone Europe/Amsterdam
