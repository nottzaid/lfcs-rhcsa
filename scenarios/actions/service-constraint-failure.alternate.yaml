schema_version: 1
actions:
  - action_id: open-exactly-the-existing-state-path
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cat >> /etc/systemd/system/lal-api.service <<'EOF'

        [Service]
        ReadWritePaths=/var/lib/lal-api
        EOF
        systemctl daemon-reload
        systemctl restart lal-api.service
