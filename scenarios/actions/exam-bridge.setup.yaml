schema_version: 1
actions:
  - action_id: address-node1
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname lan0 con-name lan ipv4.method manual \
          ipv4.addresses 10.75.0.10/24 ipv6.method disabled >/dev/null
        nmcli connection up lan >/dev/null
  - action_id: address-node2-on-lan1
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname lan1 con-name lan1 ipv4.method manual \
          ipv4.addresses 10.75.0.20/24 ipv6.method disabled >/dev/null
        nmcli connection up lan1 >/dev/null
