schema_version: 1
actions:
  - action_id: boolean-and-chcon
    target: node2
    timeout_seconds: 180
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        setsebool -P httpd_can_network_connect on
        chcon -R -t httpd_sys_rw_content_t /srv/uploads
