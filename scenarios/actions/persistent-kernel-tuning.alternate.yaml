schema_version: 1
actions:
  - action_id: override-in-a-file-that-sorts-last
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf 'fs.inotify.max_user_watches=524288\n' > /etc/sysctl.d/99-zz-sync-agent.conf
        sysctl -p /etc/sysctl.d/99-zz-sync-agent.conf
        systemctl restart lal-sync.service
