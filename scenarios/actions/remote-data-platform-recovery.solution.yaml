schema_version: 1
actions:
  - action_id: repair-time-and-virtual-filesystems
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        cat > /etc/chrony.conf <<'EOF'
        server {{host.node1.address}} iburst
        driftfile /var/lib/chrony/drift
        makestep 1.0 3
        rtcsync
        logdir /var/log/chrony
        EOF
        systemctl enable chronyd.service
        systemctl restart chronyd.service
        chronyc waitsync 30 0.5
        sed -i '\#/run/lal-data-cache#d' /etc/fstab
        printf 'tmpfs /run/lal-data-cache tmpfs size=96M,mode=0750 0 0\n' >> /etc/fstab
        mount /run/lal-data-cache
  - action_id: configure-priority-swap
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        disk=/dev/disk/by-id/virtio-lal-remoteswap
        mkswap -L LAL_REMOTE_SWAP "$disk"
        uuid=$(blkid -s UUID -o value "$disk")
        printf 'UUID=%s none swap pri=50 0 0\n' "$uuid" >> /etc/fstab
        swapon --priority 50 "$disk"
  - action_id: configure-project-automount
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        install -d /etc/auto.master.d
        printf '/data /etc/auto.lal-data --timeout=60\n' > /etc/auto.master.d/lal-data.autofs
        printf 'projects -fstype=nfs4,ro {{host.node1.address}}:/srv/lal-data/projects\n' > /etc/auto.lal-data
        systemctl enable --now autofs.service
        systemctl restart autofs.service
        cat /data/projects/status.txt
