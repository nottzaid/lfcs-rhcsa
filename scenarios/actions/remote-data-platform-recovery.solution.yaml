schema_version: 1
actions:
  - action_id: point-the-automounter-at-node1
    target: node2
    arguments: [sudo, --, bash, -c, "sed -i 's/files\\.old\\.invalid:/10.80.0.1:/' /etc/auto.data && systemctl enable --now autofs.service"]
  - action_id: give-the-scratch-tmpfs-its-96-mib
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i 's#^tmpfs /run/lal-data-cache tmpfs size=96,#tmpfs /run/lal-data-cache tmpfs size=96M,#' /etc/fstab
        systemctl daemon-reload
        mount -o remount /run/lal-data-cache
  - action_id: make-the-new-disk-the-priority-swap
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        mkswap -q -L LAL_REMOTE_SWAP /dev/disk/by-id/virtio-lal-remoteswap
        sed -i 's#^UUID=5d1b7c1e-0f3a-4c55-9a0e-2f6c1b7a9e44 none swap#LABEL=LAL_REMOTE_SWAP none swap#' /etc/fstab
        systemctl daemon-reload
        swapon -a
  - action_id: follow-the-site-time-server
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i 's/^server ntp\.old\.invalid iburst$/server 10.80.0.1 iburst/' /etc/chrony.conf
        systemctl restart chronyd.service
        chronyc waitsync 30 0.5 0 1 >/dev/null
