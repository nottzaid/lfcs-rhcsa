schema_version: 1
actions:
  - action_id: create-accounts-and-stale-limits
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        useradd --create-home --shell /bin/bash batchsvc
        useradd --create-home --shell /bin/bash opsuser
        printf '%s\n' 'batchsvc soft nofile 1024' 'batchsvc hard nofile 2048' \
          'batchsvc soft nproc 128' 'batchsvc hard nproc 256' \
          > /etc/security/limits.d/90-lal-batch.conf
        chmod 0644 /etc/security/limits.d/90-lal-batch.conf
  - action_id: install-the-partition-job
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d -o batchsvc -g batchsvc -m 0750 /var/lib/lal-batch
        cat > /usr/local/bin/lal-batch <<'EOF'
        #!/usr/bin/python3
        """Hold one open handle per partition, as the real job does, then record the run."""
        import sys

        PARTITIONS = 3000
        handles = []
        try:
            for _ in range(PARTITIONS):
                handles.append(open("/dev/null", "rb"))
        except OSError as error:
            sys.exit(f"lal-batch: opened {len(handles)} of {PARTITIONS} partitions: {error.strerror}")
        with open("/var/lib/lal-batch/last-run", "w") as record:
            record.write(f"partitions={PARTITIONS}\n")
        print(f"lal-batch: processed {PARTITIONS} partitions")
        EOF
        chmod 0755 /usr/local/bin/lal-batch
        cat > /usr/lib/systemd/system/lal-batch.service <<'EOF'
        [Unit]
        Description=Nightly partition batch job

        [Service]
        Type=oneshot
        User=batchsvc
        Group=batchsvc
        ExecStart=/usr/local/bin/lal-batch
        EOF
        install -d -m 0755 /usr/share/lal-batch
        sha256sum /usr/lib/systemd/system/lal-batch.service > /usr/share/lal-batch/lal-batch.service.sha256
        systemctl daemon-reload
        systemctl start lal-batch.service || true
