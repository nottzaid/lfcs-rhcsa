schema_version: 1
actions:
  - action_id: mount-every-home-from-fstab
    target: node2
    timeout_seconds: 60
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /remote/home
        printf '10.66.0.10:/exports/home /remote/home nfs4 rw,_netdev 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        mount /remote/home
