schema_version: 1
actions:
  - action_id: create-and-activate-by-label
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        mkswap -L LAL_SWAP /dev/disk/by-id/virtio-lal-swap
        printf 'LABEL=LAL_SWAP none swap defaults,pri=50 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        swapon -a
