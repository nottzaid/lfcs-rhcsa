schema_version: 1
actions:
  - action_id: create-labeled-swap
    target: node2
    arguments: [sudo, --, mkswap, --label, LAL_SWAP, /dev/disk/by-id/virtio-lal-swap]
  - action_id: persist-and-activate-swap
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        uuid=$(blkid -s UUID -o value /dev/disk/by-id/virtio-lal-swap);
        printf 'UUID=%s none swap defaults,pri=50 0 0\n' "$uuid" >> /etc/fstab;
        swapon --priority 50 /dev/disk/by-id/virtio-lal-swap
