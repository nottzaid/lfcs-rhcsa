schema_version: 1
actions:
  - action_id: repair-secure-deployment
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        semanage fcontext -a -t httpd_sys_content_t '/srv/lal-secure(/.*)?'
        restorecon -RF /srv/lal-secure
        semanage port -a -t http_port_t -p tcp 8443
        cat > /etc/nginx/conf.d/lal-secure.conf <<'EOF'
        server {
            listen 8443 ssl;
            server_name service.internal;
            root /srv/lal-secure;
            ssl_certificate /etc/lal-pki/service.crt;
            ssl_certificate_key /etc/lal-pki/private/service.key;
        }
        EOF
        firewall-cmd --quiet --permanent --add-port=8443/tcp
        firewall-cmd --quiet --reload
        nginx -t
        systemctl enable --now nginx.service
        systemctl restart nginx.service
