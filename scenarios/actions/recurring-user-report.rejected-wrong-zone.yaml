schema_version: 1
actions:
  - action_id: fix-the-time-but-keep-the-zone
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        printf '%s\n' 'CRON_TZ=Asia/Amman' 'PATH=/opt/lal/bin:/usr/bin:/bin' \
          '40 6 * * 1-5 generate-usage-report --format compact' | crontab -u reportbot -
