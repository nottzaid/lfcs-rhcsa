schema_version: 1
actions:
  - action_id: truncate-the-deleted-file-in-place
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        pid=$(systemctl show --property=MainPID --value lal-ingest.service)
        for fd in /proc/"$pid"/fd/*; do
          case "$(readlink "$fd")" in *'(deleted)') truncate -s 0 "$fd" ;; esac
        done
