schema_version: 1
actions:
  - action_id: remove-the-dump-and-truncate-the-deleted-log
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        rm /srv/data/.cache/old-dumps/core.2291
        pid=$(systemctl show -p MainPID --value lal-writer.service)
        for fd in /proc/"$pid"/fd/*; do
          if [[ "$(readlink "$fd")" == "/srv/data/logs/app.log (deleted)" ]]; then truncate -s 0 "$fd"; fi
        done
