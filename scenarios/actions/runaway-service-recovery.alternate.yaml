schema_version: 1
actions:
  - action_id: disable-remove-hook-and-rewrite-environment
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        systemctl disable --now lal-collector-v1.service
        sed -i 's/^@reboot/# retired: @reboot/' /etc/cron.d/legacy-collector
        printf '# Per the lal-metrics migration runbook\nBATCH_SIZE=50\n' > /etc/sysconfig/lal-metrics
        sleep 11
        systemctl start lal-metrics.service
