schema_version: 1
actions:
  - action_id: terminate-retired-process
    target: node2
    arguments: [sudo, --, pkill, --full, --exact, lal-legacy-spin]
  - action_id: replace-metrics-environment
    target: node2
    arguments:
      - sudo
      - --
      - sh
      - -c
      - "printf '%s\n' 'BATCH_SIZE=50' > /etc/sysconfig/lal-metrics"
  - action_id: recover-and-enable-metrics-worker
    target: node2
    arguments: [sudo, --, systemctl, reset-failed, lal-metrics.service]
  - action_id: enable-recovered-metrics-worker
    target: node2
    arguments: [sudo, --, systemctl, enable, --now, lal-metrics.service]
