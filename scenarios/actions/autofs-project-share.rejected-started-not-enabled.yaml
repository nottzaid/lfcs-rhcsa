schema_version: 1
actions:
  - action_id: fix-the-map-and-start-for-now
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i 's#192\.0\.2\.99#{{host.node1.address}}#' /etc/auto.projects
        sed -i 's#--timeout=900#--timeout=300#' /etc/auto.master.d/projects.autofs
        systemctl start autofs.service
