schema_version: 1
actions:
  - action_id: retire-v1-for-good
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        systemctl mask --now lal-collector-v1.service
        rm /etc/cron.d/legacy-collector
  - action_id: fix-the-batch-size
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i 's/^BATCH_SIZE=.*/BATCH_SIZE=50/' /etc/sysconfig/lal-metrics
        systemctl reset-failed lal-metrics.service
        systemctl restart lal-metrics.service
