schema_version: 1
actions:
  - action_id: stop-retired-workload
    target: node2
    arguments: [sudo, --, systemctl, stop, lal-legacy-spin.service]
  - action_id: repair-metrics-environment
    target: node2
    arguments:
      - sudo
      - --
      - sed
      - --in-place
      - s/BATCH_SIZE=5/BATCH_SIZE=50/
      - /etc/sysconfig/lal-metrics
  - action_id: restart-metrics-worker
    target: node2
    arguments: [sudo, --, systemctl, reset-failed, lal-metrics.service]
  - action_id: restart-metrics-worker-after-reset
    target: node2
    arguments: [sudo, --, systemctl, restart, lal-metrics.service]
  - action_id: preserve-metrics-enablement
    target: node2
    arguments: [sudo, --, systemctl, enable, lal-metrics.service]
