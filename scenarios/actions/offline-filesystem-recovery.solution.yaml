schema_version: 1
actions:
  - action_id: repair-offline
    target: node2
    arguments: [sudo, --, e2fsck, -f, -y, /dev/disk/by-id/virtio-lal-records]
    expected_exit_codes: [0, 1]
  - action_id: mount-persistently-and-restore-the-record
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /srv/records
        printf 'LABEL=LAL_RECORDS /srv/records ext4 defaults 0 2\n' >> /etc/fstab
        systemctl daemon-reload
        mount /srv/records
        mv '/srv/records/lost+found/#16' /srv/records/2026/important.record
