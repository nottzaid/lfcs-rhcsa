schema_version: 1
actions:
  - action_id: repair-records-filesystem
    target: node2
    expected_exit_codes: [0, 1]
    arguments: [sudo, --, e2fsck, -f, -y, /dev/disk/by-id/virtio-lal-records]
  - action_id: persist-and-mount-records
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        uuid=$(blkid -s UUID -o value /dev/disk/by-id/virtio-lal-records);
        printf 'UUID=%s /srv/records ext4 defaults 0 2\n' "$uuid" >> /etc/fstab;
        mount /srv/records
