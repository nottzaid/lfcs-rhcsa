schema_version: 1
actions:
  - action_id: create-utility-guest-disk
    target: node2
    arguments: [sudo, --, qemu-img, create, -f, qcow2, /var/lib/libvirt/images/lfcs-guest.qcow2, 768M]
  - action_id: define-and-run-utility-guest
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - virt-install
      - --connect
      - qemu:///system
      - --virt-type
      - qemu
      - --name
      - lfcs-guest
      - --memory
      - "384"
      - --vcpus
      - "1"
      - --disk
      - path=/var/lib/libvirt/images/lfcs-guest.qcow2,format=qcow2,bus=virtio
      - --import
      - --osinfo
      - generic
      - --boot
      - uefi
      - --graphics
      - none
      - --noautoconsole
      - --autostart
