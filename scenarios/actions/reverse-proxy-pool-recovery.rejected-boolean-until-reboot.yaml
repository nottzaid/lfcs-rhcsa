schema_version: 1
actions:
  - action_id: let-haproxy-connect-to-any-port-for-now
    target: node2
    arguments: [sudo, --, setsebool, haproxy_connect_any, "1"]
  - action_id: health-check-the-pool
    target: node2
    arguments:
      - sudo
      - --
      - sed
      - -i
      - -e
      - 's/^\(    server app[12] [0-9.]*:8081\)$/\1 check/'
      - -e
      - '/^    balance roundrobin$/a\    option httpchk GET /health'
      - /etc/haproxy/haproxy.cfg
  - action_id: validate-and-reload
    target: node2
    arguments: [sudo, --, bash, -c, "haproxy -c -q -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy.service"]
