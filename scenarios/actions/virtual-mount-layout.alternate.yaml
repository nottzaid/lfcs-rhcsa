schema_version: 1
actions:
  - action_id: mount-runtime-cache
    target: node2
    arguments: [sudo, --, mount, -t, tmpfs, -o, "size=65536k,mode=750", tmpfs, /run/lal-cache]
  - action_id: mount-current-release
    target: node2
    arguments: [sudo, --, mount, --bind, /srv/releases/current, /opt/app/current]
  - action_id: persist-mounts
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf '%s\n' 'tmpfs /run/lal-cache tmpfs rw,nosuid,nodev,size=64M,mode=0750 0 0'
        '/srv/releases/current /opt/app/current none defaults,bind 0 0' >> /etc/fstab
