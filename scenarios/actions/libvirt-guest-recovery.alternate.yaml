schema_version: 1
actions:
  - action_id: move-the-disk-back
    target: node2
    arguments: [sudo, --, mv, /var/lib/libvirt/images/archive/lal-utility-data.img, /var/lib/libvirt/images/lal-utility-data.img]
  - action_id: autostart-and-start-everything
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        virsh net-autostart appliances
        virsh net-start appliances
        virsh autostart lal-utility
        virsh start lal-utility
