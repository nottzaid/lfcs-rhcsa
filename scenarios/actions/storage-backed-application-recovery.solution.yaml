schema_version: 1
actions:
  - action_id: delete-exports-past-retention
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        oldest_kept=$(date -d '-6 days' +%F)
        for export in /srv/lal-catalog/exports/catalog-*.csv; do
          day=${export##*/catalog-}; day=${day%.csv}
          if [[ $day < $oldest_kept ]]; then rm -- "$export"; fi
        done
  - action_id: grow-the-volume-and-its-filesystem
    target: node2
    arguments: [sudo, --, lvextend, --resizefs, --size, 1024M, vgapps/lvcatalog]
  - action_id: mount-it-at-boot
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        echo "UUID=$(blkid -s UUID -o value /dev/vgapps/lvcatalog) /srv/lal-catalog ext4 defaults 0 2" >> /etc/fstab
        systemctl daemon-reload
  - action_id: restart-the-catalog
    target: node2
    arguments: [sudo, --, systemctl, restart, lal-catalog.service]
