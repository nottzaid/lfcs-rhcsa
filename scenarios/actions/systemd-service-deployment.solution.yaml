schema_version: 1
actions:
  - action_id: write-and-enable-the-unit
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cat > /etc/systemd/system/lal-collector.service <<'EOF'
        [Unit]
        Description=Metrics collector

        [Service]
        User=collector
        Group=collector
        EnvironmentFile=/etc/lal-collector.conf
        WorkingDirectory=/var/lib/lal-collector
        ExecStart=/opt/lal/bin/collector
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl enable --now lal-collector.service
