schema_version: 1
actions:
  - action_id: export-the-team-share-from-node1
    target: node1
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        groupadd --gid 2200 appshare
        useradd --uid 2200 --gid 2200 --create-home appshare
        install -d -o appshare -g appshare -m 0770 /srv/teamshare
        printf 'shared project record\n' > /srv/teamshare/project.txt
        chown appshare:appshare /srv/teamshare/project.txt
        printf '/srv/teamshare {{host.node2.address}}/32(rw,sync,no_subtree_check,root_squash)\n' \
          > /etc/exports.d/lal-teamshare.exports
        install -d -m 0755 /usr/share/lal-nfs
        sha256sum /etc/exports.d/lal-teamshare.exports /srv/teamshare/project.txt > /usr/share/lal-nfs/server.sha256
        setsebool -P nfs_export_all_rw 1
        systemctl enable --now nfs-server.service
        exportfs -ra
        firewall-cmd --quiet --permanent --add-service=nfs
        firewall-cmd --quiet --reload
  - action_id: leave-node2-pointing-at-the-retired-server
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        groupadd --gid 2201 appshare
        useradd --uid 2201 --gid 2201 --create-home appshare
        install -d /mnt/teamshare
        printf '192.0.2.99:/srv/teamshare /mnt/teamshare nfs4 defaults,_netdev 0 0\n' >> /etc/fstab
        systemctl daemon-reload
