schema_version: 1
actions:
  - action_id: export-the-projects-from-node1
    target: node1
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d -m 0755 /srv/projects
        printf 'project-share-ready\n' > /srv/projects/status.txt
        printf '/srv/projects {{host.node2.address}}/32(ro,sync,no_subtree_check,root_squash)\n' \
          > /etc/exports.d/lal-projects.exports
        setsebool -P nfs_export_all_ro 1
        systemctl enable --now nfs-server.service
        exportfs -ra
        firewall-cmd --quiet --permanent --add-service=nfs
        firewall-cmd --quiet --reload
  - action_id: leave-a-stale-map-and-a-stopped-automounter
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        printf '/shares  /etc/auto.projects  --timeout=900\n' > /etc/auto.master.d/projects.autofs
        printf 'projects  -fstype=nfs4,ro  192.0.2.99:/srv/projects\n' > /etc/auto.projects
        systemctl disable --now autofs.service
