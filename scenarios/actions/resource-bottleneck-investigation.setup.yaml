schema_version: 1
actions:
  - action_id: install-indexer-workload
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        cat > /etc/systemd/system/lal-indexer.service <<'EOF'
        [Unit]
        Description=Background search indexer

        [Service]
        ExecStart=/usr/bin/stress-ng --cpu 1 --cpu-method all
        Restart=always

        [Install]
        WantedBy=multi-user.target
        EOF
        rm -rf /etc/systemd/system/lal-indexer.service.d
        systemctl daemon-reload
        systemctl enable --now lal-indexer.service
