schema_version: 1
actions:
  - action_id: install-the-search-services
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        useradd --system --no-create-home --shell /sbin/nologin lalsearch
        install -d -m 0755 /usr/local/libexec/lal-search
        cat > /usr/local/libexec/lal-search/reindex <<'EOF'
        #!/usr/bin/python3
        """Rebuild the search index. This build never yields the CPU between documents."""
        import hashlib

        digest = hashlib.sha256()
        while True:
            digest.update(digest.digest())
        EOF
        cat > /usr/local/libexec/lal-search/serve <<'EOF'
        #!/usr/bin/python3
        """Answer queries; idle between requests."""
        import time

        while True:
            time.sleep(30)
        EOF
        chmod 0755 /usr/local/libexec/lal-search/reindex /usr/local/libexec/lal-search/serve
        for unit in indexer:reindex api:serve cache:serve; do
          name=${unit%%:*}
          program=${unit##*:}
          cat > "/etc/systemd/system/lal-search-$name.service" <<EOF
        [Unit]
        Description=Search $name

        [Service]
        User=lalsearch
        ExecStart=/usr/local/libexec/lal-search/$program
        Restart=always

        [Install]
        WantedBy=multi-user.target
        EOF
        done
        systemctl daemon-reload
        systemctl enable --now lal-search-indexer.service lal-search-api.service lal-search-cache.service
