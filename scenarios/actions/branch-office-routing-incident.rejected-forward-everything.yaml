schema_version: 1
actions:
  - action_id: fix-addressing-and-routing
    target: node2
    arguments: [sudo, --, bash, -c, "nmcli connection modify dc ipv4.addresses 172.20.0.1/24 ipv4.routes '172.21.0.0/24 172.20.0.2' && nmcli connection up dc"]
  - action_id: forward-everything-between-the-sites
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/90-router.conf
        sysctl --quiet --load /etc/sysctl.d/90-router.conf
        firewall-cmd --quiet --permanent --zone=trusted --change-interface=branch0
        firewall-cmd --quiet --permanent --zone=trusted --change-interface=dc0
        firewall-cmd --quiet --reload
