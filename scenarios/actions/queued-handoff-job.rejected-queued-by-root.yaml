schema_version: 1
actions:
  - action_id: queue-it-as-root
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        systemctl enable --now atd.service
        cd /root
        echo 'echo approved > /var/lib/handoff/ready' | at 06:00
