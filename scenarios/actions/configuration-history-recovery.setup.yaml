schema_version: 1
actions:
  - action_id: build-the-configuration-history
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d -m 0755 /etc/lal-app
        cd /etc/lal-app
        git init --quiet --initial-branch=main
        git config user.name 'Operations Team'
        git config user.email 'ops@lab.invalid'
        printf 'workers=8\nqueue=ingest\n' > app.conf
        printf '# lal-app\n\nWorker settings are reviewed before release.\n' > README
        git add app.conf README
        git commit --quiet -m 'Approve worker configuration'
        git tag approved-v1
        printf 'workers=2\nqueue=ingest\n' > app.conf
        printf '\nOn-call contact: platform-oncall@lab.invalid\n' >> README
        git commit --quiet -am 'Incident: shed load and record on-call contact'
        install -d docs
        printf 'Logs are kept for 14 days.\n' > docs/retention.md
        git add docs/retention.md
        git commit --quiet -m 'Document log retention'
        install -d -m 0755 /usr/share/lal-app
        git rev-parse HEAD > /usr/share/lal-app/published-tip
  - action_id: run-the-service-on-the-rejected-settings
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cat > /usr/local/sbin/lal-app <<'EOF'
        #!/bin/bash
        set -eu
        . /etc/lal-app/app.conf
        printf '%s\n' "$workers" > /run/lal-app/workers
        echo "lal-app started with $workers workers on queue $queue"
        exec sleep infinity
        EOF
        chmod 0755 /usr/local/sbin/lal-app
        cat > /etc/systemd/system/lal-app.service <<'EOF'
        [Unit]
        Description=lal-app worker pool

        [Service]
        ExecStart=/usr/local/sbin/lal-app
        RuntimeDirectory=lal-app
        RuntimeDirectoryPreserve=yes

        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl enable --now lal-app.service
