schema_version: 1
actions:
  - action_id: share-existing-tree-with-named-entries
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        setfacl -R -b /srv/project
        chgrp -R project /srv/project
        find /srv/project -type d -exec chmod 2770 {} +
        find /srv/project -type f -exec chmod 0660 {} +
        setfacl -R -m g:project:rwX,u:auditor:rX /srv/project
  - action_id: make-future-content-inherit-the-policy
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - find /srv/project -type d -exec setfacl -d -m g:project:rwx,u:auditor:rx,o::- {} +
