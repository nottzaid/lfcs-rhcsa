schema_version: 1
actions:
  - action_id: install-deployment-client-key
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        id deploy >/dev/null 2>&1 || useradd --create-home deploy
        install -d -o deploy -g deploy -m 0700 /home/deploy/.ssh
        cat > /home/deploy/.ssh/lal_deploy <<'EOF'
        -----BEGIN OPENSSH PRIVATE KEY-----
        b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
        QyNTUxOQAAACD9/k+S4/Md8/gwJF8MtjZ+AdTlwY8fbpL/+PX9GJpw1gAAAJhjRknUY0ZJ
        1AAAAAtzc2gtZWQyNTUxOQAAACD9/k+S4/Md8/gwJF8MtjZ+AdTlwY8fbpL/+PX9GJpw1g
        AAAECIvTeEuZuZ4aHJt+GkggofWKEOEWvyym/151itTnjE6v3+T5Lj8x3z+DAkXwy2Nn4B
        1OXBjx9ukv/49f0YmnDWAAAAEmxhbC1kZXBsb3ktZml4dHVyZQECAw==
        -----END OPENSSH PRIVATE KEY-----
        EOF
        printf 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP3+T5Lj8x3z+DAkXwy2Nn4B1OXBjx9ukv/49f0YmnDW lal-deploy-fixture\n' > /home/deploy/.ssh/lal_deploy.pub
        chown deploy:deploy /home/deploy/.ssh/lal_deploy*
        chmod 0600 /home/deploy/.ssh/lal_deploy
        chmod 0644 /home/deploy/.ssh/lal_deploy.pub
        rm -f /home/deploy/.ssh/config /home/deploy/.ssh/known_hosts
  - action_id: install-stale-ssh-server-policy
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        getent group opsssh >/dev/null || groupadd opsssh
        id deploy >/dev/null 2>&1 || useradd --create-home deploy
        gpasswd -d deploy opsssh >/dev/null 2>&1 || true
        install -d -o deploy -g deploy -m 0700 /home/deploy/.ssh
        printf 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBadKeyForInitialStateOnly rejected\n' > /home/deploy/.ssh/authorized_keys
        chown deploy:deploy /home/deploy/.ssh/authorized_keys
        chmod 0600 /home/deploy/.ssh/authorized_keys
        rm -f /etc/ssh/sshd_config.d/60-lal-policy.conf /etc/ssh/sshd_config.d/99-deployment.conf
        semanage port -d -t ssh_port_t -p tcp 2222 >/dev/null 2>&1 || true
        systemctl restart sshd
