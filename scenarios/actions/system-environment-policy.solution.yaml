schema_version: 1
actions:
  - action_id: make-the-shared-profile-idempotent
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        cat > /etc/profile.d/lal-operations.sh <<'EOF'
        export EDITOR=/usr/bin/vi
        case ":$PATH:" in
            *:/opt/lal/bin:*) ;;
            *) PATH=/opt/lal/bin:$PATH ;;
        esac
        export PATH
        EOF
  - action_id: set-the-analyst-preference
    target: node2
    arguments:
      - sudo
      - --
      - sed
      - -i
      - s/^export REPORT_FORMAT=.*/export REPORT_FORMAT=compact/
      - /home/opsanalyst/.bash_profile
