        ATAbBgNVHREEFDASghBzZXJ2aWNlLmludGVybmFsMB0GA1UdDgQWBBQ8hwb40y0R
        egzFwKYCPeN2e5TQ1jAfBgNVHSMEGDAWgBRwv7mFVDaqvmM4sdG8aAnUSv3LbTAK
        BggqhkjOPQQDAgNHADBEAiBBxh+0yF/pgvfHKNTqljIpz7qbyAqICEyqkRLigXct
        fgIgeWPPcbQwkW4uPl9mWGIsrjB+vXyWU1ADSpErYw1y7EI=
        -----END CERTIFICATE-----
        PEM
        cat > /etc/lal-pki/issuing-ca.crt <<'PEM'
        -----BEGIN CERTIFICATE-----
        MIIBzDCCAXOgAwIBAgIUbII7seDLXAWl2ueklQN+N3XNMykwCgYIKoZIzj0EAwIw
        MDEYMBYGA1UECgwPTGludXggQWRtaW4gTGFiMRQwEgYDVQQDDAtMQUwgUm9vdCBD
        QTAeFw0yNjEwMDExMDQxNDRaFw00NTExMzAxMDQxNDRaMDUxGDAWBgNVBAoMD0xp
        bnV4IEFkbWluIExhYjEZMBcGA1UEAwwQTEFMIElzc3VpbmcgQ0EgMTBZMBMGByqG
        SM49AgEGCCqGSM49AwEHA0IABD/tR6f5VNqMnVCKF+qK9vo4c+e86w8/8S9RqJQh
        bgFJ05u05uQPlxgWAgcQo7o01O/cqfychum6DKdqui6hPGWjZjBkMBIGA1UdEwEB
        /wQIMAYBAf8CAQAwDgYDVR0PAQH/BAQDAgEGMB0GA1UdDgQWBBRwv7mFVDaqvmM4
        sdG8aAnUSv3LbTAfBgNVHSMEGDAWgBQHwi6v4sDTH52oNIR00KkLW12UHTAKBggq
        hkjOPQQDAgNHADBEAiB+zOFPxayK9li6NvAucALUM3d45iss6dDTK1vlk/4PNwIg
        K9o5D6/gEHpsnkTpNnboxh3tAl+dkOf+eAs52fJCYiA=
        -----END CERTIFICATE-----
        PEM
        # The key was generated in root's home during the renewal and moved into place.
        install -d -m 0700 /root/tls-renewal
        (umask 077; cat > /root/tls-renewal/service.key <<'PEM'
        -----BEGIN PRIVATE KEY-----
        MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg3Jov/pOBzLh92oCa
        135Vxat3MKQ36xUdV2Tcat7vHyqhRANCAATPVHfoAngh0qAYBefTEj0cuMzIfDg7
        ZPxFvYYtbRbbJGFW/tZKuNh6qT8eLxb1XnY+7DUUzCASLNj00dMAuoSK
        -----END PRIVATE KEY-----
        PEM
        )
        mv /root/tls-renewal/service.key /etc/lal-pki/private/service.key
        rmdir /root/tls-renewal
        install -d /srv/lal-secure
        printf 'secure-ready\n' > /srv/lal-secure/index.html
        cat > /etc/nginx/conf.d/lal-secure.conf <<'CONF'
        server {
            listen 8443 ssl;
            server_name service.internal;
            ssl_certificate     /etc/lal-pki/service.crt;
            ssl_certificate_key /etc/lal-pki/private/service.key;
            root /srv/lal-secure;
        }
        CONF
        systemctl enable nginx.service
        systemctl restart nginx.service || true
