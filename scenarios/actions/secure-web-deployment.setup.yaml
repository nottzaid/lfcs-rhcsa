schema_version: 1
actions:
  - action_id: trust-the-company-root-on-the-client
    target: client
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname intra0 con-name intranet ipv4.method manual \
          ipv4.addresses 10.45.0.50/24 ipv6.method disabled >/dev/null
        nmcli connection up intranet >/dev/null
        echo '10.45.0.10 service.internal' >> /etc/hosts
        cat > /etc/pki/ca-trust/source/anchors/lal-root-ca.crt <<'PEM'
        -----BEGIN CERTIFICATE-----
        MIIBxTCCAWugAwIBAgIUO5I9KZ0hyYz07PbdnZdO4H/f/pkwCgYIKoZIzj0EAwIw
        MDEYMBYGA1UECgwPTGludXggQWRtaW4gTGFiMRQwEgYDVQQDDAtMQUwgUm9vdCBD
        QTAeFw0yNjEwMDExMDQxNDRaFw00NjA5MjYxMDQxNDRaMDAxGDAWBgNVBAoMD0xp
        bnV4IEFkbWluIExhYjEUMBIGA1UEAwwLTEFMIFJvb3QgQ0EwWTATBgcqhkjOPQIB
        BggqhkjOPQMBBwNCAASGS2/MmuWBy9ZwnxwtfIrHkRQimdtqYPd3qZ//7eeYs3ck
        7z9j9mB0lzSTP7yy8ajVVaUVwAn2bWe9BL/RQHBko2MwYTAdBgNVHQ4EFgQUB8Iu
        r+LA0x+dqDSEdNCpC1tdlB0wHwYDVR0jBBgwFoAUB8Iur+LA0x+dqDSEdNCpC1td
        lB0wDwYDVR0TAQH/BAUwAwEB/zAOBgNVHQ8BAf8EBAMCAQYwCgYIKoZIzj0EAwID
        SAAwRQIhAPRZ26ld4YqpQ+fO+8gczSYXM+e5CGmlj3vPF7od5VqjAiB3KaYXb2qz
        5d4UyMtbAKJxwbXlJcubbtJub+TsL+yeuw==
        -----END CERTIFICATE-----
        PEM
        update-ca-trust
        install -d /usr/share/lal-secure
        ls /etc/pki/ca-trust/source/anchors | sha256sum > /usr/share/lal-secure/anchors.sha256
  - action_id: move-the-site-to-https
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type ethernet ifname intra0 con-name intranet ipv4.method manual \
          ipv4.addresses 10.45.0.10/24 ipv6.method disabled >/dev/null
        nmcli connection up intranet >/dev/null
        install -d -m 0755 /etc/lal-pki
        install -d -m 0700 /etc/lal-pki/private
        cat > /etc/lal-pki/service.crt <<'PEM'
        -----BEGIN CERTIFICATE-----
        MIIB/zCCAaagAwIBAgIUEi58ZwzINBX6eA/RigC8/xAUkT4wCgYIKoZIzj0EAwIw
        NTEYMBYGA1UECgwPTGludXggQWRtaW4gTGFiMRkwFwYDVQQDDBBMQUwgSXNzdWlu
        ZyBDQSAxMB4XDTI2MTAwMTEwNDE0NFoXDTM2MDkyODEwNDE0NFowNTEYMBYGA1UE
        CgwPTGludXggQWRtaW4gTGFiMRkwFwYDVQQDDBBzZXJ2aWNlLmludGVybmFsMFkw
        EwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEz1R36AJ4IdKgGAXn0xI9HLjMyHw4O2T8
        Rb2GLW0W2yRhVv7WSrjYeqk/Hi8W9V52Puw1FMwgEizY9NHTALqEiqOBkzCBkDAM
