schema_version: 1
actions:
  - action_id: repair-haproxy-backend
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        sed -i 's/server retired 192\.0\.2\.99:8081 check/server node1 {{host.node1.address}}:8081 check/' /etc/haproxy/haproxy.cfg
        haproxy -c -f /etc/haproxy/haproxy.cfg
        systemctl restart haproxy.service
