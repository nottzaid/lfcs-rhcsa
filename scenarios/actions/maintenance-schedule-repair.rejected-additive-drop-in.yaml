schema_version: 1
actions:
  - action_id: add-a-nightly-schedule-without-resetting
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        sed -i 's/^RETENTION_DAYS=.*/RETENTION_DAYS=14/' /etc/sysconfig/lal-maintenance
        install -d /etc/systemd/system/lal-maintenance.timer.d
        printf '[Timer]\nOnCalendar=*-*-* 02:15:00 UTC\nPersistent=true\n' > /etc/systemd/system/lal-maintenance.timer.d/nightly.conf
        systemctl daemon-reload
        systemctl enable --now lal-maintenance.timer
        systemctl start lal-maintenance.service
