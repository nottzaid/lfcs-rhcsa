schema_version: 1
actions:
  - action_id: write-required-kernel-tuning
    target: node2
    arguments:
      - sudo
      - --
      - sh
      - -c
      - >-
        printf '%s\n' 'net.ipv4.ip_forward = 1'
        'fs.inotify.max_user_watches = 524288' > /etc/sysctl.d/90-lal-gateway.conf
  - action_id: apply-required-kernel-tuning
    target: node2
    arguments: [sudo, --, sysctl, --load, /etc/sysctl.d/90-lal-gateway.conf]
