schema_version: 1
actions:
  - action_id: create-a-disk-where-libvirt-looks
    target: node2
    arguments: [sudo, --, qemu-img, create, -f, raw, /var/lib/libvirt/images/lal-utility-data.img, 64M]
  - action_id: autostart-and-start-everything
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        virsh net-autostart appliances
        virsh net-start appliances
        virsh autostart lal-utility
        virsh start lal-utility
