schema_version: 1
actions:
  - action_id: mount-without-repair
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /srv/records
        printf 'LABEL=LAL_RECORDS /srv/records ext4 defaults 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        mount /srv/records
