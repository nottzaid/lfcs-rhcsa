schema_version: 1
actions:
  - action_id: start-the-network-now-and-at-boot
    target: node2
    arguments: [sudo, --, bash, -c, "virsh net-start appliances && virsh net-autostart appliances"]
  - action_id: point-the-guest-at-its-moved-disk
    target: node2
    arguments: [sudo, --, virt-xml, lal-utility, --edit, target=vda, --disk, path=/var/lib/libvirt/images/archive/lal-utility-data.img]
  - action_id: start-the-guest-for-now
    target: node2
    arguments: [sudo, --, virsh, start, lal-utility]
