schema_version: 1
actions:
  - action_id: replace-drifting-shared-profile
    target: node2
    arguments:
      - sudo
      - --
      - sh
      - -c
      - >-
        rm -f /etc/profile.d/lal-operations.sh &&
        printf '%s\n' 'EDITOR=/usr/bin/vi' 'export EDITOR'
        'case "$PATH" in' '    /opt/lal/bin|/opt/lal/bin:*|*:/opt/lal/bin|*:/opt/lal/bin:*) ;;'
        '    *) PATH="/opt/lal/bin:$PATH" ;;' 'esac' 'export PATH'
        > /etc/profile.d/zz-lal-operations.sh &&
        chmod 0644 /etc/profile.d/zz-lal-operations.sh
  - action_id: edit-personal-setting
    target: node2
    arguments:
      - sudo
      - --
      - sed
      - --in-place
      - s/REPORT_FORMAT=verbose/REPORT_FORMAT=compact/
      - /home/opsanalyst/.bash_profile
