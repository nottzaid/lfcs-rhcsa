schema_version: 1
actions:
  - action_id: configure-hardened-ssh-server
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        usermod -aG opsssh deploy
        printf 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP3+T5Lj8x3z+DAkXwy2Nn4B1OXBjx9ukv/49f0YmnDW lal-deploy-fixture\n' > /home/deploy/.ssh/authorized_keys
        chown deploy:deploy /home/deploy/.ssh/authorized_keys
        chmod 0600 /home/deploy/.ssh/authorized_keys
        cat > /etc/ssh/sshd_config.d/60-lal-policy.conf <<'EOF'
        Port 2222
        PermitRootLogin no
        PasswordAuthentication no
        PubkeyAuthentication yes
        AllowGroups opsssh
        EOF
        semanage port -a -t ssh_port_t -p tcp 2222
        firewall-cmd --quiet --permanent --add-port=2222/tcp
        firewall-cmd --quiet --reload
        sshd -t
        systemctl restart sshd
  - action_id: configure-deployment-client-alias
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        cat > /home/deploy/.ssh/config <<'EOF'
        Host app-node
            HostName {{host.node2.address}}
            Port 2222
            User deploy
            IdentityFile ~/.ssh/lal_deploy
            IdentitiesOnly yes
        EOF
        chown deploy:deploy /home/deploy/.ssh/config
        chmod 0600 /home/deploy/.ssh/config
