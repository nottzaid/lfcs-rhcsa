schema_version: 1
actions:
  - action_id: point-the-alias-at-the-deployment-port
    target: runner
    arguments: [sudo, -u, deploy, --, sed, -i, '/^    HostName 10.15.0.20$/a\    Port 2222', /home/deploy/.ssh/config]
  - action_id: let-sshd-bind-the-deployment-port
    target: node2
    arguments: [sudo, --, semanage, port, -a, -t, ssh_port_t, -p, tcp, "2222"]
  - action_id: open-the-deployment-port
    target: node2
    arguments: [sudo, --, bash, -c, "firewall-cmd --quiet --permanent --add-port=2222/tcp && firewall-cmd --quiet --reload"]
  - action_id: make-the-home-directory-acceptable-to-sshd
    target: node2
    arguments: [sudo, --, chmod, g-w, /home/deploy]
  - action_id: restart-sshd
    target: node2
    arguments: [sudo, --, systemctl, restart, sshd.service]
