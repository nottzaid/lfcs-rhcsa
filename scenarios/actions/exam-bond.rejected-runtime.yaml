schema_version: 1
actions:
  - action_id: bond-with-ip-link
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli device set bond1a managed no
        nmcli device set bond1b managed no
        ip link add bond0 type bond mode active-backup miimon 100
        ip link set bond1a down; ip link set bond1a master bond0
        ip link set bond1b down; ip link set bond1b master bond0
        ip link set bond0 up
        ip address add 10.68.0.20/24 dev bond0
        nmcli device set bond0 managed no || true
