schema_version: 1
actions:
  - action_id: install-the-api
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        useradd --system --home-dir /var/lib/lal-api --no-create-home --shell /sbin/nologin lalapi
        install -d -o lalapi -g lalapi -m 0750 /var/lib/lal-api
        cat > /usr/local/sbin/lal-api <<'EOF'
        #!/usr/bin/python3
        import sys
        import time

        STATE = "/var/lib/lal-api/state"
        try:
            with open(STATE, "w") as state:
                state.write("ready\n")
        except OSError as error:
            sys.exit(f"lal-api: {STATE}: {error.strerror}")
        print("lal-api: ready", flush=True)
        while True:
            time.sleep(3600)
        EOF
        chmod 0755 /usr/local/sbin/lal-api
        cat > /etc/systemd/system/lal-api.service <<'EOF'
        [Unit]
        Description=Internal API

        [Service]
        User=lalapi
        Group=lalapi
        ExecStart=/usr/local/sbin/lal-api

        [Install]
        WantedBy=multi-user.target
        EOF
  - action_id: land-the-security-hardening
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /etc/systemd/system/lal-api.service.d
        cat > /etc/systemd/system/lal-api.service.d/10-hardening.conf <<'EOF'
        # Security baseline SEC-114: required for every internal service.
        [Service]
        ProtectSystem=strict
        ProtectHome=yes
        PrivateTmp=yes
        NoNewPrivileges=yes
        EOF
        systemctl daemon-reload
        systemctl enable lal-api.service
        systemctl start lal-api.service || true
