schema_version: 1
actions:
  - action_id: install-hardened-api
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        id lalapi >/dev/null 2>&1 || useradd --system --home-dir /var/lib/lal-api --shell /sbin/nologin lalapi
        install -d -o lalapi -g lalapi -m 0750 /var/lib/lal-api
        rm -f /var/lib/lal-api/state
        cat > /usr/local/sbin/lal-api <<'EOF'
        #!/bin/bash
        set -eu
        printf 'ready\n' > /var/lib/lal-api/state
        exec sleep infinity
        EOF
        chmod 0755 /usr/local/sbin/lal-api
        cat > /etc/systemd/system/lal-api.service <<'EOF'
        [Unit]
        Description=Hardened training API

        [Service]
        User=lalapi
        Group=lalapi
        ExecStart=/usr/local/sbin/lal-api
        ProtectSystem=strict
        ProtectHome=yes

        [Install]
        WantedBy=multi-user.target
        EOF
        rm -rf /etc/systemd/system/lal-api.service.d
        systemctl daemon-reload
        systemctl enable lal-api.service
        systemctl start lal-api.service || true
