schema_version: 1
actions:
  - action_id: constrain-the-indexer-in-a-drop-in
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        install -d /etc/systemd/system/lal-search-indexer.service.d
        printf '[Service]\nCPUQuota=25%%\nNice=10\n' > /etc/systemd/system/lal-search-indexer.service.d/limits.conf
        systemctl daemon-reload
        systemctl restart lal-search-indexer.service
