schema_version: 1
actions:
  - action_id: create-then-activate-by-uuid
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        mkswap /dev/disk/by-id/virtio-lal-swap
        swaplabel --label LAL_SWAP /dev/disk/by-id/virtio-lal-swap
        uuid=$(blkid -s UUID -o value /dev/disk/by-id/virtio-lal-swap)
        printf 'UUID=%s\tnone\tswap\tpri=50\t0 0\n' "$uuid" >> /etc/fstab
        swapon --priority 50 "UUID=$uuid"
