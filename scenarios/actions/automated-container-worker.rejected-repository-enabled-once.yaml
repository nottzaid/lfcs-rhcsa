schema_version: 1
actions:
  - action_id: install-with-the-repository-enabled-for-one-command
    target: node2
    timeout_seconds: 120
    arguments: [sudo, --, dnf, -y, -q, --enablerepo=lal-worker, install, lal-worker-assets]
  - action_id: restore-configure-and-schedule
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cd /etc/lal-automation
        git restore --source=approved-worker worker.conf
        git commit --quiet -am 'Restore the approved worker configuration'
        systemctl restart lal-automation.service
        sed -i 's/^OnCalendar=hourly$/OnCalendar=*:0\/15\nPersistent=true/' /etc/systemd/system/lal-automation-refresh.timer
        systemctl daemon-reload
        systemctl enable --now lal-automation-refresh.timer
        systemctl start lal-automation-refresh.service
