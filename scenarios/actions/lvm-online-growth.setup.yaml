schema_version: 1
actions:
  - action_id: build-small-lvm-filesystem
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        disk=/dev/disk/by-id/virtio-lal-data
        umount /srv/logs >/dev/null 2>&1 || true
        vgremove -ff -y vgdata >/dev/null 2>&1 || true
        wipefs -a "$disk"
        pvcreate -ff -y "$disk"
        vgcreate vgdata "$disk"
        lvcreate -L 256M -n lvlogs vgdata
        mkfs.ext4 -q -L lal-logs /dev/vgdata/lvlogs
        install -d /srv/logs
        sed -i '\#/srv/logs#d' /etc/fstab
        printf '/dev/mapper/vgdata-lvlogs /srv/logs ext4 defaults 0 2\n' >> /etc/fstab
        mount /srv/logs
        printf 'preserve this record\n' > /srv/logs/retain.log
