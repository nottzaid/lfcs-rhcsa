schema_version: 1
actions:
  - action_id: build-a-full-volume-group
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        disk=/dev/disk/by-id/virtio-lal-data
        wipefs --all --quiet "$disk" /dev/disk/by-id/virtio-lal-spare
        pvcreate --quiet "$disk"
        vgcreate --quiet vgdata "$disk"
        lvcreate --quiet --yes --extents 100%FREE --name lvlogs vgdata
        mkfs.ext4 -q -L LAL_LOGS /dev/vgdata/lvlogs
        install -d /srv/logs
        printf '/dev/mapper/vgdata-lvlogs /srv/logs ext4 defaults 0 2\n' >> /etc/fstab
        systemctl daemon-reload
        mount /srv/logs
  - action_id: fill-the-logs-to-96-percent
    target: node2
    timeout_seconds: 120
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cd /srv/logs
        number=0
        while (( $(df --output=pcent /srv/logs | tail -n 1 | tr -dc 0-9) < 96 )); do
          number=$((number + 1))
          head -c 8M < <(yes "2026-09-30T02:$(printf %02d $((number % 60))):00Z shipper batch $number accepted") \
            > "shipper-$number.log"
        done
        install -d -m 0755 /usr/share/lal-logs
        sha256sum *.log > /usr/share/lal-logs/logs.sha256
        findmnt -n -o ID --mountpoint /srv/logs > /usr/share/lal-logs/mount-id
        cat /proc/sys/kernel/random/boot_id > /usr/share/lal-logs/boot-id
