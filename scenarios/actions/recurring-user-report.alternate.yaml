schema_version: 1
actions:
  - action_id: explicit-zone-full-path-and-day-names
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        printf '%s\n' '# Finance usage report' 'CRON_TZ=UTC' 'MAILTO=root' \
          '40 06 * * mon-fri /opt/lal/bin/generate-usage-report --format compact' |
          crontab -u reportbot -
