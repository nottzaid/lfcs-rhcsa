schema_version: 1
actions:
  - action_id: give-node2-its-own-ipv6-address
    target: node2
    arguments: [sudo, --, nmcli, connection, modify, lab, ipv6.addresses, fd00:30::12/64]
  - action_id: activate-the-profile
    target: node2
    arguments: [sudo, --, nmcli, connection, up, lab]
  - action_id: set-node2-hostname
    target: node2
    arguments: [sudo, --, hostnamectl, set-hostname, node2.lab.internal]
  - action_id: drop-db-loopback-line
    target: node2
    arguments: [sudo, --, sed, -i, '/^127\.0\.1\.1[[:space:]]\+db\.lab\.internal/d', /etc/hosts]
