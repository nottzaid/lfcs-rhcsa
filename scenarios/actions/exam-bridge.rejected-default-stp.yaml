schema_version: 1
actions:
  - action_id: bridge-and-port
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        nmcli connection add type bridge ifname br0 con-name br0 ipv4.method manual \
          ipv4.addresses 10.75.0.20/24 ipv6.method disabled >/dev/null
        nmcli connection add type ethernet ifname lan1 con-name br0-port controller br0 port-type bridge >/dev/null
        nmcli connection delete lan1 >/dev/null
        nmcli connection up br0 >/dev/null
        nmcli connection up br0-port >/dev/null
