schema_version: 1
actions:
  - action_id: configure-direct-project-map
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf '/shares /etc/auto.lal --timeout=45\n' > /etc/auto.master.d/lal.autofs;
        printf 'projects -ro,fstype=nfs4 {{host.node1.address}}:/srv/projects\n' > /etc/auto.lal;
        systemctl enable --now autofs.service;
        systemctl restart autofs.service
