schema_version: 1
actions:
  - action_id: replace-with-a-direct-map
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        rm /etc/auto.master.d/projects.autofs /etc/auto.projects
        printf '/-  /etc/auto.direct  --timeout=120\n' > /etc/auto.master.d/direct.autofs
        printf '/shares/projects  -fstype=nfs4,ro,soft  {{host.node1.address}}:/srv/projects\n' > /etc/auto.direct
        systemctl enable autofs.service
        systemctl restart autofs.service
