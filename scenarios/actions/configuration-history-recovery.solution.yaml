schema_version: 1
actions:
  - action_id: restore-only-the-approved-file
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cd /etc/lal-app
        git restore --source=approved-v1 -- app.conf
        git commit --quiet -m 'Restore approved worker settings' app.conf
        systemctl restart lal-app.service
