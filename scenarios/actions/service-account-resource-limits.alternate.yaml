schema_version: 1
actions:
  - action_id: replace-stale-policy
    target: node2
    arguments: [sudo, --, rm, -f, /etc/security/limits.d/90-lal-batch.conf]
  - action_id: configure-file-limits
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf '%s\n' 'batchsvc - nofile 8192' 'batchsvc soft nofile 4096'
        > /etc/security/limits.d/91-lal-batch-files.conf
  - action_id: configure-process-limits
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - >-
        printf '%s\n' 'batchsvc hard nproc 1024' 'batchsvc soft nproc 512'
        > /etc/security/limits.d/92-lal-batch-processes.conf
