schema_version: 1
actions:
  - action_id: replace-the-stale-policy-with-a-group-scoped-one
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        rm /etc/security/limits.d/90-lal-batch.conf
        cat > /etc/security/limits.d/60-batch-jobs.conf <<'EOF'
        # Sized for the partition job.
        @batchsvc   soft   nofile   4096
        @batchsvc   hard   nofile   8192
        @batchsvc   soft   nproc    512
        @batchsvc   hard   nproc    1024
        EOF
  - action_id: override-the-whole-unit-in-etc
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        cp /usr/lib/systemd/system/lal-batch.service /etc/systemd/system/lal-batch.service
        sed -i '/^\[Service\]/a LimitNOFILE=4096:8192' /etc/systemd/system/lal-batch.service
        systemctl daemon-reload
