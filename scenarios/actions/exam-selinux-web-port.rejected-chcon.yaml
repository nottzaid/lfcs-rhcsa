schema_version: 1
actions:
  - action_id: label-port-and-chcon-the-content
    target: node2
    timeout_seconds: 180
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        semanage port -a -t http_port_t -p tcp 8282
        chcon -R -t httpd_sys_content_t /srv/site
        systemctl restart nginx.service
