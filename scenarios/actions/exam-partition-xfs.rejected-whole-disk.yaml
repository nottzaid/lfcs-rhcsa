schema_version: 1
actions:
  - action_id: filesystem-on-the-whole-disk
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        mkfs.xfs -q -f -L LOGS /dev/disk/by-id/virtio-lal-logs
        install -d /var/log/app
        printf 'LABEL=LOGS /var/log/app xfs noatime,nodev 0 0\n' >> /etc/fstab
        systemctl daemon-reload
        mount /var/log/app
