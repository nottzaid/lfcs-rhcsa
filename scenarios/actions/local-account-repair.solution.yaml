schema_version: 1
actions:
  - action_id: renumber-group-and-account
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        groupmod -g 4200 releaseops
        usermod -u 4201 -g releaseops -d /srv/deploysvc -m -s /bin/bash deploysvc
  - action_id: reclaim-files-left-on-the-old-ids
    target: node1
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        find /srv -xdev -uid 4301 -exec chown -h deploysvc {} +
        find /srv -xdev -gid 4300 -exec chgrp -h releaseops {} +
        chmod 0750 /srv/deploysvc
