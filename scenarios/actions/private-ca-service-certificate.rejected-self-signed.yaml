schema_version: 1
actions:
  - action_id: self-sign-a-certificate-with-the-right-names
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        openssl req -x509 -newkey rsa:2048 -nodes -days 397 -subj /CN=api.internal \
          -addext 'subjectAltName=DNS:api.internal,IP:127.0.0.1' \
          -keyout /etc/lal-pki/private/api.key -out /etc/lal-pki/api.crt
        chmod 0600 /etc/lal-pki/private/api.key
        chmod 0644 /etc/lal-pki/api.crt
        systemctl reload nginx.service
