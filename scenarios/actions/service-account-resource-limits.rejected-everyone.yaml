schema_version: 1
actions:
  - action_id: raise-limits-for-every-account
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        rm /etc/security/limits.d/90-lal-batch.conf
        printf '%s\n' '* soft nofile 4096' '* hard nofile 8192' '* soft nproc 512' '* hard nproc 1024' \
          >> /etc/security/limits.conf
        install -d /etc/systemd/system/lal-batch.service.d
        printf '[Service]\nLimitNOFILE=4096:8192\n' > /etc/systemd/system/lal-batch.service.d/override.conf
        systemctl daemon-reload
