schema_version: 1
actions:
  - action_id: reclaim-and-extend-storage
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        rm -f /srv/lal-catalog/archive.fill
        lvextend -L 1G /dev/vgapps/lvcatalog
        resize2fs /dev/vgapps/lvcatalog
  - action_id: write-uuid-policy-and-recover-service
    target: node2
    arguments:
      - sudo
      - --
      - bash
      - -c
      - |
        uuid=$(findmnt -n -o UUID /srv/lal-catalog)
        sed -i '\#/srv/lal-catalog#d' /etc/fstab
        printf 'UUID=%s /srv/lal-catalog ext4 defaults 0 2\n' "$uuid" >> /etc/fstab
        systemctl enable lal-catalog.service
        systemctl restart lal-catalog.service
