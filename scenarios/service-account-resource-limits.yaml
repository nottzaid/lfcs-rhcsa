schema_version: 1
scenario_id: service-account-resource-limits
version: 1
status: verified
title: The batch account can exhaust the host
summary: Apply persistent per-user process and file-descriptor limits.
estimated_minutes: 25
task_type: configure
difficulty: foundation
task: >-
  Configure persistent PAM resource limits for batchsvc on node2. New login sessions for
  batchsvc must have a soft open-file limit of 4096 and hard limit of 8192, plus a soft
  process limit of 512 and hard limit of 1024. Put policy under /etc/security/limits.d;
  do not weaken limits for any other user or change the system-wide defaults.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: users-groups.resource-limits
    title: Configure user resource limits
sources:
  - kind: scope
    title: Linux Foundation LFCS competencies
    url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  - kind: upstream
    title: Linux-PAM pam_limits documentation
    url: https://github.com/linux-pam/linux-pam/blob/master/modules/pam_limits/pam_limits.8.xml
  - kind: man-page
    title: limits.conf manual
    man_page: limits.conf(5)
  - kind: man-page
    title: pam_limits manual
    man_page: pam_limits(8)
topology:
  hosts:
    - name: node2
      image: rocky-10.2-lab-v1
      memory_mib: 1024
      vcpus: 1
checks:
  - check_id: open-file-limits
    kind: command
    target: node2
    description: A fresh batchsvc session receives the required file-descriptor limits.
    parameters:
      sudo: true
      arguments:
        - runuser
        - --login
        - batchsvc
        - --shell
        - /bin/bash
        - --command
        - test "$(ulimit -Sn)" -eq 4096 && test "$(ulimit -Hn)" -eq 8192
  - check_id: process-limits
    kind: command
    target: node2
    description: A fresh batchsvc session receives the required process limits.
    parameters:
      sudo: true
      arguments:
        - runuser
        - --login
        - batchsvc
        - --shell
        - /bin/bash
        - --command
        - test "$(ulimit -Su)" -eq 512 && test "$(ulimit -Hu)" -eq 1024
  - check_id: policy-is-scoped
    kind: command
    target: node2
    description: The lab policy does not use a wildcard or global domain.
    parameters:
      sudo: true
      arguments:
        - bash
        - -c
        - >-
          files=$(grep -RslE '^[[:space:]]*batchsvc[[:space:]]' /etc/security/limits.d) &&
          test -n "$files" &&
          ! grep -hEv '^[[:space:]]*(#|$|batchsvc[[:space:]])' $files | grep -q .
persistence:
  reboot: false
setup: actions/service-account-resource-limits.setup.yaml
reference_solution: actions/service-account-resource-limits.solution.yaml
alternate_solutions: [actions/service-account-resource-limits.alternate.yaml]
