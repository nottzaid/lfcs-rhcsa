schema_version: 1
scenario_id: service-account-resource-limits
version: 2
status: verified
title: The batch job runs out of file descriptors
summary: A batch job fails with "Too many open files", both when operators run it and when systemd does.
estimated_minutes: 25
task_type: fix
difficulty: intermediate
task: |
  The partition job `/usr/local/bin/lal-batch` on **node2** runs as the `batchsvc`
  account. Operators start it by hand from a `batchsvc` login shell, and the scheduler starts
  the same job as `lal-batch.service`. Both runs die the same way:

  ```text
  lal-batch: opened 1021 of 3000 partitions: Too many open files
  ```

  Give `batchsvc` the limits the job was sized for, in both places it runs, without
  loosening limits for anyone else.
requirements:
  - "A new `batchsvc` login session gets a soft open-file limit of `4096` and a hard limit of `8192`, plus a soft process limit of `512` and a hard limit of `1024`."
  - "`lal-batch` succeeds when run from a `batchsvc` login shell."
  - "`lal-batch.service` runs the job successfully with a soft open-file limit of `4096` and a hard limit of `8192`."
  - "Other accounts keep the system's default limits."
  - "The packaged unit file `/usr/lib/systemd/system/lal-batch.service` is left unmodified."
hints:
  - "Compare what each context really gets: `sudo -iu batchsvc ulimit -a` for a login shell, and `systemctl show lal-batch -p LimitNOFILE -p LimitNOFILESoft` for the service. Something already sets limits for `batchsvc`; `grep -r batchsvc /etc/security` finds it."
  - "`/etc/security/limits.conf` and `limits.d/` are read by `pam_limits`, which runs during PAM logins. systemd starts services without PAM, so those files never apply to them."
  - "A service's limits come from its unit: `LimitNOFILE=soft:hard` in `systemd.exec(5)`. `systemctl edit lal-batch` creates a drop-in that overrides the packaged unit without editing it."
debrief: |
  ## What was wrong

  `/etc/security/limits.d/90-lal-batch.conf` capped `batchsvc` at 1024 soft and 2048 hard
  open files, and 128/256 processes, so the interactive run failed at file descriptor 1021
  (three are already open for stdin, stdout, and stderr). The service failed too, but for a
  different reason: systemd never reads `limits.d`. A service gets systemd's defaults (1024
  soft on Rocky Linux 10) unless its unit says otherwise.

  ## A clean fix

  ```bash
  sudo tee /etc/security/limits.d/90-lal-batch.conf <<'EOF'
  batchsvc soft nofile 4096
  batchsvc hard nofile 8192
  batchsvc soft nproc  512
  batchsvc hard nproc  1024
  EOF
  sudo systemctl edit lal-batch.service   # add under [Service]: LimitNOFILE=4096:8192
  sudo systemctl start lal-batch.service
  ```

  `systemctl edit` writes `/etc/systemd/system/lal-batch.service.d/override.conf` and
  reloads systemd. Drop-ins survive package updates that replace the vendor unit in
  `/usr/lib/systemd/system`.

  ## Check it yourself

  ```bash
  sudo -iu batchsvc bash -c 'ulimit -Sn; ulimit -Hn; ulimit -Su; ulimit -Hu'
  sudo -iu batchsvc /usr/local/bin/lal-batch
  systemctl show lal-batch -p LimitNOFILESoft -p LimitNOFILE
  sudo systemctl start lal-batch && systemctl show lal-batch -p Result
  ```

  Limits apply to new sessions only. A shell that was already open keeps its old limits,
  which is why testing from a fresh login matters.

  ## Tempting but wrong

  - **`* soft nofile 4096` in `limits.conf`.** The job works, but every account's limits
    change. Scope limits to the account (`batchsvc`) or its group (`@batchsvc`).
  - **Fixing only `limits.d`.** The interactive run works and the scheduled run keeps
    failing, because services do not go through PAM.
  - **Editing `/usr/lib/systemd/system/lal-batch.service` directly.** It works until the next
    package update silently reverts it.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: users-groups.resource-limits
    title: Configure user resource limits
sources:
  - kind: scope
    title: Linux Foundation LFCS competencies
    url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  - kind: man-page
    title: Per-account limits read by pam_limits
    man_page: limits.conf(5)
  - kind: man-page
    title: The PAM module that applies them at login
    man_page: pam_limits(8)
  - kind: man-page
    title: LimitNOFILE= and other service limits
    man_page: systemd.exec(5)
  - kind: man-page
    title: Drop-in overrides with systemctl edit
    man_page: systemctl(1)
topology:
  hosts:
    - name: node2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
checks:
  - check_id: login-session-limits
    kind: command
    target: node2
    description: A new batchsvc login session gets nofile 4096/8192 and nproc 512/1024.
    parameters:
      sudo: true
      script: |
        read -r soft_files hard_files soft_procs hard_procs < <(
          runuser -l batchsvc -c 'echo $(ulimit -Sn) $(ulimit -Hn) $(ulimit -Su) $(ulimit -Hu)')
        expect_eq "$soft_files" 4096 "the soft open-file limit"
        expect_eq "$hard_files" 8192 "the hard open-file limit"
        expect_eq "$soft_procs" 512 "the soft process limit"
        expect_eq "$hard_procs" 1024 "the hard process limit"
  - check_id: interactive-job-succeeds
    kind: command
    target: node2
    description: lal-batch succeeds from a batchsvc login shell.
    parameters:
      sudo: true
      arguments: [runuser, -l, batchsvc, -c, /usr/local/bin/lal-batch]
  - check_id: scheduled-job-succeeds
    kind: command
    target: node2
    description: lal-batch.service runs the job with nofile 4096/8192.
    parameters:
      sudo: true
      timeout_seconds: 30
      script: |
        expect_eq "$(unit_value lal-batch.service LimitNOFILESoft)" 4096 "the service's soft open-file limit"
        expect_eq "$(unit_value lal-batch.service LimitNOFILE)" 8192 "the service's hard open-file limit"
        if ! systemctl start lal-batch.service; then
          fail "lal-batch.service failed: $(journalctl -u lal-batch.service -n 1 -o cat --no-pager)"
        fi
  - check_id: other-accounts-unchanged
    kind: command
    target: node2
    description: Other accounts keep the system's default limits.
    parameters:
      sudo: true
      script: |
        read -r soft_files hard_files soft_procs < <(
          runuser -l opsuser -c 'echo $(ulimit -Sn) $(ulimit -Hn) $(ulimit -Su)')
        expect_eq "$soft_files" 1024 "opsuser's soft open-file limit"
        expect_eq "$hard_files" 524288 "opsuser's hard open-file limit"
        expect_eq "$soft_procs" "$(systemctl show --property=DefaultLimitNPROCSoft --value)" "opsuser's soft process limit"
  - check_id: packaged-unit-untouched
    kind: command
    target: node2
    description: The packaged unit file is unmodified.
    parameters:
      script: |
        sha256sum --check --status /usr/share/lal-batch/lal-batch.service.sha256 ||
          fail "/usr/lib/systemd/system/lal-batch.service was edited; use a drop-in instead"
persistence:
  reboot: false
setup: actions/service-account-resource-limits.setup.yaml
reference_solution: actions/service-account-resource-limits.solution.yaml
alternate_solutions: [actions/service-account-resource-limits.alternate.yaml]
rejected_solutions:
  - actions/service-account-resource-limits.rejected-everyone.yaml
  - actions/service-account-resource-limits.rejected-pam-only.yaml
