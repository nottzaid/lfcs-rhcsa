schema_version: 1
scenario_id: storage-backed-application-recovery
version: 2
status: verified
title: The catalog is down and its disk is full
summary: A service died when its volume filled up; free space by policy, grow the volume, and make the fix survive a reboot.
estimated_minutes: 50
task_type: troubleshoot
difficulty: exam
task: |
  `lal-catalog.service` on **node2** stopped last night and keeps failing to start. It
  serves the customer catalog from `/srv/lal-catalog`, which is its own LVM volume,
  `vgapps/lvcatalog`. The nightly export job also writes its CSV files there, under
  `exports/`, and the retention policy for them is in `/etc/lal-catalog.conf`.

  Capacity ticket CAP-77 already approved growing the catalog volume to 1024 MiB.

  Get the catalog serving again (`curl http://127.0.0.1:8090/` on node2) without losing
  customer data or any export the policy says to keep, and make sure the next reboot does
  not take it down again.
requirements:
  - "`lal-catalog.service` runs, starts at boot, and `http://127.0.0.1:8090/` reports all 1042 customers."
  - "The customer data is unchanged."
  - "The exports inside the retention period are kept untouched; older ones are gone."
  - "`vgapps/lvcatalog` is 1024 MiB, its filesystem uses all of it, and it is still the original filesystem."
  - "`/etc/fstab` mounts the volume at `/srv/lal-catalog`, and all of this still holds after node2 reboots."
hints:
  - "Start with the service's own words: `systemctl status lal-catalog` and `journalctl -u lal-catalog`. Then `df -h` and `du -sh /srv/lal-catalog/*` show where the space went."
  - "Read the retention policy before deleting anything, and compare it with the dates in the export names. `vgs` shows whether the volume group has room to grow."
  - "Growing a logical volume does not grow the filesystem on it: `lvextend --resizefs` does both, and ext4 grows while mounted. Then check how the volume gets mounted: `findmnt /srv/lal-catalog` and `/etc/fstab`."
debrief: |
  ## What was wrong

  The catalog records every start in its SQLite database, and the volume was completely
  full, so SQLite could not write its journal:

  ```text
  lal-catalog: cannot write to the catalog: database or disk is full
  ```

  A month of nightly exports, 16 MiB each, had filled the 512 MiB volume; the retention
  policy keeps only the last seven days. And behind that sat a second problem: the volume
  had been mounted by hand after a disk replacement and was missing from `/etc/fstab`. At
  the next boot, `/srv/lal-catalog` would have been an empty directory on the root
  filesystem, and the service would have failed with `no such database`.

  ## A clean fix

  ```bash
  cd /srv/lal-catalog/exports
  ls catalog-*.csv | sort | head -n -7 | sudo xargs rm --     # keep the newest seven days
  sudo lvextend --resizefs --size 1024M vgapps/lvcatalog
  echo "UUID=$(sudo blkid -s UUID -o value /dev/vgapps/lvcatalog) /srv/lal-catalog ext4 defaults 0 2" |
    sudo tee -a /etc/fstab
  sudo systemctl daemon-reload
  sudo systemctl restart lal-catalog
  ```

  - Deleting by the date in the name follows the policy exactly. `find -mtime +6` measures
    24-hour periods from now, so depending on the time of day it keeps one file too many.
  - `--resizefs` runs `resize2fs` after growing the volume; `lvextend` alone leaves the
    filesystem at its old size.
  - `LABEL=LAL_CATALOG` or `/dev/vgapps/lvcatalog` are as stable as the UUID; `/dev/vdb`
    names would not be.
  - The service has `Restart=on-failure`, so once space is free it recovers by itself
    within seconds; restarting it is still the clean way to confirm.

  ## Check it yourself

  ```bash
  curl http://127.0.0.1:8090/
  sudo lvs vgapps; df -h /srv/lal-catalog
  findmnt --verify
  ls /srv/lal-catalog/exports
  ```

  ## Tempting but wrong

  - **Deleting every export.** The service comes back, and a week of exports that policy
    says to keep is gone.
  - **`lvextend` without `--resizefs`.** The volume is 1 GiB, and the filesystem, and the
    free space, stay exactly as before.
  - **Leaving the mount as it is.** Everything works until the next reboot.
