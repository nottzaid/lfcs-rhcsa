topology:
  hosts:
    - name: node2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      disks:
        - {name: appdata, size_mib: 2048, role: catalog data disk}
checks:
  - check_id: catalog-serving
    kind: command
    target: node2
    description: lal-catalog.service runs, starts at boot, and reports 1042 customers.
    parameters:
      timeout_seconds: 30
      script: |
        systemctl is-enabled --quiet lal-catalog.service || fail "lal-catalog.service does not start at boot"
        serving() { systemctl is-active --quiet lal-catalog.service; }
        retry 10 serving ||
          fail "lal-catalog is not running: $(journalctl -u lal-catalog.service -o cat --no-pager | grep '^lal-catalog:' | tail -n 1)"
        answer=$(curl --silent --max-time 5 --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/ 2>/dev/null)
        expect_eq "$answer" "catalog: 1042 customers" "the catalog's answer"
  - check_id: customers-unchanged
    kind: command
    target: node2
    description: The customer data is unchanged.
    parameters:
      sudo: true
      script: |
        [[ -f /srv/lal-catalog/customer.db ]] || fail "/srv/lal-catalog/customer.db is missing"
        digest=$(python3 -c 'import hashlib, sqlite3; rows = sqlite3.connect("file:/srv/lal-catalog/customer.db?mode=ro", uri=True).execute("SELECT * FROM customers ORDER BY id").fetchall(); print(hashlib.sha256(repr(rows).encode()).hexdigest())' 2>&1) ||
          fail "the customer database cannot be read: ${digest##*: }"
        expect_eq "$digest" "$(cat /usr/share/lal-catalog/customers.sha256)" "the checksum of the customer rows"
  - check_id: exports-per-policy
    kind: command
    target: node2
    description: Exports inside the retention period are untouched, and older ones are gone.
    parameters:
      sudo: true
      script: |
        cd /srv/lal-catalog/exports 2>/dev/null || fail "/srv/lal-catalog/exports is missing"
        damaged=$(sha256sum --check --quiet /usr/share/lal-catalog/retained-exports.sha256 2>/dev/null | sed -n 's/: FAILED.*//p')
        [[ -z $damaged ]] || fail "$(wc -l <<<"$damaged") exports inside the retention period are missing or changed: $(paste -sd' ' - <<<"$damaged")"
        extra=$(comm -23 <(ls catalog-*.csv 2>/dev/null | sort) <(awk '{print $2}' /usr/share/lal-catalog/retained-exports.sha256 | sort))
        [[ -z $extra ]] ||
          fail "$(wc -l <<<"$extra") exports past the retention period are still there ($(head -n 1 <<<"$extra") to $(tail -n 1 <<<"$extra"))"
  - check_id: volume-grown
    kind: command
    target: node2
    description: vgapps/lvcatalog is 1024 MiB, fully used by the original filesystem.
    parameters:
      sudo: true
      script: |
        volume=$(lvs --noheadings --units b --nosuffix -o lv_size vgapps/lvcatalog 2>/dev/null | tr -d ' ')
        [[ -n $volume ]] || fail "there is no logical volume vgapps/lvcatalog"
        expect_eq "$((volume / 1048576)) MiB" "1024 MiB" "the size of vgapps/lvcatalog"
        expect_eq "$(blkid -s UUID -o value /dev/vgapps/lvcatalog)" "$(cat /usr/share/lal-catalog/filesystem-uuid)" "the filesystem UUID"
        header=$(dumpe2fs -h /dev/vgapps/lvcatalog 2>/dev/null)
        blocks=$(sed -n 's/^Block count: *//p' <<<"$header"); size=$(sed -n 's/^Block size: *//p' <<<"$header")
        filesystem=$((blocks * size / 1048576))
        (( filesystem == 1024 )) || fail "the filesystem uses $filesystem MiB of the 1024 MiB volume"
  - check_id: mounted-at-boot
    kind: command
    target: node2
    description: /etc/fstab mounts the volume at /srv/lal-catalog, and it is mounted there.
    parameters:
      script: |
        volume=$(readlink -f /dev/vgapps/lvcatalog)
        [[ $(readlink -f "$(findmnt -n -o SOURCE --mountpoint /srv/lal-catalog)") == "$volume" ]] ||
          fail "vgapps/lvcatalog is not mounted at /srv/lal-catalog"
        configured=$(findmnt --fstab --evaluate -n -o SOURCE --mountpoint /srv/lal-catalog 2>/dev/null | tail -n 1)
        [[ -n $configured ]] || fail "/etc/fstab has no entry for /srv/lal-catalog"
        [[ $(readlink -f "$configured") == "$volume" ]] || fail "/etc/fstab mounts $configured at /srv/lal-catalog, not vgapps/lvcatalog"
persistence:
  reboot: true
  hosts: [node2]
setup: actions/storage-backed-application-recovery.setup.yaml
reference_solution: actions/storage-backed-application-recovery.solution.yaml
alternate_solutions: [actions/storage-backed-application-recovery.alternate.yaml]
