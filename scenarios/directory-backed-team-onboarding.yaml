topology:
  networks:
    - {name: corp, cidr: 10.65.0.0/24}
  hosts:
    - name: node1
      image: rocky-10.2-lab-v2
      memory_mib: 1536
      vcpus: 2
      nics: [{network: corp, name: corp0}]
    - name: node2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: corp, name: corp0}]
checks:
  - check_id: directory-identities
    kind: command
    target: node2
    description: ldapdev and ldapops come from the directory with their directory IDs.
    parameters:
      timeout_seconds: 30
      script: |
        local_copy=$(getent -s files passwd ldapdev)
        [[ -z $local_copy ]] || fail "ldapdev is a local account in /etc/passwd (UID $(cut -d: -f3 <<<"$local_copy")), shadowing the directory"
        [[ -z $(getent -s files group ldapops) ]] || fail "ldapops is a local group, shadowing the directory"
        expect_eq "$(getent passwd ldapdev | cut -d: -f3)" 2300 "ldapdev's UID"
        expect_eq "$(id -gn ldapdev 2>/dev/null)" ldapops "ldapdev's primary group"
        expect_eq "$(getent group ldapops | cut -d: -f3)" 2300 "ldapops's GID"
  - check_id: local-teamlead
    kind: command
    target: node2
    description: teamlead is local, UID 3100, primary group platform.
    parameters:
      script: |
        [[ -n $(getent -s files passwd teamlead) ]] || fail "teamlead is not a local account"
        expect_eq "$(id -u teamlead)" 3100 "teamlead's UID"
        expect_eq "$(id -gn teamlead)" platform "teamlead's primary group"
  - check_id: shared-tree
    kind: command
    target: node2
    description: Both groups share /srv/platform, for new files too; others cannot list it.
    parameters:
      sudo: true
      timeout_seconds: 30
      script: |
        as() { runuser -u "$1" -- bash -c "$2" 2>/dev/null; }
        trap 'rm -f /srv/platform/.check-teamlead /srv/platform/.check-ldapdev' EXIT
        as teamlead 'echo plan >> /srv/platform/plan' || fail "teamlead cannot write /srv/platform/plan"
        as ldapdev 'echo plan >> /srv/platform/plan' || fail "ldapdev cannot write /srv/platform/plan"
        as teamlead 'umask 022; echo a > /srv/platform/.check-teamlead' || fail "teamlead cannot create files in /srv/platform"
        as ldapdev 'echo b >> /srv/platform/.check-teamlead' || fail "ldapdev cannot write a file teamlead created"
        as ldapdev 'umask 022; echo c > /srv/platform/.check-ldapdev' || fail "ldapdev cannot create files in /srv/platform"
        as teamlead 'echo d >> /srv/platform/.check-ldapdev' || fail "teamlead cannot write a file ldapdev created"
        ! as nobody 'ls /srv/platform' >/dev/null || fail "users outside both teams can list /srv/platform"
        ! as nobody 'cat /srv/platform/plan' >/dev/null || fail "users outside both teams can read /srv/platform/plan"
  - check_id: login-environment
    kind: command
    target: node2
    description: Login shells of both members get TEAM_REGION=amman and 4096 open files.
    parameters:
      sudo: true
      timeout_seconds: 30
      script: |
        for member in teamlead ldapdev; do
          read -r region files <<<"$(runuser -l "$member" -c 'printf "%s %s\n" "${TEAM_REGION:-unset}" "$(ulimit -Sn)"' 2>/dev/null | tail -n 1)"
          expect_eq "$region" amman "TEAM_REGION in $member's login shell"
          expect_eq "$files" 4096 "the soft open-files limit in $member's login shell"
        done
  - check_id: teamlead-ssh
    kind: command
    target: node1
    description: From node1, teamlead logs in to node2 with their key.
    parameters:
      sudo: true
      timeout_seconds: 30
      script: |
        errors=$(mktemp)
        output=$(runuser -u teamlead -- ssh -i /home/teamlead/.ssh/lal_teamlead -o BatchMode=yes -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=5 teamlead@10.65.0.20 id -un 2>"$errors") ||
          fail "teamlead's key login fails: $(tr -d '\r' <"$errors" | tail -n 1)"
        expect_eq "$output" teamlead "the user the key logs in as"
  - check_id: identity-service
    kind: service
    target: node2
    description: SSSD runs and starts at boot.
    parameters: {name: sssd.service, active: true, enabled: true}
persistence:
  reboot: true
  hosts: [node2]
setup: actions/directory-backed-team-onboarding.setup.yaml
reference_solution: actions/directory-backed-team-onboarding.solution.yaml
alternate_solutions: [actions/directory-backed-team-onboarding.alternate.yaml]
rejected_solutions:
  - actions/directory-backed-team-onboarding.rejected-renumber-the-local-copy.yaml
  - actions/directory-backed-team-onboarding.rejected-open-to-everyone.yaml
