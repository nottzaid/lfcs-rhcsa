schema_version: 1
scenario_id: directory-backed-team-onboarding
version: 2
status: verified
title: The platform team's first day on the new host
summary: A half-finished onboarding leaves a mixed local and directory team without identities, shared files, settings, or logins.
estimated_minutes: 60
task_type: troubleshoot
difficulty: exam
task: |
  The platform team starts work on **node2** today. Its two members are:

  | Member | Source | UID | Primary group |
  | --- | --- | --- | --- |
  | `teamlead` | local account on node2 | 3100 | `platform` (local, GID 3100) |
  | `ldapdev` | the directory on **node1** (`dc=lab,dc=internal`) | 2300 | `ldapops` (directory, GID 2300) |

  The onboarding ticket promised them:

  - a shared tree, `/srv/platform`, where both teams read and write each other's files,
    including files created later, and nobody else gets in;
  - `TEAM_REGION=amman` in every login shell;
  - a soft limit of 4096 open files for members of both groups;
  - for `teamlead`, SSH logins from their workstation (node1) with their key.

  It is 9:00 and the complaints have started: `ldapdev` is "the wrong user", `teamlead`
  cannot open the team's files, and the SSH key "does nothing". node1 is 10.65.0.1 and
  node2 10.65.0.20. Fix node2 so that everything on the ticket works.
requirements:
  - "`ldapdev` and `ldapops` come from the directory, with their directory IDs."
  - "`teamlead` is the local account with UID 3100 and primary group `platform`."
  - "In `/srv/platform`, both groups can read and write each other's files, existing and new; other users cannot even list it."
  - "Login shells of both members get `TEAM_REGION=amman` and a soft limit of 4096 open files."
  - "From node1, `teamlead` logs in to node2 with the key `~/.ssh/lal_teamlead`."
  - "All of this still holds after node2 reboots."
hints:
  - "Start from what each name resolves to: `getent passwd ldapdev` and `getent -s sss passwd ldapdev` (directory only) disagree. `/etc/nsswitch.conf` decides who wins."
  - "`ls -ln` shows numeric owners; compare them with the roster. `usermod` changes a UID and the files in the home directory, nothing else. sshd's journal says why it refused a login."
  - "Login shells source only `/etc/profile.d/*.sh`. In `limits.conf(5)`, a group is written `@group`. `getfacl` shows a directory's default ACL."
debrief: |
  ## What was wrong

  1. **A stale local `ldapdev`** (UID 4300) from a trial before the directory existed.
     `/etc/nsswitch.conf` lists `files` before `sss`, so the local account shadowed the
     directory one.
  2. **teamlead had UID 3099** and its own group, so the team files, owned by 3100, were
     someone else's.
  3. **`/srv/platform` was mode 0700 root**, with no ACLs.
  4. **The profile snippet was `lal-team.conf`.** `/etc/profile` sources only `*.sh` files
     from `/etc/profile.d/`.
  5. **The limits line said `platform`**, which matches a user called platform; groups are
     written `@platform`, and `ldapops` had no line at all.
  6. **SSH followed from 2.** node2 admits SSH logins only from `wheel` and `platform`
     (`AllowGroups` in `/etc/ssh/sshd_config.d/60-platform-host.conf`), and teamlead was not
     in `platform`. sshd logged:
     `User teamlead from 10.65.0.1 not allowed because none of user's groups are listed in AllowGroups`.
     Fixing the account fixed the login; nothing in sshd needed to change.

  ## A clean fix

  ```bash
  sudo userdel -r ldapdev && sudo sss_cache -E
  sudo mkhomedir_helper ldapdev        # the directory account gets a home from /etc/skel
  sudo usermod -u 3100 -g platform teamlead
  sudo chgrp platform /srv/platform && sudo chmod 2770 /srv/platform
  sudo setfacl -R -m g:platform:rwX,g:ldapops:rwX,o::--- /srv/platform
  sudo find /srv/platform -type d -exec setfacl -m d:g:platform:rwX,d:g:ldapops:rwX,d:o::--- {} +
  sudo mv /etc/profile.d/lal-team.conf /etc/profile.d/lal-team.sh
  sudo sed -i 's/^platform\b/@platform/' /etc/security/limits.d/80-lal-team.conf
  echo '@ldapops soft nofile 4096' | sudo tee -a /etc/security/limits.d/80-lal-team.conf
  ```

  The default ACL is what makes files created later shareable: new files inherit the
  `ldapops` and `platform` entries, whatever the creator's umask.

  ## Check it yourself

  ```bash
  id ldapdev; id teamlead
  getfacl /srv/platform
  sudo runuser -l ldapdev -c 'echo $TEAM_REGION; ulimit -Sn'
  ssh -i ~/.ssh/lal_teamlead teamlead@10.65.0.20 id     # on node1, as teamlead
  ```

  ## Tempting but wrong

  - **Renumbering the local `ldapdev` to 2300**, which `usermod` allows only with
    `--non-unique` because the directory already has that UID. `id` looks right, and the
    account is a local copy that will drift from the directory: password, groups, and
    removal all happen in the wrong place.
  - **`chmod 1777`.** Everyone can share files, including everyone outside the team.
