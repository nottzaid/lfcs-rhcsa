schema_version: 1
scenario_id: secure-web-deployment
version: 2
status: verified
title: The intranet site went dark when it moved to HTTPS
summary: A TLS migration left a site down behind four faults, across SELinux, the firewall, the certificate chain, and file labels.
estimated_minutes: 60
task_type: troubleshoot
difficulty: exam
task: |
  Yesterday the intranet site on **node2** moved to HTTPS: nginx now serves
  `/srv/lal-secure` at `https://service.internal:8443/`, with a certificate from the
  company's issuing CA. The new key was generated during the renewal and moved into
  `/etc/lal-pki/private/`. Since then the site has been unreachable.

  Company machines, such as **client** (10.45.0.50), trust only the company **root** CA,
  and nobody will change that on every machine. node2 is 10.45.0.10 on the intranet.

  Get the site working for clients again. Work on node2; security controls stay on.
requirements:
  - "From **client**, `https://service.internal:8443/` answers `secure-ready`, verified against the company root CA."
  - "client is not changed: it trusts the same certificate authorities as before."
  - "SELinux stays enforcing, and every label under `/etc/lal-pki` and `/srv/lal-secure` matches the policy, so a relabel changes nothing."
  - "The private key stays owned by root and unreadable by other users."
  - "nginx starts at boot, firewalld keeps running, and all of this still holds after node2 reboots."
hints:
  - "Follow one request from client to the page, and fix what stops it at each step: `curl -v https://service.internal:8443/` on client; `systemctl status nginx`, `nginx -t` and `sudo ausearch -m AVC -ts recent` on node2."
  - "`ls -Z` shows labels. A file created elsewhere and moved keeps its old label; `restorecon` resets a file to what the policy says, and `semanage fcontext` changes what the policy says."
  - "`openssl s_client -connect service.internal:8443 -showcerts` shows the chain the server sends. A client that trusts only the root needs the server to send the issuing CA certificate too: nginx's `ssl_certificate` file can hold the server certificate followed by its issuer."
debrief: |
  ## What was wrong

  Four faults, met one after another along the request's path:

  1. **The key's label.** Created in `/root` and moved, the key kept `admin_home_t`, which
     nginx may not read, so nginx did not start:
     `cannot load certificate key "/etc/lal-pki/private/service.key" ... Permission denied`.
     `mv` keeps a file's label; `cp` would have given it the label of its new directory.
  2. **The firewall.** Nothing allowed 8443, so client got `No route to host`.
  3. **The chain.** nginx sent only the server certificate. client trusts the root CA, which
     signed the issuing CA, which signed the server certificate; without the middle link
     curl says `SSL certificate problem: unable to get local issuer certificate`.
  4. **The content's label.** `/srv/lal-secure` inherited `var_t`, which nginx may not
     read, so the page was `403 Forbidden`.

  ## A clean fix

  ```bash
  sudo restorecon -Rv /etc/lal-pki
  cat /etc/lal-pki/service.crt /etc/lal-pki/issuing-ca.crt | sudo tee /etc/lal-pki/service-chain.crt
  #   ssl_certificate /etc/lal-pki/service-chain.crt;   in /etc/nginx/conf.d/lal-secure.conf
  sudo semanage fcontext -a -t httpd_sys_content_t '/srv/lal-secure(/.*)?'
  sudo restorecon -Rv /srv/lal-secure
  sudo firewall-cmd --permanent --add-port=8443/tcp && sudo firewall-cmd --reload
  sudo nginx -t && sudo systemctl restart nginx
  ```

  The order of the certificates matters: the server's own certificate first, then its
  issuer. The root is not sent; clients must already have it. `semanage fcontext -a -e
  /var/www /srv/lal-secure` labels the tree like the standard web root, and a rich rule
  that opens 8443 only to 10.45.0.0/24 is a tighter firewall change.

  ## Check it yourself

  ```bash
  curl https://service.internal:8443/                          # on client
  openssl s_client -connect service.internal:8443 -showcerts </dev/null | grep -E '^ *[0-9] s:'
  sudo restorecon -Rnv /etc/lal-pki /srv/lal-secure            # prints nothing
  ```

  ## Tempting but wrong

  - **`chcon`.** The labels are right until the next relabel puts the old ones back.
  - **Making client trust the issuing CA.** It fixes one machine; every other company
    machine still fails, because the server still sends an incomplete chain.
