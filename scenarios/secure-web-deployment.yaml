topology:
  networks:
    - {name: intranet, cidr: 10.45.0.0/24}
  hosts:
    - name: node2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: intranet, name: intra0}]
    - name: client
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: intranet, name: intra0}]
checks:
  - check_id: client-gets-the-site
    kind: command
    target: client
    description: client gets secure-ready over verified HTTPS.
    parameters:
      script: |
        answer=$(curl --silent --show-error --max-time 5 https://service.internal:8443/ 2>&1) ||
          { answer=${answer#curl: }; fail "client cannot fetch the site: ${answer%%$'\n'*}"; }
        expect_eq "$answer" secure-ready "the page client gets"
  - check_id: client-unchanged
    kind: command
    target: client
    description: client trusts the same certificate authorities as before.
    parameters:
      script: |
        [[ $(ls /etc/pki/ca-trust/source/anchors | sha256sum) == "$(cat /usr/share/lal-secure/anchors.sha256)" ]] ||
          fail "client's trust anchors changed: $(ls /etc/pki/ca-trust/source/anchors | paste -sd' ' -)"
  - check_id: labels-match-policy
    kind: command
    target: node2
    description: SELinux is enforcing, and labels under /etc/lal-pki and /srv/lal-secure match policy.
    parameters:
      sudo: true
      script: |
        expect_eq "$(getenforce)" Enforcing "the SELinux mode"
        ! permissive_domain httpd_t || fail "the httpd_t domain is permissive"
        drift=$(restorecon -R -n -v /etc/lal-pki /srv/lal-secure | head -n 1)
        [[ -z $drift ]] || fail "a relabel would change labels: $drift"
  - check_id: key-stays-private
    kind: command
    target: node2
    description: The private key is owned by root and unreadable by other users.
    parameters:
      sudo: true
      script: |
        key=/etc/lal-pki/private/service.key
        [[ -f $key ]] || fail "$key is missing"
        expect_eq "$(stat -c %U "$key")" root "the owner of $key"
        mode=$(stat -c %a "$key")
        (( (8#$mode & 8#007) == 0 )) || fail "$key is readable by other users (mode $mode)"
  - check_id: nginx-running
    kind: service
    target: node2
    description: nginx runs and starts at boot.
    parameters: {name: nginx.service, active: true, enabled: true}
  - check_id: firewall-running
    kind: service
    target: node2
    description: firewalld keeps running.
    parameters: {name: firewalld.service, active: true}
persistence:
  reboot: true
  hosts: [node2]
setup: actions/secure-web-deployment.setup.yaml
reference_solution: actions/secure-web-deployment.solution.yaml
alternate_solutions: [actions/secure-web-deployment.alternate.yaml]
rejected_solutions:
  - actions/secure-web-deployment.rejected-chcon.yaml
  - actions/secure-web-deployment.rejected-client-trusts-the-issuer.yaml
