schema_version: 1
scenario_id: network-block-device-client
version: 1
status: draft
title: The database node has not attached its iSCSI volume
summary: Discover, persist, format, and mount a live network block device.
estimated_minutes: 35
task_type: build
difficulty: advanced
task: >-
  node1 publishes iSCSI target iqn.2026-08.internal.lab:storage with LUN 0. On node2,
  discover and log in to the target, make the node login automatic, create an XFS filesystem
  labeled LAL_DATABASE on the LUN, and mount it at /srv/database. Configure a persistent
  UUID- or label-based /etc/fstab entry with _netdev. Do not format any local disk.
objectives:
  - track: lfcs
    version: lfcs-2026-08
    objective_id: storage.remote-storage
    title: Use remote filesystems and network block devices
sources:
  - kind: scope
    title: Linux Foundation LFCS competencies
    url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  - kind: man-page
    title: iscsiadm manual
    man_page: iscsiadm(8)
  - kind: man-page
    title: targetcli manual
    man_page: targetcli(8)
topology:
  hosts:
    - name: node1
      image: rocky-10.2-lab-v1
      memory_mib: 1024
      vcpus: 1
      disks:
        - name: target
          size_mib: 1536
          role: iSCSI target backing device
    - name: node2
      image: rocky-10.2-lab-v1
      memory_mib: 1024
      vcpus: 1
checks:
  - check_id: iscsi-session-active
    kind: command
    target: node2
    description: node2 has an active session to node1's designated target.
    parameters:
      sudo: true
      arguments:
        - bash
        - -c
        - >-
          iscsiadm -m session | grep -Fq '{{host.node1.address}}:3260' &&
          iscsiadm -m session | grep -Fq 'iqn.2026-08.internal.lab:storage'
  - check_id: network-filesystem-mounted
    kind: command
    target: node2
    description: The LAL_DATABASE XFS filesystem is mounted at /srv/database.
    parameters:
      sudo: true
      arguments:
        - bash
        - -c
        - >-
          test "$(findmnt -n -o FSTYPE /srv/database)" = xfs &&
          test "$(findmnt -n -o LABEL /srv/database)" = LAL_DATABASE
  - check_id: iscsi-login-persistent
    kind: command
    target: node2
    description: The discovered target is configured for automatic startup.
    parameters:
      sudo: true
      arguments:
        - bash
        - -c
        - >-
          iscsiadm -m node -T iqn.2026-08.internal.lab:storage -p {{host.node1.address}}:3260 -o show |
          grep -Eq '^node.startup[[:space:]]*=[[:space:]]*automatic$'
  - check_id: network-mount-persistent
    kind: command
    target: node2
    description: fstab uses a stable filesystem ID with _netdev.
    parameters:
      arguments:
        - bash
        - -c
        - >-
          awk '$2=="/srv/database" && $1 ~ /^(UUID=|LABEL=LAL_DATABASE$)/ &&
               $4 ~ /(^|,)_netdev(,|$)/ {ok=1} END {exit !ok}' /etc/fstab
persistence:
  reboot: true
  hosts: [node2]
setup: actions/network-block-device-client.setup.yaml
reference_solution: actions/network-block-device-client.solution.yaml
alternate_solutions: [actions/network-block-device-client.alternate.yaml]
