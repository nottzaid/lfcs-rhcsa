    man_page: chrony.conf(5)
topology:
  networks:
    - {name: data, cidr: 10.80.0.0/24}
  hosts:
    - name: node1
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: data, name: data0}]
    - name: node2
      image: rocky-10.2-lab-v2
      memory_mib: 1024
      vcpus: 1
      nics: [{network: data, name: data0}]
      disks:
        - {name: remoteswap, size_mib: 768, role: dedicated swap disk}
checks:
  - check_id: job-completes
    kind: command
    target: node2
    description: As analyst, lal-crunch alpha completes and writes its report.
    parameters:
      sudo: true
      timeout_seconds: 90
      script: |
        output=$(cd / && runuser -u analyst -- /usr/local/bin/lal-crunch alpha 2>&1) || fail "$(tail -n 1 <<<"$output")"
        expect_eq "$(cat /data/projects/alpha/output/report.txt 2>/dev/null)" "alpha: 1000 rows, total 485771" "the report"
  - check_id: projects-on-demand
    kind: command
    target: node2
    description: autofs mounts node1's projects on demand, starts at boot, and fstab mounts no NFS share.
    parameters:
      sudo: true
      timeout_seconds: 60
      script: |
        nfs_at_boot=$(findmnt --fstab -n -t nfs,nfs4 -o TARGET | head -n 1)
        [[ -z $nfs_at_boot ]] || fail "/etc/fstab mounts an NFS share at $nfs_at_boot; the runbook wants it on demand"
        systemctl is-active --quiet autofs.service || fail "autofs is not running"
        systemctl is-enabled --quiet autofs.service || fail "autofs does not start at boot"
        ls /data/projects/alpha >/dev/null 2>&1 || true   # triggers the automount
        read -r fstype source <<<"$(findmnt -n -o FSTYPE,SOURCE --mountpoint /data/projects | tail -n 1)"
        [[ $fstype == nfs4 ]] || fail "nothing is mounted at /data/projects after accessing it"
        host=${source%%:*}
        [[ $(getent ahostsv4 "$host" | awk 'NR == 1 {print $1}') == 10.80.0.1 && ${source#*:} == /srv/lal-data/projects ]] ||
          fail "/data/projects comes from $source, not node1's /srv/lal-data/projects"
        findmnt -n -t autofs --mountpoint /data >/dev/null || fail "/data is not managed by autofs"
  - check_id: scratch-tmpfs
    kind: command
    target: node2
    description: /run/lal-data-cache is a 96 MiB tmpfs owned by analyst, mode 0750.
    parameters:
      script: |
        expect_eq "$(findmnt -n -o FSTYPE --mountpoint /run/lal-data-cache)" tmpfs "the filesystem at /run/lal-data-cache"
        size=$(df -B1 --output=size /run/lal-data-cache | tail -n 1 | tr -d ' ')
        expect_eq "$((size / 1048576)) MiB" "96 MiB" "the size of /run/lal-data-cache"
        expect_eq "$(stat -c '%U %a' /run/lal-data-cache)" "analyst 750" "the owner and mode of /run/lal-data-cache"
  - check_id: swap-ready
    kind: command
    target: node2
    description: The dedicated disk is swap at priority 50, and every fstab entry's device exists.
    parameters:
      sudo: true
      script: |
        disk=$(readlink -f /dev/disk/by-id/virtio-lal-remoteswap)
        priority=$(swapon --show=NAME,PRIO --noheadings --raw | awk -v disk="$disk" '$1 == disk {print $2}')
        [[ -n $priority ]] || fail "the dedicated swap disk is not in use as swap"
        expect_eq "$priority" 50 "the priority of the dedicated swap disk"
        problems=$(findmnt --verify 2>&1 | grep -E '\[E\]' | head -n 1)
        [[ -z $problems ]] || fail "/etc/fstab has a broken entry: ${problems#*\] }"
  - check_id: time-from-node1
    kind: command
    target: node2
    description: chronyd follows node1 only, and the clock agrees with it.
    parameters:
      timeout_seconds: 45
      script: |
        systemctl is-active --quiet chronyd.service || fail "chronyd is not running"
        following() { chronyc -n sources 2>/dev/null | awk '$1 == "^*" && $2 == "10.80.0.1" {found = 1} END {exit !found}'; }
        if ! retry 30 following; then
          sources=$(chronyc -n sources | awk 'NR > 2 {print $1, $2}' | paste -sd',' -)
          fail "chronyd does not follow 10.80.0.1; its sources: ${sources:-none}"
        fi
        others=$(chronyc -n sources | awk 'NR > 2 && $2 != "10.80.0.1" {print $2}' | paste -sd' ' -)
        [[ -z $others ]] || fail "chronyd also uses: $others"
        offset=$(chronyc -c tracking | cut -d, -f5)
        awk -v offset="$offset" 'BEGIN {exit !(offset < 1 && offset > -1)}' ||
          fail "node2's clock is $(chronyc tracking | sed -n 's/^System time *: //p')"
persistence:
  reboot: true
  hosts: [node2]
setup: actions/remote-data-platform-recovery.setup.yaml
reference_solution: actions/remote-data-platform-recovery.solution.yaml
alternate_solutions: [actions/remote-data-platform-recovery.alternate.yaml]
rejected_solutions:
  - actions/remote-data-platform-recovery.rejected-nfs-in-fstab.yaml
  - actions/remote-data-platform-recovery.rejected-fixed-until-reboot.yaml
  - actions/remote-data-platform-recovery.rejected-set-the-clock.yaml
