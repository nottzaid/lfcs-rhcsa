schema_version: 1
scenario_id: remote-data-platform-recovery
version: 2
status: verified
title: The rebuilt analysis host fails every job
summary: A host rebuilt from last year's configuration fails its jobs on stale mounts, a mistyped tmpfs, a missing swap disk, and a drifting clock.
estimated_minutes: 65
task_type: troubleshoot
difficulty: exam
task: |
  **node2** is the analysts' compute host. Last night it was rebuilt from the standard
  image, and configuration management restored its settings, unfortunately from a backup
  taken before the file server and node2's swap disk were replaced. Since then every job
  fails, for example:

  ```bash
  sudo -iu analyst lal-crunch alpha
  ```

  The analysis runbook says node2 must have:

  - the project share, node1's `/srv/lal-data/projects`, at `/data/projects`, mounted on
    demand by autofs, never at boot, because the file server has maintenance windows;
  - a 96 MiB tmpfs scratch area at `/run/lal-data-cache` for `analyst`, mode 0750;
  - its dedicated swap disk, `/dev/disk/by-id/virtio-lal-remoteswap`, in use at priority 50;
  - time from the site time server only.

  **node1** (10.80.0.1 on the data network) is both the file server and the site time
  server. Work on node2.
requirements:
  - "As `analyst`, `lal-crunch alpha` completes and writes its report."
  - "`/data/projects` is mounted on demand by autofs from node1's `/srv/lal-data/projects`, and `/etc/fstab` mounts no NFS share; autofs starts at boot."
  - "`/run/lal-data-cache` is a 96 MiB tmpfs owned by `analyst`, mode 0750."
  - "The dedicated swap disk is in use at priority 50, and every entry in `/etc/fstab` refers to a device that exists."
  - "chronyd follows node1 only, and node2's clock agrees with it."
  - "All of this still holds after node2 reboots."
hints:
  - "Let the job tell you what it trips over, fix that, and run it again. Each message points at one layer: the share, the scratch area, or the clock."
  - "`automount -m` prints the maps autofs would use; `findmnt` and `df -h` show what is mounted, and how big. In `/etc/fstab`, tmpfs sizes need a unit; `findmnt --verify` checks every entry."
  - "`swapon --show` lists active swap with priorities, `blkid` shows a device's UUID and label, and `mkswap -L` labels new swap. `chronyc sources` shows which time servers chronyd uses and whether they answer."
debrief: |
  ## What was wrong

  The restore brought back four settings that had gone stale:

  1. **The autofs map** named the old file server, `files.old.invalid`, and autofs was
     not even enabled:
     `lal-crunch: cannot read /data/projects/alpha/input.csv: No such file or directory`.
  2. **The scratch tmpfs** said `size=96`. tmpfs reads a bare number as bytes, so the
     scratch area held one page:
     `lal-crunch: cannot stage data in /run/lal-data-cache: No space left on device`.
  3. **The swap entry** pointed at the UUID of the replaced disk. Nothing was swapped to
     the dedicated disk, and every boot waited 90 seconds for a device that will never
     appear before giving up on it.
  4. **chrony** followed `ntp.old.invalid`, and node2's clock had drifted three hours
     ahead. The NFS server stamps files with its own clock, so the job noticed:
     `lal-crunch: this clock is 10800 s ahead of the file server; refusing to stamp results`.

  ## A clean fix

  ```bash
  sudo sed -i 's/files\.old\.invalid:/10.80.0.1:/' /etc/auto.data
  sudo systemctl enable --now autofs
  sudo sed -i 's#tmpfs size=96,#tmpfs size=96M,#' /etc/fstab
  sudo mkswap -L LAL_REMOTE_SWAP /dev/disk/by-id/virtio-lal-remoteswap
  sudo sed -i 's#^UUID=5d1b7c1e[^ ]*#LABEL=LAL_REMOTE_SWAP#' /etc/fstab
  sudo systemctl daemon-reload
  sudo mount -o remount /run/lal-data-cache && sudo swapon -a
  sudo sed -i 's/^server ntp\.old\.invalid iburst$/server 10.80.0.1 iburst/' /etc/chrony.conf
  sudo systemctl restart chronyd
  ```

  `mount -o remount` re-reads the entry in `/etc/fstab`, so the new size applies without
  unmounting. chronyd steps the clock on its first updates (`makestep` in chrony.conf),
  so the three hours disappear at once rather than over days.

  ## Check it yourself

  ```bash
  sudo -iu analyst lal-crunch alpha
  findmnt /data/projects; findmnt --verify
  swapon --show; df -h /run/lal-data-cache
  chronyc sources
  ```

  ## Tempting but wrong

  - **Mounting the share from `/etc/fstab`.** It works, and every boot now depends on the
    file server, which is exactly what the runbook rules out.
  - **Fixing only the running system** with `mount -o remount,size=96M` and `swapon -p 50`.
    The next boot brings back the one-page tmpfs, the missing swap, and the 90-second wait.
  - **Setting the clock by hand.** Jobs work today, and the clock drifts again.
objectives:
