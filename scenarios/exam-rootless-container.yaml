topology:
  hosts:
    - {name: node2, image: rocky-10.2-lab-v2, memory_mib: 1536, vcpus: 1}
checks:
  - check_id: cache-container
    kind: command
    target: node2
    description: app's container cache runs localhost/lal-cache:1 with the volume cachedata at /data.
    parameters:
      sudo: true
      timeout_seconds: 90
      script: |
        cd /  # rootless podman returns to the caller's directory, which app cannot enter
        uid=$(id -u app)
        as_app() { runuser -u app -- env XDG_RUNTIME_DIR=/run/user/$uid podman "$@"; }
        [[ -d /run/user/$uid ]] || fail "app has no running user session, so no rootless container can be running"
        running() { state=$(as_app inspect --format '{{.State.Status}} {{.ImageName}}' cache 2>/dev/null); [[ "$state" == "running localhost/lal-cache:1" ]]; }
        retry 40 running || fail "app's container cache is not running localhost/lal-cache:1 (${state:-no such container})"
        mounts=$(as_app inspect --format '{{range .Mounts}}{{.Name}}:{{.Destination}} {{end}}' cache)
        [[ " $mounts " == *" cachedata:/data "* ]] || fail "the volume cachedata is not mounted at /data (${mounts:-no mounts})"
  - check_id: heartbeat-in-volume
    kind: command
    target: node2
    description: The container writes its heartbeat into the volume.
    parameters:
      sudo: true
      timeout_seconds: 60
      script: |
        cd /  # rootless podman returns to the caller's directory, which app cannot enter
        uid=$(id -u app)
        volume=$(runuser -u app -- env XDG_RUNTIME_DIR=/run/user/$uid podman volume inspect cachedata --format '{{.Mountpoint}}' 2>/dev/null) \
          || fail "app has no volume cachedata"
        fresh() { [[ -n "$(find "$volume/heartbeat" -newermt '-30 seconds' 2>/dev/null)" ]]; }
        retry 30 fresh || fail "nothing has written $volume/heartbeat in the last 30 seconds"
  - check_id: lingering
    kind: command
    target: node2
    description: app's user instance runs without a login.
    parameters:
      script: expect_eq "$(loginctl show-user app --property=Linger --value 2>/dev/null)" yes "linger for app"
persistence:
  reboot: true
  hosts: [node2]
setup: actions/exam-rootless-container.setup.yaml
reference_solution: actions/exam-rootless-container.solution.yaml
rejected_solutions:
  - actions/exam-rootless-container.rejected-restart-policy.yaml
  - actions/exam-rootless-container.rejected-rootful.yaml
