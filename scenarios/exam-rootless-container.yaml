schema_version: 1
scenario_id: exam-rootless-container
version: 1
status: verified
collection: exam
title: Run a rootless container that starts at boot
summary: Run a user's container with a named volume, started by systemd even when the user is not logged in.
estimated_minutes: 8
task_type: configure
difficulty: advanced
task: |
  On `node2`, as the user `app` (rootless podman), run a container:

  - named `cache`, from the image `localhost/lal-cache:1`, which is already in `app`'s image
    store;
  - with a named volume `cachedata` mounted at `/data`;
  - started automatically when node2 boots, even if `app` never logs in.
requirements:
  - "`app`'s container `cache` runs `localhost/lal-cache:1` with the volume `cachedata` at `/data`."
  - "The container writes its heartbeat into the volume."
  - "It runs again after node2 reboots, with nobody logged in."
debrief: |
  ## One way to do it

  ```bash
  sudo loginctl enable-linger app
  sudo -iu app
  mkdir -p ~/.config/containers/systemd
  cat > ~/.config/containers/systemd/cache.container <<'UNIT'
  [Container]
  ContainerName=cache
  Image=localhost/lal-cache:1
  Volume=cachedata:/data

  [Install]
  WantedBy=default.target
  UNIT
  systemctl --user daemon-reload
  systemctl --user start cache.service
  ```

  A rootless container runs under the user's own systemd instance, which normally exists
  only while the user is logged in. `loginctl enable-linger` starts that instance at boot
  and keeps it running. Quadlet files in `~/.config/containers/systemd` become user
  services; `WantedBy=default.target` starts them with the user's instance.

  If `systemctl --user` complains about the bus, log in as `app` over SSH or with
  `machinectl shell app@`; `sudo -iu` does not set up a user session everywhere.

  ## Check it yourself

  ```bash
  loginctl show-user app -p Linger
  podman ps                      # as app
  podman volume inspect cachedata --format '{{.Mountpoint}}'
  ```

  ## Tempting but wrong

  - **`podman run --restart=always`.** Nothing starts the container after a reboot.
  - **No linger.** The user service starts when `app` logs in, and not before.
  - **A container run by root.** It is not `app`'s, and runs with root's privileges.
objectives:
