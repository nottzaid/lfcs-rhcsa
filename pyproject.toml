[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linux-admin-lab"
version = "0.1.0"
description = "A local, reproducible, self-grading Linux administration lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "libvirt-python>=12.6,<13",
  "markdown-it-py>=3.0,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
labctl = "sysadmin_lab.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "httpx>=0.28,<1",
  "mypy>=1.16,<2",
  "pykickstart>=3.77,<4",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sysadmin_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/sysadmin_lab/web_assets" = "sysadmin_lab/web_assets"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "live: requires a local system libvirt/KVM environment",
]

[tool.coverage.run]
branch = true
source = ["sysadmin_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sysadmin_lab"]
