schema_version: 1
scenario_id: network-probe
version: 1
status: draft
title: Isolated scenario networks work end to end
summary: Live platform test for scenario networks, NIC naming, and the check library.
estimated_minutes: 5
task_type: configure
difficulty: foundation
task: Probe.
objectives:
  - {track: lfcs, version: lfcs-2026-08, objective_id: networking.ip-hostname, title: Probe}
sources:
  - {kind: man-page, title: nmcli, man_page: nmcli(1)}
topology:
  networks:
    - {name: lan, cidr: 10.99.0.0/24}
  hosts:
    - {name: router, image: rocky-10.2-lab-v2, memory_mib: 1024, vcpus: 1, nics: [{network: lan, name: lan0}]}
    - {name: client, image: rocky-10.2-lab-v2, memory_mib: 1024, vcpus: 1, nics: [{network: lan, name: lan0}]}
checks:
  - check_id: router-interface-named
    kind: command
    target: router
    description: The scenario NIC is called lan0 and NetworkManager made no automatic profile for it.
    parameters:
      script: |
        test -e /sys/class/net/lan0 || fail "no lan0: $(ls /sys/class/net | tr '\n' ' ')"
        ! nmcli -g NAME connection show | grep -q '^Wired connection' || fail "NM created $(nmcli -g NAME connection show | tr '\n' ',')"
        test -e /sys/class/net/enp1s0 || fail "management NIC renamed: $(ls /sys/class/net | tr '\n' ' ')"
        expect_eq "$(cat /sys/class/net/lan0/carrier)" 1 "lan0 carrier"
        ! systemctl is-failed --quiet NetworkManager-wait-online.service || fail "NetworkManager-wait-online failed: $(journalctl -b -u NetworkManager-wait-online --output=cat | tail -1)"
  - check_id: boot-never-waited-on-scenario-nics
    kind: command
    target: client
    description: The scenario NIC has carrier, and booting never waited for DHCP on it.
    parameters:
      script: |
        expect_eq "$(cat /sys/class/net/lan0/carrier)" 1 "lan0 carrier"
        ! systemctl is-failed --quiet NetworkManager-wait-online.service || fail "NetworkManager-wait-online failed: $(journalctl -b -u NetworkManager-wait-online --output=cat | tail -1)"
  - check_id: client-reaches-router
    kind: command
    target: client
    description: The client reaches the router across the isolated segment.
    parameters: {arguments: [ping, -c, "2", -W, "2", 10.99.0.1]}
  - check_id: library-sysctl
    kind: command
    target: router
    description: The check library reads boot-time sysctl configuration.
    parameters:
      script: expect_eq "$(sysctl_configured net.ipv4.ip_forward)" 1 "configured forwarding"
  - check_id: library-fstab
    kind: command
    target: router
    description: The check library reads fstab options.
    parameters:
      script: |
        options=$(fstab_field /mnt/probe OPTIONS)
        has_option "$options" size || fail "fstab options for /mnt/probe are ${options:-missing}"
        expect_eq "$(option_value "$options" size)" 16m "tmpfs size"
        expect_eq "$(fstab_field /mnt/probe FSTYPE)" tmpfs "filesystem type"
persistence: {reboot: true, hosts: [router, client]}
setup: actions/network-probe.setup.yaml
reference_solution: actions/network-probe.solution.yaml
alternate_solutions: [actions/network-probe.alternate.yaml]
rejected_solutions:
  - actions/network-probe.rejected-runtime-only.yaml
  - actions/network-probe.rejected-wrong-address.yaml
